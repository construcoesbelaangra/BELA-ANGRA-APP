/* =========================================================
   LANÇAMENTO DE PONTO POR DIA
   A outra ponta do calendário: em vez de um funcionário por vez no mês,
   escolhe-se o DIA e marca-se a equipe inteira de uma vez. É como o Maycon
   trabalha — chega na obra, olha quem está lá.

   Presença é o padrão (é o mais provável), preenchida como "a confirmar".
   Tocar no dia confirma. O que sobra sem confirmar é cobrado pela faixa de aviso.
   ========================================================= */

let pdiaData = null;         // dia sendo lançado
let pdiaObra = '';           // filtro de obra
let pdiaTipo = 'fichado';    // qual folha está aberta ('fichado' | 'diarista')

function initPdia(){ if(!pdiaData) pdiaData = todayISO(); }

/* ---------- leitura/escrita de um dia, independente do tipo ---------- */
function statusDoDia(f, iso){
  if(f.tipo === 'fichado'){
    const reg = DB.pontoMensal[`${f.id}_${iso.slice(0,7)}`];
    if(!reg) return {status:'', auto:false};
    return {status: reg.dias[iso] || '', auto: !!(reg.auto||{})[iso]};
  }
  const e = DB.pontoDiarista.find(x=>x.funcionarioId===f.id && x.data===iso);
  return e ? {status: e.status||'', auto: !!e.auto} : {status:'', auto:false};
}

/* grava o status de um dia. `auto` diz se é presunção do sistema ou decisão do usuário. */
function setStatusDoDia(f, iso, status, auto){
  if(foraDoVinculo(f, iso)) return false;
  if(f.tipo === 'fichado'){
    const k = `${f.id}_${iso.slice(0,7)}`;
    const reg = DB.pontoMensal[k] = DB.pontoMensal[k] || {dias:{}, ts:{}, auto:{}};
    reg.dias = reg.dias||{}; reg.ts = reg.ts||{}; reg.auto = reg.auto||{};
    reg.dias[iso] = status;
    if(auto) reg.auto[iso] = true; else delete reg.auto[iso];
  } else {
    let e = DB.pontoDiarista.find(x=>x.funcionarioId===f.id && x.data===iso);
    if(!e){
      if(!status) return true;
      e = {id:uid(), funcionarioId:f.id, obraId:f.obraPadrao||'', data:iso, status:'', quentinha:false};
      DB.pontoDiarista.push(e);
    }
    e.status = status;
    if(auto) e.auto = true; else delete e.auto;
    if(!e.obraId) e.obraId = f.obraPadrao||'';
    if(!e.status && !e.quentinha) DB.pontoDiarista = DB.pontoDiarista.filter(x=>x.id!==e.id);
  }
  return true;
}

/* clique nos botões da tela do dia — sempre confirma (auto = false) */
function marcarDia(funcId, iso, status){
  const f = func(funcId);
  const bloq = motivoBloqueio(f, iso);
  if(bloq){ alert(`${f.nome}: ${bloq}.`); return; }
  setStatusDoDia(f, iso, status, false);
  saveDB(); renderPontoDia();
}

/* confirma em lote tudo que estiver presumido naquele dia */
function confirmarDiaInteiro(){
  initPdia();
  const lista = equipeDoDia();
  let n = 0;
  lista.forEach(f=>{
    const s = statusDoDia(f, pdiaData);
    if(s.auto && s.status){ setStatusDoDia(f, pdiaData, s.status, false); n++; }
  });
  if(!n){ toast('Nada a confirmar neste dia.'); return; }
  saveDB(); renderPontoDia();
  toast(`${n} lançamento(s) confirmado(s) em ${fmtDate(pdiaData)}.`);
}

function equipeDoDia(){
  initPdia();
  /* 'todos' junta as duas folhas: é como se aponta na obra, onde fichado e
     diarista estão lado a lado. A ordenação padrão (cargo, antigo primeiro)
     vale para a lista inteira, sem separar por vínculo. */
  /* ativosNoPeriodo(dia,dia) já cobre o vínculo (admissão/demissão) igual ao
     foraDoVinculo, e por isso substitui o antigo "&& f.status!=='inativo'":
     aquele bloqueava até quem foi demitido DENTRO do próprio dia sendo
     lançado — um diarista admitido dia 10 e demitido dia 14 sumia do Ponto
     antes de dar para marcar a presença dos dias 10 a 14 que ele trabalhou. */
  const base = ativosNoPeriodo(pdiaData, pdiaData).filter(f=>
    (pdiaTipo === 'todos' || f.tipo === pdiaTipo));
  return ordenarFuncionarios(filtraObra(base, pdiaObra));
}

/* ---------- faixa de aviso, mostrada nas duas folhas ---------- */
function faixaPendencias(tipo){
  const p = totalPresumidosAteHoje(tipo);
  if(!p.n) return `<p class="help" style="margin:0 0 14px;padding:9px 12px;background:#eef8f1;border-radius:8px;color:#1f6b3e;">
      <b>Ponto em dia.</b> Não há presença presumida esperando confirmação.
    </p>`;
  return `
  <div style="margin:0 0 14px;padding:11px 14px;background:#fdf3e2;border-radius:8px;color:#8a5a00;border-left:4px solid var(--amarelo);">
    <div style="font-weight:700;font-size:13px;margin-bottom:4px;">
      ${p.n} dia(s) de presença ainda não conferidos${p.maisAntigo?` — o mais antigo é ${fmtDate(p.maisAntigo)}` : ''}
    </div>
    <div class="help" style="color:#8a5a00;margin:0 0 8px;">
      O sistema preencheu como <b>presença</b>, que é o mais provável. Mas presença presumida
      vira dinheiro cobrado do cliente e pago ao funcionário — <b>confira e marque quem faltou</b>.
      Se você ficou uns dias fora, volte nos dias e ajuste.
    </div>
    ${p.maisAntigo?`<button class="btn btn-primary btn-sm" onclick="pontoTipo='${tipo}'; pdiaTipo='${tipo}'; pdiaData='${p.maisAntigo}'; pontoAba='dia'; goTo('ponto');">
      Ir para ${fmtDate(p.maisAntigo)} →</button>`:''}
  </div>`;
}

/* ---------- a tela ---------- */
function renderPontoDia(){
  initPdia();
  const c = document.getElementById('content');
  const lista = equipeDoDia();
  const hoje = todayISO();
  const futuro = ehFuturo(pdiaData);
  const dow = DOW_FULL[dowOf(pdiaData)];
  const fimDeSemana = dowOf(pdiaData)===0 || dowOf(pdiaData)===6;
  /* na folha "Todos" os dois vínculos aparecem juntos, e os botões de cada
     linha são diferentes — a coluna de vínculo é o que explica a diferença */
  const misto = pdiaTipo === 'todos';

  let nTrab=0, nFalta=0, nVazio=0, nAuto=0;
  lista.forEach(f=>{
    const s = statusDoDia(f, pdiaData);
    if(s.status==='trabalhado') nTrab++;
    else if(s.status && s.status.indexOf('falta')===0) nFalta++;
    else if(!s.status) nVazio++;
    if(s.auto && s.status) nAuto++;
  });

  /* No computador o botão mostra a palavra inteira; no celular só a inicial, que
     é o que cabe. Os dois textos vão no HTML e o CSS escolhe qual mostrar por
     tamanho de tela — assim girar o aparelho não precisa redesenhar nada.
     O title vale para os dois: passando o mouse, ou segurando o toque, lê-se o
     significado por extenso. */
  const botoes = (f) => {
    const s = statusDoDia(f, pdiaData);
    const op = (valor, inicial, rotulo, cor) => `
      <button class="btn btn-sm ${s.status===valor?'':'btn-secondary'}"
        style="${s.status===valor?`background:${cor};color:#fff;`:''}"
        title="${esc(rotulo)}"
        onclick="marcarDia('${f.id}','${pdiaData}','${valor}')"><span
        class="ini">${inicial}</span><span class="detalhe">${rotulo}</span></button>`;
    if(f.tipo === 'fichado'){
      return op('trabalhado',          'P',  'Presente',           '#1f8a4c')
           + op('falta_injustificada', 'F',  'Falta',              '#c0392b')
           + op('falta_justificada',   'FJ', 'Falta justificada',  '#b8860b')
           + op('atestado',            'FA', 'Falta com atestado', '#1c4fd8')
           + op('',                    '—',  'Sem lançamento',     '#6c7280');
    }
    return op('trabalhado', 'P', 'Presente',       '#1f8a4c')
         + op('falta',      'F', 'Falta',          '#c0392b')
         + op('',           '—', 'Sem lançamento', '#6c7280');
  };

  /* Cargo abreviado no celular: as 4 primeiras letras bastam para reconhecer
     (Servente -> Serv, Pedreiro -> Pedr, Armador -> Arma) e devolvem a largura
     que o nome precisa para caber em uma linha só. */
  const cargoCurto = (t) => {
    t = (t||'').trim();
    if(!t) return '—';
    return t.length <= 4 ? t : t.substring(0,4);
  };

  /* Filtrou por uma obra? Então a coluna de obra é redundante — todo mundo da
     lista é daquela obra. Ela só aparece com o filtro em "todas". */
  const mostrarObra = !pdiaObra;

  c.innerHTML = `
    ${abasPonto(pdiaTipo)}
    ${faixaPendencias(pdiaTipo)}
    <div class="card">
      <div class="grid grid-4" style="align-items:end;">
        <div class="field" style="margin:0;"><label>Dia</label>
          <input type="date" value="${pdiaData}" onchange="pdiaData=this.value; renderPontoDia();">
        </div>
        <div class="field" style="margin:0;"><label>Navegar</label>
          <div style="display:flex;gap:5px;">
            <button class="btn btn-secondary btn-sm" onclick="pdiaData=addDays(pdiaData,-1); renderPontoDia();">◀ dia</button>
            <button class="btn btn-secondary btn-sm" onclick="pdiaData='${hoje}'; renderPontoDia();">Hoje</button>
            <button class="btn btn-secondary btn-sm" onclick="pdiaData=addDays(pdiaData,1); renderPontoDia();">dia ▶</button>
          </div>
        </div>
        <div class="field" style="margin:0;"><label>Obra</label>
          <select onchange="pdiaObra=this.value; renderPontoDia();">${opcoesObra(pdiaObra)}</select>
        </div>
        <div class="field" style="margin:0;"><label>Ordem da lista</label>${selectOrdem('renderPontoDia();')}</div>
      </div>

      <div style="margin:12px 0;font-size:13px;color:var(--chumbo-claro);">
        <b>${fmtDate(pdiaData)} · ${dow}</b>
        ${fimDeSemana?' <span class="badge badge-yellow">fim de semana</span>':''}
        ${futuro?' <span class="badge badge-blue">data futura — o que estiver aqui é previsão</span>':''}
        · ${lista.length} pessoa(s)
        ${nAuto?` · <span style="color:var(--amarelo);font-weight:700;">${nAuto} a confirmar</span>`:''}
      </div>

      <div class="grid grid-4" style="margin-bottom:12px;">
        <div class="kpi"><div class="v" style="color:var(--verde);">${nTrab}</div><div class="l">Trabalharam</div></div>
        <div class="kpi"><div class="v" style="color:var(--vermelho);">${nFalta}</div><div class="l">Faltaram</div></div>
        <div class="kpi"><div class="v">${nVazio}</div><div class="l">Sem lançamento</div></div>
        <div class="kpi"><div class="v" style="color:var(--amarelo);">${nAuto}</div><div class="l">A confirmar neste dia</div></div>
      </div>

      ${lista.length ? `
      <div class="acoes-dia" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        ${(()=>{ const branco = emBrancoNesteDia(), pend = presumidosNesteDia();
          /* A sequência do caminho curto, nesta ordem, porque é o passo a passo:
             ⚡ preenche → marca as faltas → ✓ confirma o resto.
             O de confirmar fica SEMPRE na tela, apagado enquanto não há o que
             confirmar — escondê-lo fazia ninguém descobrir que existia. */
          return `<button class="btn btn-sm" style="background:var(--azul);color:#fff;"
            onclick="preencherEsteDia()" ${branco?'':'disabled'}
            title="${branco
              ? 'Marca como trabalhado quem ainda não tem lançamento neste dia. Não mexe no que você já lançou.'
              : 'Não há ninguém em branco neste dia.'}">
            ⚡ Todos vieram${branco?` (${branco})`:''}
          </button>
          <button class="btn btn-sm" style="background:var(--verde);color:#fff;"
            onclick="confirmarDiaInteiro()" ${pend?'':'disabled'}
            title="${pend
              ? 'Confirma de uma vez a presença que ainda está marcada como presumida neste dia.'
              : 'Acende depois que você preencher o dia. Serve para confirmar tudo de uma vez, depois de marcar as faltas.'}">
            ✓ Confirmar todos${pend?` (${pend})`:''}
          </button>`; })()}
        <button class="btn btn-secondary btn-sm" onclick="limparODia()">Limpar o dia</button>
      </div>

      <div class="table-wrap">
        <table class="ponto-dia nao-empilha">
          <thead><tr><th style="width:34px;">#</th><th>Funcionário</th>${
            misto?'<th>Vínculo</th>':''}<th>Cargo</th>${
            mostrarObra?'<th>Obra</th>':''}<th>Lançamento</th></tr></thead>
          <tbody>
            ${lista.map((f,i)=>{
              const s = statusDoDia(f, pdiaData);
              return `<tr${s.auto&&s.status?' style="background:#fffaf0;"':''}>
                <td class="num">${i+1}</td>
                <td class="nome" title="${esc(f.nome)}"><b>${esc(f.nome)}</b>${s.auto&&s.status?' <span class="badge badge-yellow" style="font-size:9.5px;">a confirmar</span>':''}</td>
                ${misto?`<td><span class="badge ${f.tipo==='fichado'?'badge-blue':'badge-yellow'}"><span class="ini">${f.tipo==='fichado'?'F':'D'}</span><span class="detalhe">${f.tipo==='fichado'?'Fichado':'Diarista'}</span></span></td>`:''}
                <td title="${esc(f.funcao||'')}"><span class="detalhe">${esc(f.funcao||'—')}</span><span class="ini">${esc(cargoCurto(f.funcao))}</span></td>
                ${mostrarObra?`<td style="font-size:11.5px;color:#6c7280;">${esc(obraNome(f.obraPadrao))}</td>`:''}
                <td class="lancamento">${botoes(f)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>` : `<div class="empty">${pdiaObra
          ? `Ninguém ${misto?'':'desta folha '}alocado nesta obra neste dia.`
          : `Ninguém ${misto?'':'desta folha '}com vínculo ativo neste dia.`}</div>`}

      <p class="help">
        O caminho curto, em três passos: <b>⚡ Todos vieram</b> → marque só quem faltou
        (isso já entra confirmado) → <b>✓ Confirmar todos</b>, que fecha o resto de uma vez.
        O ⚡ não mexe em nada que você já tenha lançado. Use as setas para voltar a qualquer
        dia e corrigir — nada fica travado.
      </p>
    </div>
  `;
}

/* quantos ainda estão sem lançamento no dia aberto — vira o número do botão */
function emBrancoNesteDia(){
  initPdia();
  return equipeDoDia().filter(f=>!statusDoDia(f, pdiaData).status).length;
}

/* quantos estão presumidos e esperando confirmação no dia aberto — é o que
   acende o botão "✓ Confirmar todos" */
function presumidosNesteDia(){
  initPdia();
  return equipeDoDia().filter(f=>{
    const s = statusDoDia(f, pdiaData);
    return s.auto && s.status;
  }).length;
}

/* UM CLIQUE: marca como trabalhado todo mundo que está na tela e ainda não tem
   lançamento neste dia. Depois é só marcar quem faltou.

   É a aposta certa: é muito mais provável que a equipe toda tenha ido do que o
   contrário, então preencher a presença e corrigir as faltas dá menos cliques do
   que marcar um por um.

   Três decisões de propósito:
   - **Não pergunta nada.** O ponto do pedido era menos clique; e não há o que
     desfazer, porque não sobrescreve.
   - **Não sobrescreve quem já foi lançado.** Pode ser apertado de novo depois de
     marcar as faltas, que as faltas continuam lá.
   - **Marca como PRESUMIDO** (`auto`), não como confirmado. É o que faz o botão
     "✓ Confirmar todos" acender, fechando a sequência que o Maycon desenhou:
     ⚡ preenche → marca as faltas (que já entram confirmadas) → ✓ confirma o
     resto de uma vez. Assim o diálogo de confirmação sai do caminho sem que
     presença nenhuma passe batida. */
function preencherEsteDia(){
  initPdia();
  const lista = equipeDoDia();
  if(!lista.length){ toast('Não há ninguém nesta lista para preencher.'); return; }
  let n = 0;
  lista.forEach(f=>{
    if(statusDoDia(f, pdiaData).status) return;      // já lançado: não encosta
    if(setStatusDoDia(f, pdiaData, 'trabalhado', true)) n++;
  });
  if(!n){ toast('Todo mundo deste dia já está lançado.'); return; }
  saveDB(); renderPontoDia();
  toast(`${n} marcado(s) como trabalhado em ${fmtDate(pdiaData)}. Marque quem faltou e confirme.`);
}

/* Escotilha de saída: apaga o dia inteiro para recomeçar. Essa pergunta antes,
   porque aqui sim se perde lançamento. */
function limparODia(){
  const lista = equipeDoDia();
  if(!lista.length) return;
  if(!confirm(`LIMPAR o lançamento de todos em ${fmtDate(pdiaData)}? (${lista.length} pessoa(s))`)) return;
  lista.forEach(f=> setStatusDoDia(f, pdiaData, '', false));
  saveDB(); renderPontoDia();
  toast(`Dia ${fmtDate(pdiaData)} limpo.`);
}

/* =========================================================
   PREENCHIMENTO AUTOMÁTICO DE PRESENÇA
   Marca os dias de semana como trabalhado, respeitando o vínculo,
   sem tocar em nada que já tenha lançamento.
   ========================================================= */
function preencherPresenca(tipo, ini, fim){
  let n = 0, pessoas = 0;
  /* ativosNoPeriodo, não status!=='inativo': mesmo motivo do equipeDoDia —
     quem foi demitido dentro do período escolhido precisa continuar entrando. */
  ativosNoPeriodo(ini, fim).filter(f=>
    (tipo==='todos' || f.tipo===tipo)).forEach(f=>{
    let tocou = false;
    let iso = ini;
    while(iso <= fim){
      const dw = dowOf(iso);
      if(dw>=1 && dw<=5 && !foraDoVinculo(f, iso)){
        const s = statusDoDia(f, iso);
        if(!s.status){                       // nunca sobrescreve o que já existe
          setStatusDoDia(f, iso, 'trabalhado', true);
          n++; tocou = true;
        }
      }
      iso = addDays(iso, 1);
    }
    if(tocou) pessoas++;
  });
  return {n, pessoas};
}

/* =========================================================
   FOLHA DE PONTO MENSAL PARA A CONTABILIDADE

   É o PDF que o Maycon manda todo mês para a contabilidade fechar as guias e
   gerar os holerites. Espelha as planilhas de
   `Meu Drive\Folha de Ponto\02 - Folha de Ponto para Contabilidade\<ano>\`,
   que até 28/08/2026 eram preenchidas à mão.

   O DESENHO DA PLANILHA (conferido contra Janeiro e Julho/2026):

     - Um bloco por SEMANA, sempre de segunda a sexta.
     - As semanas são as que TOCAM o mês: começa na segunda da semana do dia 1
       e termina na sexta da semana do último dia. Por isso o primeiro e o
       último bloco quase sempre têm dias do mês vizinho.
     - Dia de outro mês não conta e não leva status: leva o NOME DO MÊS a que
       pertence (na planilha de julho está escrito "JUNHO" nesses dias).
     - Cabeçalho em DUAS linhas: data em cima, dia da semana embaixo. Itens,
       FUNCIONÁRIO, CARGO e Total Diárias ocupam as duas (rowspan).
     - A última coluna do bloco é "Total Diárias": conta só os dias trabalhados
       DENTRO do mês.
     - A planilha antiga tinha ainda uma linha "D | E" (diária e extra) e duas
       colunas por dia. Saiu em 28/08/2026, a pedido do Maycon: o app não
       controla hora extra, então a coluna E ficava sempre vazia e só roubava
       largura do nome. O "Modelo Atualizado" dele já vem sem essa linha.

   O cabeçalho e a legenda saem em TODA página impressa — a contabilidade recebe
   as folhas soltas e precisa saber, em cada uma, de que mês e de que obra ela é.

   COMO ISSO É FEITO, e por que não do jeito óbvio:

   A primeira tentativa foi pôr cabeçalho e legenda no <thead> de uma tabela que
   envolvia o documento, contando que o navegador repete <thead> a cada quebra de
   página. **Funciona no Chrome/Edge e NÃO funciona no Safari do iPhone** — lá o
   cabeçalho saiu sozinho numa primeira página em branco e os blocos foram para a
   segunda em diante, sem repetir nada. (Relatado pelo Maycon em 28/08/2026.)

   Agora a paginação é feita AQUI, não pelo navegador: `blocosPorPagina()` calcula
   quantos blocos semanais cabem numa folha, os blocos são agrupados em páginas, e
   cada página leva o seu próprio cabeçalho + legenda e termina com um
   `page-break-after`. Sai igual em qualquer navegador, e não depende de nenhum
   comportamento de impressão.

   A conta é conservadora de propósito: sobrar um pouco de espaço branco no pé da
   folha é melhor do que um bloco vazar para uma página sem cabeçalho.

   Não tem campo de assinatura: é documento de trabalho entre o Maycon e a
   contabilidade, ninguém assina.

   A LEGENDA, igual à da planilha:
     1  = dia trabalhado        F  = falta
     FA = falta abonada por atestado
     FJ = falta abonada justificada
     FC = folga compensada      X  = fora do vínculo (não admitido / já saiu)

   Feriado: a planilha manual escreve "QUI - Feriado" no cabeçalho do dia. O app
   não tem cadastro de feriados, então não marca sozinho — na prática o feriado
   aparece como FC quando o dia é lançado como folga.
   ========================================================= */

/* status do app -> sigla da planilha da contabilidade */
const SIGLA_CONTABIL = {
  trabalhado:          '1',
  falta_injustificada: 'F',
  falta_justificada:   'FJ',
  atestado:            'FA',
  folga:               'FC'
};

/* Quantas linhas de tabela cabem numa folha, e daí quantos blocos semanais.

   Medidas em milímetros, contra o A4 com margem de 10mm (277mm úteis de altura).
   Os valores foram conferidos contra o PDF gerado; são deliberadamente folgados,
   porque o custo de errar para menos (bloco numa página sem cabeçalho) é bem maior
   do que o de errar para mais (espaço branco no pé). */
const FP_ALTURA_PAGINA = 277;   // mm úteis
const FP_CABECALHO     = 46;    // logo + endereço + título + legenda
const FP_LINHA         = 4.7;   // mm por linha de funcionário
const FP_BLOCO_FIXO    = 12;    // as 2 linhas de cabeçalho do bloco + o espaço entre blocos

function blocosPorPagina(nPessoas){
  const bloco = nPessoas * FP_LINHA + FP_BLOCO_FIXO;
  return Math.max(1, Math.floor((FP_ALTURA_PAGINA - FP_CABECALHO) / bloco));
}

/* quebra uma lista em pedaços de tamanho `n` */
function emPaginas(lista, n){
  const out = [];
  for(let i = 0; i < lista.length; i += n) out.push(lista.slice(i, i + n));
  return out;
}

/* a segunda-feira da semana em que a data cai (domingo pertence à semana anterior) */
function segundaDaSemana(iso){
  const dow = dowOf(iso);                 // 0=dom ... 6=sáb
  return addDays(iso, dow === 0 ? -6 : 1 - dow);
}

/* As semanas (segunda a sexta) que tocam o mês, cada uma como lista de 5 ISOs.

   Só entra a semana que tem PELO MENOS UM dia útil dentro do mês. Sem essa
   trava, um mês que começa no sábado (agosto/2026) abriria com um bloco inteiro
   do mês anterior — cinco colunas escritas "JULHO" e nenhuma diária. */
function semanasDoMes(ano, mes){
  const ym = `${ano}-${String(mes).padStart(2,'0')}`;
  const fim = ultimoDiaMes(ym);
  const semanas = [];
  let seg = segundaDaSemana(primeiroDiaMes(ym));
  while(seg <= fim){
    const dias = [];
    for(let i=0; i<5; i++) dias.push(addDays(seg, i));
    if(dias.some(iso => iso.slice(0,7) === ym)) semanas.push(dias);
    seg = addDays(seg, 7);
  }
  return semanas;
}

/* =========================================================
   RESUMO MENSAL DE FREQUÊNCIA — a segunda ficha

   A folha em blocos semanais mostra o dia a dia; esta mostra o mês fechado em
   números, uma linha por pessoa. São dois jeitos de contar a mesma coisa, para
   o Maycon mandar as duas e a contabilidade escolher a que preferir.

   O que entra aqui e NÃO está na outra:
   - dias úteis do mês e quantos deles a pessoa tinha vínculo (quem entra ou sai
     no meio do mês não deve o mês inteiro)
   - a soma de cada tipo de ocorrência
   - dias sem lançamento nenhum — é o furo do apontamento, e some na folha
     semanal, onde célula vazia se confunde com dia não trabalhado
   - a observação de admissão/demissão dentro do mês, que é o que muda o cálculo
     proporcional da contabilidade
   ========================================================= */
function resumoMesFuncionario(f, ym){
  const ini = primeiroDiaMes(ym), fim = ultimoDiaMes(ym);
  const reg = DB.pontoMensal[`${f.id}_${ym}`] || {dias:{}};
  const r = {uteis:0, comVinculo:0, trabalhado:0, injustificada:0, justificada:0,
             atestado:0, folga:0, semLancamento:0};
  let iso = ini;
  while(iso <= fim){
    const dw = dowOf(iso);
    if(dw >= 1 && dw <= 5){
      r.uteis++;
      if(!foraDoVinculo(f, iso)){
        r.comVinculo++;
        const st = reg.dias[iso] || '';
        if(st === 'trabalhado')               r.trabalhado++;
        else if(st === 'falta_injustificada') r.injustificada++;
        else if(st === 'falta_justificada')   r.justificada++;
        else if(st === 'atestado')            r.atestado++;
        else if(st === 'folga')               r.folga++;
        else                                  r.semLancamento++;
      }
    }
    iso = addDays(iso, 1);
  }
  return r;
}

function printResumoMensal(){
  const ano = pmAno, mes = pmMes;
  const ym = `${ano}-${String(mes).padStart(2,'0')}`;
  const ini = primeiroDiaMes(ym), fim = ultimoDiaMes(ym);

  const equipe = ordenarFuncionarios(
    filtraObra(ativosNoMes(ym).filter(f=>f.tipo==='fichado'), pmObraFiltro));

  if(!equipe.length){
    alert('Nenhum fichado com vínculo ativo neste mês'
      + (pmObraFiltro ? ' nesta obra. Troque a obra ou escolha "Todas as obras".' : '.')
      + '\n\nO resumo não foi gerado.');
    return;
  }

  const som = {comVinculo:0, trabalhado:0, injustificada:0, justificada:0,
               atestado:0, folga:0, semLancamento:0};
  let algumFuro = false;

  const linhas = equipe.map((f, i) => {
    const r = resumoMesFuncionario(f, ym);
    Object.keys(som).forEach(k => som[k] += r[k]);
    if(r.semLancamento) algumFuro = true;

    /* o que a contabilidade precisa saber para calcular proporcional */
    const obs = [];
    if(f.admissao && f.admissao >= ini && f.admissao <= fim) obs.push(`Admitido em ${fmtDate(f.admissao)}`);
    if(f.demissao && f.demissao >= ini && f.demissao <= fim){
      obs.push(`Demitido em ${fmtDate(f.demissao)}${f.motivoDemissao?' — '+esc(f.motivoDemissao):''}`);
    }
    if(r.semLancamento) obs.push(`<b>${r.semLancamento} dia(s) sem lançamento</b>`);

    return `<tr>
      <td class="c">${i+1}</td>
      <td>${esc(f.nome)}</td>
      <td>${esc((f.funcao||'—').toUpperCase())}</td>
      <td class="c">${f.admissao?fmtDate(f.admissao):'—'}</td>
      <td class="c">${r.comVinculo}</td>
      <td class="c"><b>${r.trabalhado}</b></td>
      <td class="c">${r.injustificada||''}</td>
      <td class="c">${r.justificada||''}</td>
      <td class="c">${r.atestado||''}</td>
      <td class="c">${r.folga||''}</td>
      <td class="obs">${obs.join('<br>')}</td>
    </tr>`;
  });   /* fica como LISTA de linhas: quem junta é o agrupamento por página */

  /* dias úteis do mês é igual para todos: calcula uma vez, com o primeiro */
  const uteis = resumoMesFuncionario(equipe[0], ym).uteis;
  const obraTxt = pmObraFiltro ? obraNome(pmObraFiltro) : 'Todas as obras';

  /* Mesma paginação da folha, e pelo mesmo motivo: o Safari do iPhone não repete
     <thead> na impressão. Aqui o que se quebra são as LINHAS, não blocos. */
  const cabTabela = `<thead><tr>
      <th class="c">Itens</th><th>FUNCIONÁRIO</th><th>CARGO</th>
      <th class="c">Admissão</th><th class="c">Dias no<br>vínculo</th>
      <th class="c">Traba-<br>lhados</th><th class="c">Faltas<br>injust.</th>
      <th class="c">Faltas<br>just.</th><th class="c">Ates-<br>tados</th>
      <th class="c">Folgas<br>/ DSR</th><th>Observações</th>
    </tr></thead>`;

  const porPagina = Math.max(1,
    Math.floor((FP_ALTURA_PAGINA - FP_CABECALHO - FP_BLOCO_FIXO) / FP_LINHA));
  const paginas = emPaginas(linhas, porPagina);

  const corpo = paginas.map((pag, i) => {
    const ultima = i === paginas.length - 1;
    return `
    <div class="fpag${ultima ? '' : ' quebra'}">
      ${docHead('Resumo Mensal de Frequência', `MÊS ${MESES[mes-1].toUpperCase()} / ${ano}`,
        `Obra<br><b>${esc(obraTxt)}</b><br>Emitida em ${fmtDate(todayISO())}`
        + (paginas.length > 1 ? `<br>Folha ${i+1} de ${paginas.length}` : ''))}
      <div class="flegenda">
        <b>${uteis}</b> dias úteis no mês (segunda a sexta) &nbsp;·&nbsp;
        <b>Dias no vínculo</b> = dias úteis em que a pessoa já estava admitida e ainda não
        havia saído &nbsp;·&nbsp; a soma das colunas de cada pessoa fecha com os dias no vínculo
      </div>
      <table class="dtab fresumo">
        ${cabTabela}
        <tbody>${pag.join('')}</tbody>
        ${ultima ? `<tfoot><tr>
          <td class="c" colspan="4">TOTAL — ${equipe.length} fichado(s)</td>
          <td class="c">${som.comVinculo}</td>
          <td class="c">${som.trabalhado}</td>
          <td class="c">${som.injustificada}</td>
          <td class="c">${som.justificada}</td>
          <td class="c">${som.atestado}</td>
          <td class="c">${som.folga}</td>
          <td class="obs">${som.semLancamento?`<b>${som.semLancamento} dia(s) sem lançamento</b>`:'Apontamento completo'}</td>
        </tr></tfoot>` : ''}
      </table>
      ${ultima ? `
        ${algumFuro ? `<p class="flegenda" style="background:#fdf3e2;border-color:#e6d3a8;">
          <b>Atenção:</b> há dias úteis dentro do vínculo <b>sem lançamento nenhum</b> — nem
          presença, nem falta. Eles não entram em nenhuma coluna e ficam de fora da conta.
          Confira no app antes de mandar para a contabilidade.
        </p>` : ''}
        <div class="dtotais">
          ${som.trabalhado} dia(s) trabalhado(s) no total · ${MESES[mes-1]} de ${ano}
        </div>
        ${docFoot()}` : ''}
    </div>`;
  }).join('');

  doPrint(`<div class="doc">${corpo}</div>`);
}

function renderCalendarDiarista(){

  const nd = daysInMonth(pdAno, pdMes);

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="day blank"></div>`;
  let dias=0, faltas=0, quent=0;

  for(let d=1; d<=nd; d++){
    const iso = `${pdAno}-${String(pdMes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const e = pdEntry(pdFuncId, iso);
    const st = e ? e.status : '';
    if(st==='trabalhado') dias++;
    else if(st==='falta') faltas++;
    if(e && e.quentinha) quent++;

    const bloqueado = antesDaAdmissao(f, iso);
    const porConfirmar = !!(e && e.auto && e.status);
    cells += `<div class="day ${st} ${bloqueado?'fora':''} ${porConfirmar?'aconfirmar':''}" onclick="cyclePd('${iso}')"

      <div class="nd">${d}${porConfirmar?'<span class="pend">•</span>':''}</div>
      <div class="st">${bloqueado?'<span style="color:#9aa0ab;">—</span>':(PD_SIGLA[st]||'')}</div>
      ${bloqueado?'':`<span class="qbtn ${e&&e.quentinha?'on':''}" onclick="event.stopPropagation(); toggleQuentinha('${iso}')" title="Marcar quentinha">🍱</span>`}

      <div style="font-size:12.5px;color:var(--chumbo-claro);margin-bottom:10px;">
        <b>${esc(f.nome)}</b> · ${esc(f.funcao||'—')} · ${fmtMoney(vd)}/dia ·
        <span class="badge badge-gray">${PERIODICIDADE_LABEL[f.periodicidade]}</span>
        <span class="badge ${f.tipoServico==='empreitada'?'badge-purple':'badge-gray'}">${SERVICO_LABEL[f.tipoServico]}</span>
        · Obra: ${esc(obraNome(f.obraPadrao))}
        ${f.admissao?` · admitido em ${fmtDate(f.admissao)}`:''}
        ${f.demissao?` · <b style="color:var(--vermelho,#c0392b);">demitido em ${fmtDate(f.demissao)}</b>`:""}
      </div>
      <div class="calendar">${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
      <div class="legend">
        <span><span class="dot" style="background:#e5f5ea"></span>Trabalhado (✓)</span>
        <span><span class="dot" style="background:#fdecea"></span>Falta (F)</span>
        <span>🍱 quentinha (clique no ícone)</span>
        ${f.admissao?'<span style="color:#9aa0ab;">— dias fora do vínculo (antes da admissão ou depois da demissão) ficam bloqueados</span>':''}
      </div>
      <p class="help">Clique no dia para alternar: trabalhado → falta → vazio. O pagamento é fechado na tela <b>Fechamento / Pagamento</b>, sempre por sexta-feira.</p>

        <div class="kpi"><div class="v">${dias}</div><div class="l">Diárias no mês</div></div>

        <div class="kpi"><div class="v">${quent}</div><div class="l">Quentinhas</div></div>
        <div class="kpi"><div class="v">${fmtMoney(total)}</div><div class="l">Bruto do mês (antes dos vales)</div></div>
      </div>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="goTo('fechamento')">Ir para o fechamento →</button>

function cyclePd(iso){
  const f = func(pdFuncId);
  if(antesDaAdmissao(f, iso)){ avisaAdmissao(f, iso); return; }
  let e = pdEntry(pdFuncId, iso);
  if(!e){
    DB.pontoDiarista.push({id:uid(), funcionarioId:pdFuncId, obraId:f.obraPadrao||'', data:iso, status:'trabalhado', quentinha:false});
  } else {
    const next = PD_CYCLE[(PD_CYCLE.indexOf(e.status)+1)%PD_CYCLE.length];
    delete e.auto;                                   // tocar no dia confirma
    if(next===''){
      if(e.quentinha){ e.status = ''; }              // mantém o registro só pela quentinha
      else DB.pontoDiarista = DB.pontoDiarista.filter(x=>x.id!==e.id);
    } else {
      e.status = next;
      if(!e.obraId) e.obraId = f.obraPadrao||'';
    }
  }
  saveDB(); renderPontoDiarista();
}

function toggleQuentinha(iso){
  const f = func(pdFuncId);
  if(antesDaAdmissao(f, iso)){ avisaAdmissao(f, iso); return; }
  let e = pdEntry(pdFuncId, iso);
  if(!e){
    DB.pontoDiarista.push({id:uid(), funcionarioId:pdFuncId, obraId:f.obraPadrao||'', data:iso, status:'', quentinha:true});
  } else {
    e.quentinha = !e.quentinha;
    if(!e.quentinha && !e.status) DB.pontoDiarista = DB.pontoDiarista.filter(x=>x.id!==e.id);
  }
  saveDB(); renderPontoDiarista();
}

/* ---- cálculo de um diarista dentro de um período ---- */
function calcDiarista(f, periodo){
  const vd = f.valorDiaria||0;
  let diasTrabalhados=0, faltas=0, quentinhas=0;
  const detalhe = [];
  let iso = periodo.inicio;
  while(iso <= periodo.fim){
    const e = pdEntry(f.id, iso);
    if(e){
      if(e.status==='trabalhado') diasTrabalhados++;
      else if(e.status==='falta') faltas++;
      if(e.quentinha) quentinhas++;
      if(e.status) detalhe.push({data:iso, status:e.status, quentinha:!!e.quentinha});
    }
    iso = addDays(iso, 1);
  }
  const bruto = diasTrabalhados*vd;

  /* vales do diarista: descontados no fechamento da semana em que foram dados */
  const vales = DB.adiantamentos
    .filter(a=>a.funcionarioId===f.id && a.modo!=='fichado_vale' && a.data>=periodo.inicio && a.data<=periodo.fim)
    .sort((a,b)=>a.data.localeCompare(b.data));
  const totalVales = vales.reduce((s,a)=>s+Number(a.valor||0),0);

  return {
    f, periodo, vd,
    faltas, quentinhas, detalhe, bruto,
    vales, totalVales, liquido: bruto - totalVales,
    totalDias: diasTrabalhados
  };
}

/* =========================================================
   FECHAMENTO / PAGAMENTO — sempre numa sexta-feira
   ========================================================= */
/* 'diaristas' (semanais e quinzenais juntos) ou 'fichados'. Até 28/08/2026
   eram 'semanal' e 'quinzenal' em abas separadas — ver calcsDoFechamento. */
let fcPeriodicidade = 'diaristas';
let fcSexta = null;
let fcObraFiltro = '';

/* =========================================================
   QUEM FECHA NESTA SEXTA

   Semanal e quinzenal estavam em abas separadas, e isso escondia o problema:
   numa sexta de quinzena os DOIS vencem juntos, e o Maycon precisava abrir uma
   aba, pagar, abrir a outra e pagar de novo — sem nunca ver o total do dia.
   Agora é uma lista só.

   O que NÃO dá para juntar é o período: o semanal apura 7 dias e o quinzenal 14.
   Por isso cada pessoa carrega o seu próprio `periodo`, e a coluna de vínculo
   mostra qual é qual.
   ========================================================= */
function calcsDoFechamento(sexta, obraFiltro){
  const tipos = ['semanal'];
  if(isSextaQuinzenal(sexta)) tipos.push('quinzenal');
  const out = [];
  tipos.forEach(p=>{
    const periodo = periodoDaSexta(sexta, p);
    let lista = ativosNoPeriodo(periodo.inicio, periodo.fim)
      .filter(f=>f.tipo==='diarista' && f.periodicidade===p);
    if(obraFiltro) lista = lista.filter(f=>f.obraPadrao===obraFiltro);
    lista.forEach(f=>{
      const x = calcDiarista(f, periodo);
      if(x.totalDias>0 || x.totalVales>0 || x.faltas>0) out.push(x);
    });
  });
  return out;
}

/* ---------------------------------------------------------
   MARCA DE PAGO

   Ele paga um por um, olhando a tela. Sem a marca, no meio de 20 nomes é fácil
   pagar duas vezes ou pular alguém. A marca viaja na sincronização como qualquer
   outro registro, então vale nos dois computadores e no celular.
   --------------------------------------------------------- */
function pagamentoDe(funcId, sexta, per){
  return (DB.pagamentos||[]).find(p=>
    p.funcionarioId===funcId && p.sexta===sexta && p.periodicidade===per);
}
function togglePago(funcId, sexta, per, valor){
  const ja = pagamentoDe(funcId, sexta, per);
  if(ja){
    DB.pagamentos = DB.pagamentos.filter(p=>p.id!==ja.id);
  }else{
    DB.pagamentos.push({
      id: uid(), funcionarioId: funcId, sexta, periodicidade: per,
      valor: Number(valor)||0, quando: todayISO()
    });
  }
  saveDB(); renderFechamento();
}

/* ---------------------------------------------------------
   A MENSAGEM DO WHATSAPP

   O Maycon já mandava essa mensagem à mão, neste formato exato:

       Natanael Luiz C. Gomes

       10 diárias = R$ 2.300,00
       vale = -R$ 1.000,00
       total = R$ 1.300,00

   O app só monta o mesmo texto com os números que já calculou. A linha do vale
   só entra quando existe vale — do contrário sobraria "- R$ 0,00" na conversa.
   --------------------------------------------------------- */
function mensagemPagamento(x){
  const l = [x.f.nome, ''];
  l.push(`${x.totalDias} ${x.totalDias===1?'diária':'diárias'} = ${fmtMoney(x.bruto)}`);
  if(x.totalVales) l.push(`vale = -${fmtMoney(x.totalVales)}`);
  l.push(`total = ${fmtMoney(x.liquido)}`);
  return l.join('\n');
}

function abrirMensagem(funcId, per){
  const f = func(funcId);
  const x = calcDiarista(f, periodoDaSexta(fcSexta, per));
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Mensagem de pagamento</h2>
    <p class="help" style="margin:0 0 10px;">
      Confira, ajuste se quiser, e copie. É o texto para mandar no WhatsApp.
    </p>
    <textarea id="msgPag" rows="6" spellcheck="false"
      style="width:100%;font-family:ui-monospace,Consolas,monospace;font-size:13.5px;
             padding:10px;border:1px solid var(--cinza-borda);border-radius:8px;
             resize:vertical;">${esc(mensagemPagamento(x))}</textarea>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Fechar</button>
      <button class="btn btn-primary" onclick="copiarMensagem()">Copiar</button>
    </div>
  `);
  setTimeout(()=>{ const t = document.getElementById('msgPag'); if(t){ t.focus(); t.select(); } }, 60);
}

/* Copiar precisa dos dois caminhos: `execCommand` funciona com o arquivo aberto
   direto do disco (file://), onde a API nova do navegador é bloqueada; a API
   nova é a que funciona no celular. Tentamos uma e caímos na outra. */
function copiarMensagem(){
  const t = document.getElementById('msgPag');
  if(!t) return;
  t.focus(); t.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  if(ok){ toast('Mensagem copiada.'); closeModal(); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value)
      .then(()=>{ toast('Mensagem copiada.'); closeModal(); })
      .catch(()=>toast('Não consegui copiar. O texto já está selecionado — copie à mão.'));
    return;
  }
  toast('Não consegui copiar. O texto já está selecionado — copie à mão.');
}

/* ---- Fechamento consolidado do período (folha de ponto) ---- */
function printFechamentoPeriodo(){
  const todos = calcsDoFechamento(fcSexta, fcObraFiltro);
  if(!todos.length){ alert('Nenhum lançamento nesta sexta.'); return; }

  /* Semanal e quinzenal saem em SEÇÕES separadas dentro do mesmo PDF: as colunas
     de dia são os dias do período, e os dois períodos têm tamanhos diferentes
     (7 e 14 dias). Misturar numa grade só faria o semanal parecer que faltou
     nos 7 primeiros dias. */
  const secoes = ['semanal','quinzenal']
    .map(per => ({per, calcs: todos.filter(x=>x.f.periodicidade===per)}))
    .filter(s => s.calcs.length);

  const blocosPorSecao = secoes.map(sec => secaoFechamento(sec.per, sec.calcs)).join('');
  const totalLiq = todos.reduce((s,x)=>s+x.liquido,0);

  doPrint(`
  <div class="doc">
    ${docHead('Folha de Ponto e Fechamento — Diaristas',
      `Pagamento de ${fmtDate(fcSexta)}${fcObraFiltro?' · '+esc(obraNome(fcObraFiltro)):''}`,
      `Pagamento<br><b>${fmtDate(fcSexta)}</b>`)}
    ${blocosPorSecao}
    <div class="dtotais">TOTAL GERAL A PAGAR: <b>${fmtMoney(totalLiq)}</b></div>
    <p class="dnote">Legenda: <b>1</b> = dia trabalhado · <b>F</b> = falta · <b>·</b> = sem lançamento.</p>
    <div class="assinatura"><div>Responsável pela medição</div><div>${esc(DB.empresa.razaoSocial)}</div></div>
    ${docFoot()}
  </div>`);
}

/* uma seção do PDF: todos os diaristas de uma periodicidade, agrupados por obra */
function secaoFechamento(per, calcs){
  const periodo = periodoDaSexta(fcSexta, per);
  const datas = [];
  let iso = periodo.inicio;
  while(iso <= periodo.fim){ datas.push(iso); iso = addDays(iso,1); }

  const porObra = {};
  calcs.forEach(x=>{ const k = x.f.obraPadrao||'sem_obra'; (porObra[k]=porObra[k]||[]).push(x); });

  const secLiq = calcs.reduce((s,x)=>s+x.liquido,0);

  const blocos = Object.keys(porObra).map(k=>{
    const grupo = porObra[k];
    const subBruto = grupo.reduce((s,x)=>s+x.bruto,0);
    const subVales = grupo.reduce((s,x)=>s+x.totalVales,0);
    const subLiq   = grupo.reduce((s,x)=>s+x.liquido,0);
    const subQuent = grupo.reduce((s,x)=>s+x.quentinhas,0);
    return `
    <table class="dtab" style="margin-top:12px;">
      <thead>
        <tr class="grp"><td colspan="${datas.length+8}">${k==='sem_obra'?'SEM OBRA DEFINIDA':esc(obraNome(k)).toUpperCase()}</td></tr>
        <tr>
          <th>#</th><th>Funcionário</th><th>Cargo</th>
          ${datas.map(d=>`<th style="text-align:center;">${fmtDateShort(d)}<br><span style="font-weight:400;">${DOW_FULL[dowOf(d)]}</span></th>`).join('')}
          <th style="text-align:center;">Diárias</th><th style="text-align:right;">Valor diária</th>
          <th style="text-align:right;">Bruto</th><th style="text-align:right;">Vales</th><th style="text-align:right;">Líquido</th>
        </tr>
      </thead>
      <tbody>
        ${grupo.map((x,i)=>{
          const cells = datas.map(d=>{
            const e = pdEntry(x.f.id, d);
            if(!e || !e.status) return `<td class="c">·</td>`;
            if(e.status==='falta')   return `<td class="c" style="color:#c0392b;font-weight:800;">F</td>`;
            
            return `<td class="c" style="font-weight:800;">1</td>`;
          }).join('');
          return `<tr>
            <td class="c">${i+1}</td><td>${esc(x.f.nome)}</td><td class="c">${esc(x.f.funcao||'')}</td>
            ${cells}
            <td class="c"><b>${x.totalDias}</b></td>
            <td class="n">${fmtMoney(x.vd)}</td>
            <td class="n">${fmtMoney(x.bruto)}</td>
            <td class="n">${x.totalVales?'- '+fmtMoney(x.totalVales):'—'}</td>
            <td class="n"><b>${fmtMoney(x.liquido)}</b></td>
          </tr>`;
        }).join('')}
      </tbody>
      <tfoot>
        <tr>
          <td colspan="${datas.length+5}" style="text-align:right;">SUBTOTAL${subQuent?` · ${subQuent} quentinhas`:''}</td>
          <td class="n">${fmtMoney(subBruto)}</td>
          <td class="n">${subVales?'- '+fmtMoney(subVales):'—'}</td>
          <td class="n">${fmtMoney(subLiq)}</td>
        </tr>
      </tfoot>
    </table>`;
  }).join('');

  return `
    <div class="dsub" style="margin-top:16px;text-align:left;font-weight:800;">
      Diaristas ${PERIODICIDADE_LABEL[per].toLowerCase()}s — ${periodoLabel(periodo)}
      · ${calcs.length} pessoa(s) · ${fmtMoney(secLiq)}
    </div>
    ${blocos}`;
}

              do mês seguinte, podendo ser parcelado em vários meses.

let advFiltroFunc = '';

/* onde e quando este vale vai ser cobrado */
function destinoVale(a){
  const f = func(a.funcionarioId);
  if(!f) return {texto:'—', tipo:'?'};
  if(a.modo === 'fichado_vale'){
    const n = Math.max(1, parseInt(a.parcelas)||1);
    const ini = a.mesInicio || mesMais((a.data||'').slice(0,7), 1);
    const fim = mesMais(ini, n-1);
    return {
      tipo: 'fichado',
      texto: n>1
        ? `${n}× de ${fmtMoney((Number(a.valor)||0)/n)} · ${monthLabel(ini)} a ${monthLabel(fim)}`
        : `Vale de ${monthLabel(ini)}`
    };
  }
  return {tipo:'diarista', texto: `Sexta ${fmtDate(sextaDeFechamento(a.data, f.periodicidade))}`};
}

/* em qual sexta esse vale será descontado (diaristas) */
function sextaDeFechamento(dataISO, periodicidade){
  let sexta = sextaDaSemana(dataISO);
  if(periodicidade==='quinzenal' && !isSextaQuinzenal(sexta)) sexta = addDays(sexta, 7);
  return sexta;
}

/* =========================================================
   FECHAMENTO DOS FICHADOS
   Dia 20 → adiantamento de 40% do salário
   5º dia útil do mês seguinte → pagamento do saldo do mês
   ========================================================= */
let fcMesFichados = null;

function calcFichado(f, mes){
  const salario = Number(f.salario)||0;
  const pctAdiant = Number(DB.config.adiantamentoPercent)||40;
  const adiantamento = Math.round(salario*pctAdiant/100*100)/100;

  /* descontos: usa o holerite do mês, se já estiver preenchido */
  const h = DB.holerites.find(x=>x.funcionarioId===f.id && x.mes===mes);
  const t = h ? totaisHolerite(f, h) : null;
  const temHolerite = !!(t && t.totalVenc > 0);

  const bruto = temHolerite ? t.totalVenc : salario;
  const descontos = temHolerite ? t.totalDesc : 0;
  const liquido = bruto - descontos;
  const saldo = Math.round((liquido - adiantamento)*100)/100;

  return {f, mes, salario, pctAdiant, adiantamento, temHolerite, bruto, descontos, liquido, saldo,
          dataAdiantamento: `${mes}-20`,
          dataPagamento: quintoDiaUtil(mesMais(mes, 1))};
}

/* =========================================================
   VALES VT / VR — só dos fichados
   VR = valor por dia trabalhado · VT = passagens do trecho de cada funcionário
   ========================================================= */
let valesMes = null;
function initValesMes(){ if(!valesMes) valesMes = currentYM(); }

/* registro do vale de um funcionário no mês (dias pode ser ajustado individualmente) */
function getVale(funcId, mes){
  let v = DB.vales.find(x=>x.funcionarioId===funcId && x.mes===mes);
  if(!v){
    v = {id:uid(), funcionarioId:funcId, mes, dias:'', descontoFaltas:'', descontoOutros:0, obs:''};
    DB.vales.push(v); saveDB();
  }
  return v;
}
/* dias considerados para este funcionário: ajuste individual, senão calculado
   a partir da admissão (quem entra no dia 17 não recebe o mês inteiro) */
function diasValeFunc(f, mes){
  const v = getVale(f.id, mes);
  return (v.dias===''||v.dias===null||v.dias===undefined)
         ? diasUteisDoFuncionarioNoMes(f, mes)
         : Number(v.dias);
}

/* Parcelas de vale/empréstimo de FICHADO que caem neste mês.
   Não dá para descontar do salário, então sai do vale de transporte/alimentação. */
function parcelasValeDoMes(funcId, mes){
  const res = [];
  DB.adiantamentos.forEach(a=>{
    if(a.funcionarioId!==funcId || a.modo!=='fichado_vale') return;
    const n = Math.max(1, parseInt(a.parcelas)||1);
    const ini = a.mesInicio || mesMais((a.data||'').slice(0,7), 1);
    for(let i=0;i<n;i++){
      if(mesMais(ini, i) === mes){
        res.push({a, parcela:i+1, total:n, valor: Math.round((Number(a.valor)||0)/n*100)/100});
      }
    }
  });
  return res;
}

function calcVale(f, mes){
  const v = getVale(f.id, mes);
  const dias = diasValeFunc(f, mes);
  const vtDia = vtPorDia(f), vrDia = vrPorDia(f);
  const totalVT = Math.round(vtDia*dias*100)/100;
  const totalVR = Math.round(vrDia*dias*100)/100;

  /* O vale é pago ADIANTADO, no começo do período — quando as faltas ainda não
     aconteceram. Por isso as faltas de um mês só são descontadas no mês seguinte. */
  const mesAnterior = mesAnteriorDe(mes);
  const falAnt = getFaltasMes(f.id, mesAnterior);
  const sugDescFaltas = Math.round((vtDia+vrDia)*falAnt.injustificada*100)/100;
  const descFaltas = (v.descontoFaltas===''||v.descontoFaltas===null||v.descontoFaltas===undefined)
                     ? sugDescFaltas : Number(v.descontoFaltas)||0;

  /* parcelas de empréstimo/vale em dinheiro */
  const parcelas = parcelasValeDoMes(f.id, mes);
  const totalParcelas = parcelas.reduce((s,p)=>s+p.valor,0);

  const descOutros = Number(v.descontoOutros)||0;
  return {f, v, dias, vtDia, vrDia, totalVT, totalVR, bruto: totalVT+totalVR,
          mesAnterior, falAnt, sugDescFaltas, descFaltas,
          parcelas, totalParcelas, descOutros,
          liquido: totalVT+totalVR-descFaltas-totalParcelas-descOutros};
}

function setDiasVale(valor){
  if(valor===''){ DB.diasUteisMes[valesMes] = ''; }
  else DB.diasUteisMes[valesMes] = Math.max(0, parseInt(valor)||0);
  saveDB(); renderVales();
}
function setValeCampo(funcId, campo, valor){
  const v = getVale(funcId, valesMes);
  if(campo==='dias') v.dias = valor==='' ? '' : Math.max(0, parseInt(valor)||0);
  else v[campo] = valor==='' ? '' : (parseFloat(valor)||0);
  saveDB(); renderVales();
}

   HOLERITE — Recibo de pagamento + Demonstrativo de encargos
   ========================================================= */
let holFuncId = null;
let holMes = null;
let holAba = 'funcionario';

/* rubricas lançadas a partir do holerite da contabilidade */
const RUBRICAS_VENC = [
  {k:'saldoSalario',  cod:'saldoSalario',  label:'SALDO DE SALARIO',   temRef:true},
  {k:'difSalario',    cod:'difSalario',    label:'DIF DE SALARIO',     temRef:true},
  {k:'salarioFamilia',cod:'salarioFamilia',label:'SALARIO FAMILIA',    temRef:true},
  {k:'valeTransporte',cod:'valeTransporte',label:'VALE TRANSPORTE',    temRef:true},
  {k:'valeAlimentacao',cod:'valeAlimentacao',label:'VALE ALIMENTACAO', temRef:true}
];
const RUBRICAS_DESC = [
  {k:'inss',            cod:'inss',            label:'I.N.S.S.',                        temRef:true},
  {k:'faltasInjust',    cod:'faltasInjust',    label:'FALTAS INJUSTIFICADAS',           temRef:true},
  {k:'faltasMesAnt',    cod:'faltasMesAnt',    label:'FALTAS DO MES ANTERIOR',          temRef:true},
  {k:'emprestimoConsig',cod:'emprestimoConsig',label:'DESC. EMPRESTIMO CONSIG',         temRef:false},
  {k:'rsrDomFer',       cod:'rsrDomFer',       label:'DESC. DO RSR DOM/FERIADOS',       temRef:true},
  {k:'rsrDomFerAnt',    cod:'rsrDomFerAnt',    label:'DESC. DO RSR DOM/FERIADOS MES ANT.', temRef:true}
];
/* rubricas que NÃO integram a base de INSS/FGTS */
const RUBRICAS_SEM_ENCARGO = ['salarioFamilia','valeTransporte','valeAlimentacao'];

function holeriteVazio(f, mes){
  const vazio = arr => { const o = {}; arr.forEach(r=>o[r.k]=''); return o; };
  return {
    id: uid(), funcionarioId: f.id, mes,
    venc:    vazio(RUBRICAS_VENC), vencRef: vazio(RUBRICAS_VENC),
    desc:    vazio(RUBRICAS_DESC), descRef: vazio(RUBRICAS_DESC),
    baseIrrf:'', aliqIrrf:''
  };
}
function getHolerite(funcId, mes){
  let h = DB.holerites.find(x=>x.funcionarioId===funcId && x.mes===mes);
  if(!h){
    h = holeriteVazio(func(funcId), mes);
    DB.holerites.push(h); saveDB();
  }
  h.venc = h.venc||{}; h.desc = h.desc||{}; h.vencRef = h.vencRef||{}; h.descRef = h.descRef||{};
  return h;
}

/* sugestões automáticas a partir do que o sistema já sabe */
function sugestoesHolerite(f, mes){
  const fal = getFaltasMes(f.id, mes);
  const salario = f.salario||0;
  const valorDia = salario/30;
  const descFaltas = Math.round(valorDia*fal.injustificada*100)/100;
  const baseInss = Math.max(0, salario - descFaltas);

  /* faltas do mês anterior — descontadas neste mês, como no vale */
  const mesAnt = mesAnteriorDe(mes);
  const falAnt = getFaltasMes(f.id, mesAnt);
  const descFaltasAnt = Math.round(valorDia*falAnt.injustificada*100)/100;

  /* VT e VA do mês, calculados pelos dias efetivos do funcionário */
  const v = recebeAlgumVale(f) ? calcVale(f, mes) : null;

  return {
    saldoSalario: Math.round(salario*100)/100,
    saldoSalarioRef: 30,
    faltasInjust: descFaltas,
    faltasInjustRef: fal.injustificada,
    faltasMesAnt: descFaltasAnt,
    faltasMesAntRef: falAnt.injustificada,
    mesAnt,
    inss: calcInss(baseInss),
    inssRef: aliquotaInss(baseInss),
    baseInss,
    valeTransporte: v ? v.totalVT : 0,
    valeAlimentacao: v ? v.totalVR : 0,
    valeDias: v ? v.dias : 0
  };
}

function aplicarSugestoes(){
  const f = func(holFuncId);
  const h = getHolerite(f.id, holMes);
  const s = sugestoesHolerite(f, holMes);
  h.venc.saldoSalario   = s.saldoSalario;
  h.vencRef.saldoSalario= s.saldoSalarioRef;
  h.desc.inss           = s.inss;
  h.descRef.inss        = s.inssRef;
  if(s.faltasInjust){ h.desc.faltasInjust = s.faltasInjust; h.descRef.faltasInjust = s.faltasInjustRef; }
  if(s.faltasMesAnt){ h.desc.faltasMesAnt = s.faltasMesAnt; h.descRef.faltasMesAnt = s.faltasMesAntRef; }
  if(s.valeTransporte){  h.venc.valeTransporte  = s.valeTransporte;  h.vencRef.valeTransporte  = s.valeDias; }
  if(s.valeAlimentacao){ h.venc.valeAlimentacao = s.valeAlimentacao; h.vencRef.valeAlimentacao = s.valeDias; }
  saveDB(); renderHolerite(); toast('Valores preenchidos — confira com o holerite da contabilidade.');

function limparHolerite(){
  if(!confirm('Limpar todos os lançamentos deste holerite?')) return;
  DB.holerites = DB.holerites.filter(x=>!(x.funcionarioId===holFuncId && x.mes===holMes));
  saveDB(); renderHolerite(); toast('Holerite limpo.');
}

function totaisHolerite(f, h){
  const n = v => Number(v)||0;
  const totalVenc = RUBRICAS_VENC.reduce((s,r)=>s+n(h.venc[r.k]),0);
  const totalDesc = RUBRICAS_DESC.reduce((s,r)=>s+n(h.desc[r.k]),0);
  const salarioBase = f.salario||0;
  // salário-família, VT e VA não integram a base de INSS/FGTS
  const base = n(h.venc.saldoSalario)+n(h.venc.difSalario)
             - n(h.desc.faltasInjust)-n(h.desc.faltasMesAnt)-n(h.desc.rsrDomFer)-n(h.desc.rsrDomFerAnt);
  const baseInss = base;
  const baseFgts = base;
  const valorFgts = Math.round(baseFgts*(DB.config.fgtsPercent||8)/100*100)/100;
  return {totalVenc, totalDesc, liquido: totalVenc-totalDesc, salarioBase,
          baseInss: Math.max(0,baseInss), baseFgts: Math.max(0,baseFgts), valorFgts};
}

/* ---------- ABA 2: demonstrativo de encargos (para o cliente) ---------- */
/* Diarista não gera encargo: a diária já engloba tudo (pagamento, vale, encargo).
   Encargos sociais só existem para funcionário fichado. */
function temEncargos(f){ return f.tipo === 'fichado'; }

function calcEncargos(f, mes){
  const cfg = DB.config;
  const at = cfg.encargosAtivos;
  const fichado = temEncargos(f);
  let base = 0;
  if(fichado){
    const h = DB.holerites.find(x=>x.funcionarioId===f.id && x.mes===mes);
    const t = h ? totaisHolerite(f,h) : null;
    base = t && t.baseFgts ? t.baseFgts : (f.salario||0);
  } else {
    base = brutoDiaristaNoMes(f, mes);
  }
  const pct = p => Math.round(base*(p||0)/100*100)/100;
  const itens = [];

  if(fichado){
    if(at.inssPatronal) itens.push({cod:'INSS-P', label:'INSS PATRONAL',                ref:fmtNum(cfg.inssPatronalPercent,1)+'%', v:pct(cfg.inssPatronalPercent)});
    if(at.rat)          itens.push({cod:'RAT',    label:'RAT - RISCO AMBIENTAL',        ref:fmtNum(cfg.ratPercent,1)+'%',          v:pct(cfg.ratPercent)});
    if(at.terceiros)    itens.push({cod:'TERC',   label:'TERCEIROS / SISTEMA S',        ref:fmtNum(cfg.terceirosPercent,1)+'%',    v:pct(cfg.terceirosPercent)});
    if(at.fgts)         itens.push({cod:'FGTS',   label:'F.G.T.S.',                     ref:fmtNum(cfg.fgtsPercent,1)+'%',         v:pct(cfg.fgtsPercent)});
    if(at.multaFgts)    itens.push({cod:'MULTA',  label:'PROVISAO MULTA 40% DO FGTS',   ref:fmtNum(cfg.multaFgtsPercent,1)+'%',    v:pct(cfg.multaFgtsPercent)});
    if(at.decimo13)     itens.push({cod:'13o',    label:'PROVISAO DE 13o SALARIO',      ref:fmtNum(cfg.provisao13Percent,2)+'%',   v:pct(cfg.provisao13Percent)});
    if(at.ferias)       itens.push({cod:'FER',    label:'PROVISAO DE FERIAS + 1/3',     ref:fmtNum(cfg.provisaoFeriasPercent,2)+'%', v:pct(cfg.provisaoFeriasPercent)});
  }

  /* VT e VA também são custo da empresa e o cliente precisa enxergar */
  let vt = 0, va = 0, valeDias = 0;
  if(at.valeTransporte || at.valeAlimentacao){
    if(recebeAlgumVale(f)){
      const cv = calcVale(f, mes);
      valeDias = cv.dias;
      if(at.valeTransporte  && cv.totalVT) vt = cv.totalVT;
      if(at.valeAlimentacao && cv.totalVR) va = cv.totalVR;
    }
  }
  if(vt) itens.push({cod:'VT', label:'VALE TRANSPORTE',  ref:valeDias+' dias', v:vt});
  if(va) itens.push({cod:'VA', label:'VALE ALIMENTACAO', ref:valeDias+' dias', v:va});

  const epi = epiDoMes(f.id, mes);
  if(at.epi && epi.total){
    itens.push({cod:'EPI', label:'EPI / UNIFORME ENTREGUE NO MES', ref:epi.itens.length+' item(ns)', v:epi.total});
  }

  const totalEncargos = itens.reduce((s,i)=>s+i.v,0);
  return {base, itens, epi, fichado, totalEncargos, custoTotal: base+totalEncargos};
}

function brutoDiaristaNoMes(f, mes){
  const [y,m] = mes.split('-').map(Number);
  const nd = daysInMonth(y,m);
  const periodo = {inicio:`${mes}-01`, fim:`${mes}-${String(nd).padStart(2,'0')}`};
  return calcDiarista(f, periodo).bruto;
}
function epiDoMes(funcId, mes){
  const itens = DB.epiSaidas.filter(s=>s.funcionarioId===funcId && (s.data||'').slice(0,7)===mes);
  return {itens, total: itens.reduce((s,i)=>s+Number(i.quantidade)*Number(i.valorUnit),0)};
}

/* =========================================================

/* custo médio ponderado e saldo por item, a partir das entradas/saídas */
function itensEstoque(){
  const mapa = {};
  DB.epiEntradas.forEach(e=>{
    const k = (e.item||'').trim();
    if(!k) return;
    if(!mapa[k]) mapa[k] = {item:k, qtdEntrada:0, valorEntrada:0, qtdSaida:0, valorSaida:0};
    mapa[k].qtdEntrada  += Number(e.quantidade)||0;
    mapa[k].valorEntrada+= (Number(e.quantidade)||0)*(Number(e.valorUnit)||0);
  });
  DB.epiSaidas.forEach(s=>{
    const k = (s.itemNome||'').trim();
    if(!k) return;
    if(!mapa[k]) mapa[k] = {item:k, qtdEntrada:0, valorEntrada:0, qtdSaida:0, valorSaida:0};
    mapa[k].qtdSaida  += Number(s.quantidade)||0;
    mapa[k].valorSaida+= (Number(s.quantidade)||0)*(Number(s.valorUnit)||0);
  });
  return Object.values(mapa).map(m=>{
    const custoMedio = m.qtdEntrada ? m.valorEntrada/m.qtdEntrada : 0;
    const saldoQtd = m.qtdEntrada - m.qtdSaida;
    return Object.assign(m, {custoMedio, saldoQtd, saldoValor: saldoQtd*custoMedio});
  }).sort((a,b)=>a.item.localeCompare(b.item));
}
function custoMedioItem(nome){
  const i = itensEstoque().find(x=>x.item===(nome||'').trim());
  return i ? i.custoMedio : 0;
}
function saldoItem(nome){
  const i = itensEstoque().find(x=>x.item===(nome||'').trim());
  return i ? i.saldoQtd : 0;
}

}

function onSaidaItemChange(){
  const nome = val('s_item');
  const custo = custoMedioItem(nome);
  const qtd = numVal('s_qtd');
  const saldo = saldoItem(nome);
  document.getElementById('s_valor').value = custo ? custo.toFixed(2) : '';
  document.getElementById('s_total').value = fmtMoney(custo*qtd);
  const aviso = document.getElementById('s_aviso');
  if(qtd > saldo){
    aviso.innerHTML = `<span style="color:var(--vermelho);font-weight:600;">Atenção: o saldo de "${esc(nome)}" é de ${saldo} un. — a saída deixará o estoque negativo.</span>`;
  } else {
    aviso.textContent = `Valor unitário vem do custo médio das entradas deste item. Saldo após a saída: ${saldo-qtd} un.`;
  }
}
function onSaidaFuncChange(){
  const sel = document.getElementById('s_func');
  const obra = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].getAttribute('data-obra') : '';
  if(obra) document.getElementById('s_obra').value = obra;

function saveEpiSaida(){

    id: uid(), data: val('s_data'), itemNome: item,
    quantidade: qtd, valorUnit: custoMedioItem(item),
    funcionarioId: val('s_func'), obraId: val('s_obra')
  };
  DB.epiSaidas.push(nova);
  saveDB(); closeModal(); renderEstoque(); toast('Saída registrada.');

}
function deleteEpiSaida(id){

/* =========================================================

   ========================================================= */
let custoMes = null;
let custoObra = '';
let custoVinculo = '';
let custoServico = '';
let custoPeriodicidade = '';
let custoAgrupar = 'funcionario';

function renderCustos(){
  initValesMes();
  if(!custoMes) custoMes = valesMes;
  const c = document.getElementById('content');

  let lista = ativos();
  if(custoObra)          lista = lista.filter(f=>f.obraPadrao===custoObra);
  if(custoVinculo)       lista = lista.filter(f=>f.tipo===custoVinculo);
  if(custoServico)       lista = lista.filter(f=>f.tipoServico===custoServico);
  if(custoPeriodicidade) lista = lista.filter(f=>f.tipo==='diarista' && f.periodicidade===custoPeriodicidade);

  const rows = lista.map(f=>{
    const e = calcEncargos(f, custoMes);
    return {f, base:e.base, encargos:e.totalEncargos - (DB.config.encargosAtivos.epi?e.epi.total:0),
            epi: DB.config.encargosAtivos.epi ? e.epi.total : 0, custoTotal:e.custoTotal};
  }).filter(r=>r.base>0 || r.epi>0).sort((a,b)=>b.custoTotal-a.custoTotal);

  const tot = k => rows.reduce((s,r)=>s+r[k],0);
  const obraOpts = DB.obras.map(o=>`<option value="${o.id}" ${custoObra===o.id?'selected':''}>${esc(o.nome)}</option>`).join('');

  c.innerHTML = `
    <div class="card">
      <div class="grid grid-4" style="align-items:end;">
        <div class="field"><label>Mês de referência</label><input type="month" value="${custoMes}" onchange="custoMes=this.value; renderCustos();"></div>
        <div class="field"><label>Obra</label><select onchange="custoObra=this.value; renderCustos();"><option value="">Todas as obras</option>${obraOpts}</select></div>
        <div class="field"><label>Vínculo</label>
          <select onchange="custoVinculo=this.value; renderCustos();">
            <option value="">Todos</option>
            <option value="fichado"  ${custoVinculo==='fichado'?'selected':''}>Fichados</option>
            <option value="diarista" ${custoVinculo==='diarista'?'selected':''}>Diaristas</option>
          </select>
        </div>
        <div class="field"><label>Tipo de serviço</label>
          <select onchange="custoServico=this.value; renderCustos();">
            <option value="">Todos</option>
            <option value="homem_hora" ${custoServico==='homem_hora'?'selected':''}>Homem-Hora</option>
            <option value="empreitada" ${custoServico==='empreitada'?'selected':''}>Empreitada</option>
          </select>
        </div>
      </div>
      <div class="grid grid-2" style="align-items:end;">
        <div class="field"><label>Periodicidade (diaristas)</label>
          <select onchange="custoPeriodicidade=this.value; renderCustos();">
            <option value="">Todas</option>
            <option value="semanal"   ${custoPeriodicidade==='semanal'?'selected':''}>Semanais</option>
            <option value="quinzenal" ${custoPeriodicidade==='quinzenal'?'selected':''}>Quinzenais</option>
          </select>
        </div>
        <div class="field"><label>Análise</label>
          <select onchange="custoAgrupar=this.value; renderCustos();">
            <option value="funcionario" ${custoAgrupar==='funcionario'?'selected':''}>Detalhado por funcionário</option>
            <option value="obra"        ${custoAgrupar==='obra'?'selected':''}>Resumo por obra</option>
            <option value="servico"     ${custoAgrupar==='servico'?'selected':''}>Resumo por tipo de serviço</option>
            <option value="vinculo"     ${custoAgrupar==='vinculo'?'selected':''}>Resumo por vínculo</option>
            <option value="funcao"      ${custoAgrupar==='funcao'?'selected':''}>Resumo por função / cargo</option>
          </select>
        </div>
      </div>

      <div class="kpis" style="margin-top:6px;">
        <div class="kpi"><div class="v">${rows.length}</div><div class="l">Funcionários no filtro</div></div>
        <div class="kpi"><div class="v">${fmtMoney(tot('base'))}</div><div class="l">Salários e diárias</div></div>
        <div class="kpi"><div class="v">${fmtMoney(tot('encargos'))}</div><div class="l">Encargos e provisões</div></div>
        <div class="kpi"><div class="v" style="color:var(--azul-esc);">${fmtMoney(tot('custoTotal'))}</div><div class="l">Custo real total</div></div>
      </div>

      <div class="table-wrap">${rows.length ? tabelaCusto(rows) : '<div class="empty">Nenhum custo apurado com estes filtros neste mês.</div>'}</div>

      ${rows.length?`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="printCustos()">Gerar relatório (PDF)</button>
      </div>`:''}
      <p class="help">
        Encargos ativos: ${encargosResumoTexto()}. Ajuste as alíquotas e o que entra na conta em <b>Configurações</b> ou na aba de encargos do Holerite.<br>
        <b>Diaristas não geram encargos sociais</b> — o valor da diária já engloba pagamento, vales e encargos.
        Para eles, o custo real é a soma das diárias mais o que você desembolsou à parte (EPI, por exemplo).
      </p>
    </div>
  `;
}

function chaveAgrupamento(f){
  if(custoAgrupar==='obra')    return obraNome(f.obraPadrao);
  if(custoAgrupar==='servico') return SERVICO_LABEL[f.tipoServico] || '—';
  if(custoAgrupar==='vinculo') return f.tipo==='fichado' ? 'Fichados' : `Diaristas ${PERIODICIDADE_LABEL[f.periodicidade]||''}`.trim();
  if(custoAgrupar==='funcao')  return (f.funcao||'Sem função').toUpperCase();
  return null;
}

function tabelaCusto(rows){
  if(custoAgrupar==='funcionario'){
    return `<table>
      <thead><tr><th>Funcionário</th><th>Obra</th><th>Vínculo</th><th>Tipo de serviço</th>
        <th class="num">Base</th><th class="num">Encargos</th><th class="num">EPI</th><th class="num">Custo real</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><b>${esc(r.f.nome)}</b><br><span style="font-size:11px;color:#9aa0ab;">${esc(r.f.funcao||'')}</span></td>
        <td>${esc(obraNome(r.f.obraPadrao))}</td>
        <td>${r.f.tipo==='fichado'?'Fichado':'Diarista '+(PERIODICIDADE_LABEL[r.f.periodicidade]||'')}</td>
        <td>${SERVICO_LABEL[r.f.tipoServico]||'—'}</td>
        <td class="num">${fmtMoney(r.base)}</td>
        <td class="num">${fmtMoney(r.encargos)}</td>
        <td class="num">${r.epi?fmtMoney(r.epi):'—'}</td>
        <td class="num" style="font-weight:800;color:var(--azul-esc);">${fmtMoney(r.custoTotal)}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><th colspan="4" style="text-align:right;">TOTAL</th>
        <th class="num">${fmtMoney(rows.reduce((s,r)=>s+r.base,0))}</th>
        <th class="num">${fmtMoney(rows.reduce((s,r)=>s+r.encargos,0))}</th>
        <th class="num">${fmtMoney(rows.reduce((s,r)=>s+r.epi,0))}</th>
        <th class="num">${fmtMoney(rows.reduce((s,r)=>s+r.custoTotal,0))}</th></tr></tfoot>
    </table>`;
  }
  const grupos = {};
  rows.forEach(r=>{
    const k = chaveAgrupamento(r.f);
    if(!grupos[k]) grupos[k] = {n:0, base:0, encargos:0, epi:0, custoTotal:0};
    grupos[k].n++; grupos[k].base+=r.base; grupos[k].encargos+=r.encargos;
    grupos[k].epi+=r.epi; grupos[k].custoTotal+=r.custoTotal;
  });
  const lista = Object.entries(grupos).sort((a,b)=>b[1].custoTotal-a[1].custoTotal);
  const total = lista.reduce((s,[,g])=>s+g.custoTotal,0);
  return `<table>
    <thead><tr><th>${{obra:'Obra',servico:'Tipo de serviço',vinculo:'Vínculo',funcao:'Função / cargo'}[custoAgrupar]}</th>
      <th class="num">Pessoas</th><th class="num">Base</th><th class="num">Encargos</th><th class="num">EPI</th>
      <th class="num">Custo real</th><th class="num">% do total</th></tr></thead>
    <tbody>${lista.map(([k,g])=>`<tr>
      <td><b>${esc(k)}</b></td>
      <td class="num">${g.n}</td>
      <td class="num">${fmtMoney(g.base)}</td>
      <td class="num">${fmtMoney(g.encargos)}</td>
      <td class="num">${g.epi?fmtMoney(g.epi):'—'}</td>
      <td class="num" style="font-weight:800;color:var(--azul-esc);">${fmtMoney(g.custoTotal)}</td>
      <td class="num">${total?fmtNum(g.custoTotal/total*100,1)+'%':'—'}</td>
    </tr>`).join('')}</tbody>
    <tfoot><tr><th style="text-align:right;">TOTAL</th>
      <th class="num">${lista.reduce((s,[,g])=>s+g.n,0)}</th>
      <th class="num">${fmtMoney(lista.reduce((s,[,g])=>s+g.base,0))}</th>
      <th class="num">${fmtMoney(lista.reduce((s,[,g])=>s+g.encargos,0))}</th>
      <th class="num">${fmtMoney(lista.reduce((s,[,g])=>s+g.epi,0))}</th>
      <th class="num">${fmtMoney(total)}</th><th class="num">100%</th></tr></tfoot>
  </table>`;
}

function encargosResumoTexto(){
  const cfg = DB.config, at = cfg.encargosAtivos, p = [];
  if(at.inssPatronal) p.push(`INSS patronal ${fmtNum(cfg.inssPatronalPercent,1)}%`);
  if(at.rat)         p.push(`RAT ${fmtNum(cfg.ratPercent,1)}%`);
  if(at.terceiros)   p.push(`Terceiros ${fmtNum(cfg.terceirosPercent,1)}%`);
  if(at.fgts)        p.push(`FGTS ${fmtNum(cfg.fgtsPercent,1)}%`);
  if(at.multaFgts)   p.push(`multa 40% ${fmtNum(cfg.multaFgtsPercent,1)}%`);
  if(at.decimo13)    p.push(`13º ${fmtNum(cfg.provisao13Percent,2)}%`);
  if(at.ferias)      p.push(`férias+1/3 ${fmtNum(cfg.provisaoFeriasPercent,2)}%`);
  if(at.epi)         p.push('EPI do mês');
  return p.join(' · ') || 'nenhum';
}

function printCustos(){
  let lista = ativos();
  if(custoObra)          lista = lista.filter(f=>f.obraPadrao===custoObra);
  if(custoVinculo)       lista = lista.filter(f=>f.tipo===custoVinculo);
  if(custoServico)       lista = lista.filter(f=>f.tipoServico===custoServico);
  if(custoPeriodicidade) lista = lista.filter(f=>f.tipo==='diarista' && f.periodicidade===custoPeriodicidade);

  const rows = lista.map(f=>{
    const e = calcEncargos(f, custoMes);
    return {f, base:e.base, encargos:e.totalEncargos - (DB.config.encargosAtivos.epi?e.epi.total:0),
            epi: DB.config.encargosAtivos.epi ? e.epi.total : 0, custoTotal:e.custoTotal};
  }).filter(r=>r.base>0 || r.epi>0).sort((a,b)=>b.custoTotal-a.custoTotal);
  if(!rows.length){ alert('Nada a imprimir com estes filtros.'); return; }

  const filtros = [];
  if(custoObra)          filtros.push(obraNome(custoObra));
  if(custoVinculo)       filtros.push(custoVinculo==='fichado'?'Fichados':'Diaristas');
  if(custoServico)       filtros.push(SERVICO_LABEL[custoServico]);
  if(custoPeriodicidade) filtros.push(PERIODICIDADE_LABEL[custoPeriodicidade]);

  const totalGeral = rows.reduce((s,r)=>s+r.custoTotal,0);

  // resumos cruzados
  const resumo = (fn, titulo) => {
    const g = {};
    rows.forEach(r=>{ const k = fn(r.f); g[k] = (g[k]||0) + r.custoTotal; });
    const ent = Object.entries(g).sort((a,b)=>b[1]-a[1]);
    return `
    <table class="dtab" style="margin-top:10px;">
      <thead><tr><th>${titulo}</th><th style="width:22%;text-align:right;">Custo real</th><th style="width:14%;text-align:right;">%</th></tr></thead>
      <tbody>${ent.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${fmtNum(v)}</td><td class="n">${fmtNum(v/totalGeral*100,1)}%</td></tr>`).join('')}</tbody>
    </table>`;
  };

  doPrint(`
  <div class="doc">
    ${docHead('Relatório de Custo Real Consolidado', `${monthLabel(custoMes)}${filtros.length?' · '+esc(filtros.join(' · ')):''}`,
      `Emitido em<br><b>${fmtDate(todayISO())}</b>`)}
    <table class="dtab">
      <thead><tr><th>#</th><th>Funcionário</th><th>Função</th><th>Obra</th><th>Vínculo</th><th>Serviço</th>
        <th style="text-align:right;">Base</th><th style="text-align:right;">Encargos</th><th style="text-align:right;">EPI</th><th style="text-align:right;">Custo real</th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr>
        <td class="c">${i+1}</td><td>${esc(r.f.nome)}</td><td>${esc(r.f.funcao||'—')}</td>
        <td>${esc(obraNome(r.f.obraPadrao))}</td>
        <td>${r.f.tipo==='fichado'?'Fichado':'Diarista'}</td>
        <td>${SERVICO_LABEL[r.f.tipoServico]||'—'}</td>
        <td class="n">${fmtNum(r.base)}</td><td class="n">${fmtNum(r.encargos)}</td>
        <td class="n">${r.epi?fmtNum(r.epi):'—'}</td><td class="n"><b>${fmtNum(r.custoTotal)}</b></td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="6" style="text-align:right;">TOTAL</td>
        <td class="n">${fmtNum(rows.reduce((s,r)=>s+r.base,0))}</td>
        <td class="n">${fmtNum(rows.reduce((s,r)=>s+r.encargos,0))}</td>
        <td class="n">${fmtNum(rows.reduce((s,r)=>s+r.epi,0))}</td>
        <td class="n">${fmtNum(totalGeral)}</td></tr></tfoot>
    </table>

    ${resumo(f=>obraNome(f.obraPadrao), 'Custo por obra')}
    ${resumo(f=>SERVICO_LABEL[f.tipoServico]||'—', 'Custo por tipo de serviço')}
    ${resumo(f=>f.tipo==='fichado'?'Fichados':`Diaristas ${PERIODICIDADE_LABEL[f.periodicidade]||''}`.trim(), 'Custo por vínculo')}

    <p class="dnote">Encargos considerados: ${encargosResumoTexto()}. Diaristas não geram encargos sociais — a diária já engloba tudo. Provisões de 13º, férias + 1/3 e multa de 40% do FGTS
    são valores resguardados mensalmente pela empresa. Documento gerencial de prestação de contas.</p>
    <div class="assinatura"><div>${esc(DB.empresa.razaoSocial)}</div><div>Cliente / Contratante</div></div>
    ${docFoot()}
  </div>`);
}

/* =========================================================
   LOGO DA EMPRESA

   Guardada nos DADOS (`DB.empresa.logo`), não no HTML — o app é publicado num
   repositório público e nada da empresa pode ir junto no arquivo.

   Como vai junto na sincronização, o tamanho importa: a imagem é reduzida para
   no máximo LOGO_MAX px antes de virar data URI. Sem isso, uma foto de 3 MB
   entraria no `bela-angra-dados.json` e viajaria inteira a cada sincronização.
   ========================================================= */
const LOGO_MAX = 240;          // px no maior lado — chega para o cabeçalho impresso
const LOGO_LIMITE_KB = 200;    // acima disso, avisa em vez de gravar calado

function importarLogo(input){
  const arq = input.files && input.files[0];
  input.value = '';                       // permite reimportar o mesmo arquivo
  if(!arq) return;
  if(!/^image\//.test(arq.type)){ alert('Escolha um arquivo de imagem.'); return; }

  const leitor = new FileReader();
  leitor.onload = function(){
    const img = new Image();
    img.onload = function(){
      const escala = Math.min(1, LOGO_MAX / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width  * escala));
      const h = Math.max(1, Math.round(img.height * escala));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      /* PNG para não perder transparência: a logo aparece sobre o menu escuro */
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      let uri;
      try{ uri = cv.toDataURL('image/png'); }
      catch(e){ alert('Não consegui ler esta imagem. Tente um PNG ou JPG comum.'); return; }

      const kb = Math.round(uri.length / 1024);
      if(kb > LOGO_LIMITE_KB){
        if(!confirm(`A logo ficou com ${kb} KB, o que é bastante para viajar em toda `
          + `sincronização.\n\nUma imagem mais simples, com fundo transparente, fica bem menor.\n\n`
          + `Usar mesmo assim?`)) return;
      }
      DB.empresa.logo = uri;
      saveDB(); renderConfig(); pintarMarca();
      toast(`Logo importada (${w}×${h}, ${kb} KB).`);
    };
    img.onerror = function(){ alert('Não consegui abrir esta imagem.'); };
    img.src = leitor.result;
  };
  leitor.onerror = function(){ alert('Não consegui ler o arquivo.'); };
  leitor.readAsDataURL(arq);
}
