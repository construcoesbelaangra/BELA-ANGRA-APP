<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bela Angra · Sistema de RH</title>
<!-- iPhone: adicionado à Tela de Início, o app sai do Safari e fica ISENTO da regra
     que apaga o armazenamento após 7 dias sem uso. Sem isso, os dados somem no celular. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RH Bela Angra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2e33">
<style>
:root{
  --azul: #1c4fd8;
  --azul-esc: #123a9e;
  --azul-claro: #e8edfc;
  --chumbo: #2b2e33;
  --chumbo-claro: #4a4f57;
  --cinza-bg: #f3f4f7;
  --cinza-borda: #dcdfe5;
  --branco: #ffffff;
  --verde: #1f8a4c;
  --vermelho: #c0392b;
  --amarelo: #b8860b;
  --radius: 10px;
  --font: 'Segoe UI', Roboto, -apple-system, Arial, sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font);background:var(--cinza-bg);color:var(--chumbo);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#c4c9d2;border-radius:6px;}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:230px;flex-shrink:0;background:var(--chumbo);color:#dfe2e8;
  display:flex;flex-direction:column;
}
#sidebar .brand{
  display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid #40444c;
}
#sidebar .brand img{width:40px;height:40px;object-fit:contain;}
#sidebar .brand .name{font-size:12.5px;font-weight:600;line-height:1.25;color:#fff;}
#sidebar nav{flex:1;overflow-y:auto;padding:10px 0;}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  color:#c7cbd3;padding:10px 18px;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;
}
.navbtn:hover{background:#34383f;color:#fff;}
.navbtn.active{background:#34383f;color:#fff;border-left-color:var(--azul);font-weight:600;}
/* ícone SVG da navegação: herda a cor do botão, então acompanha o estado ativo */
.navbtn .ico{width:19px;height:19px;flex-shrink:0;opacity:.72;}
.navbtn.active .ico, .navbtn:hover .ico{opacity:1;}
.navbtn .rot{min-width:0;overflow:hidden;text-overflow:ellipsis;}
/* Título de seção do menu (RH · Financeiro · Sistema). Entrou em 30/08/2026,
   quando o financeiro levou o menu a 15 telas. É rótulo, não botão: não recebe
   clique nem foco, e o traço acima separa sem gastar altura com borda cheia. */
.navsec{
  padding:14px 18px 5px;font-size:10px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:#7d828c;pointer-events:none;
}
.navsec + .navbtn{border-top:none;}
#sidebar nav > .navsec:first-child{padding-top:6px;}
#sidebar .foot{padding:12px 16px;font-size:10.5px;color:#8b909a;border-top:1px solid #40444c;}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--branco);border-bottom:1px solid var(--cinza-borda);padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;
}
#topbar h1{font-size:18px;margin:0;color:var(--chumbo);}
#topbar .sub{font-size:12px;color:#7a808c;margin-top:2px;}
#topbar .actions{display:flex;gap:8px;}
#content{padding:22px 26px;flex:1;}

/* botões da gaveta: escondidos no computador, onde a lateral é fixa */
#btnMenu, #btnFecharGaveta, #gavetaFundo{display:none;}

/* Par de textos para o mesmo rótulo: no computador vale a palavra inteira,
   no celular a inicial. O celular inverte isto dentro do @media. */
.detalhe{display:inline;}
.ini{display:none;}

/* =========================================================
   CELULAR E TABLET
   Três problemas resolvidos aqui, todos relatados em 28/08/2026:

   1. A logo e o nome da empresa passavam POR BAIXO do relógio e das
      notificações do iPhone. Causa: com apple-mobile-web-app-status-bar-style
      igual a black-translucent, a página ocupa a tela inteira, inclusive
      atrás da barra de status. Conserto: env(safe-area-inset-*).

   2. As abas rolavam de lado, escondendo páginas. Viraram GAVETA.

   3. A página inteira rolava de lado para achar botão. Agora só o miolo de
      tabela larga rola, dentro da própria caixa — a página nunca.
   ========================================================= */
@media(max-width:760px){

  #app{flex-direction:column;}

  /* ---- cabeçalho escuro, como aplicativo ----
     Escuro de propósito: no iPhone o relógio e a bateria são desenhados em
     BRANCO por cima da página. Sobre a barra branca de antes eles sumiam. */
  #topbar{
    background:var(--chumbo);border-bottom:none;
    padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top));
    padding-left:calc(14px + env(safe-area-inset-left));
    padding-right:calc(14px + env(safe-area-inset-right));
    gap:10px;
  }
  #topbar h1{color:#fff;font-size:16px;line-height:1.25;}
  #topbar .sub{color:#a9b0bd;font-size:11px;}
  #topbar .tit{min-width:0;flex:1;}
  #topbar h1, #topbar .sub{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* no celular o backup sai do cabeçalho: mora na tela Sincronizar, e aqui
     só roubava a largura do título */
  #topbar .actions{display:none;}

  #btnMenu{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;flex-shrink:0;
    background:#3a3f47;border:none;border-radius:10px;color:#fff;cursor:pointer;
    padding:0;-webkit-tap-highlight-color:transparent;
  }
  #btnMenu:active{background:#4a4f57;}
  #btnMenu svg{width:21px;height:21px;}

  /* ---- a barra lateral vira gaveta ---- */
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:120;
    width:82%;max-width:310px;
    transform:translateX(-102%);
    transition:transform .22s ease-out;
    box-shadow:2px 0 22px rgba(0,0,0,.34);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
  }
  #app.gaveta-aberta #sidebar{transform:translateX(0);}

  #gavetaFundo{
    display:block;position:fixed;inset:0;z-index:110;
    background:rgba(14,16,20,.5);
    opacity:0;pointer-events:none;transition:opacity .22s ease-out;
  }
  #app.gaveta-aberta #gavetaFundo{opacity:1;pointer-events:auto;}

  #sidebar .brand{position:relative;padding:16px 14px;}
  #btnFecharGaveta{
    display:flex;align-items:center;justify-content:center;
    position:absolute;top:12px;right:10px;width:34px;height:34px;
    background:none;border:none;color:#9aa0ab;cursor:pointer;padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  #btnFecharGaveta svg{width:19px;height:19px;}

  /* a lista rola PARA CIMA, nunca para o lado */
  #sidebar nav{display:block;overflow-y:auto;overflow-x:hidden;padding:8px 0;
               -webkit-overflow-scrolling:touch;}
  .navbtn{width:100%;padding:13px 18px;font-size:14.5px;}
  #sidebar .foot{display:block;}

  #content{padding:14px;
           padding-left:calc(14px + env(safe-area-inset-left));
           padding-right:calc(14px + env(safe-area-inset-right));
           padding-bottom:calc(24px + env(safe-area-inset-bottom));}

  .sync-ind{padding-left:calc(14px + env(safe-area-inset-left));
            padding-right:calc(14px + env(safe-area-inset-right));}

  /* ---- barra de filtros: uma coisa por linha ----
     As telas montam a barra como flex com selects de max-width:200px por
     estilo direto. Em 390px dois deles não cabem lado a lado, então quebravam
     no meio e um rótulo solto ("Ordem:") subia para a linha errada.
     Aqui tudo vira coluna de largura cheia. Vale para as 6 telas que usam
     .section-title, sem tocar em nenhuma delas. */
  .section-title{flex-direction:column;align-items:stretch;gap:10px;}
  .section-title > div{
    display:flex;flex-direction:column;align-items:stretch;gap:8px;width:100%;
  }
  .section-title select,
  .section-title input{max-width:none!important;width:100%;}
  .section-title > .btn{width:100%;justify-content:center;}
  .section-title span{text-align:left;}

  /* ---- abas LADO A LADO ----
     Antes eu tinha posto flex:1 1 100%, que empurrava cada aba para uma linha.
     O Maycon usou e reclamou com razão: são duas abas curtas, cabem juntas.
     Cada uma divide a linha e o sufixo explicativo some (ver .detalhe). */
  .tabs{gap:0;}
  .tab{flex:1 1 0;min-width:0;text-align:center;padding:11px 6px;font-size:12.5px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---- o texto longo some, a versão curta aparece ----
     Todo lugar que precisa de dois tamanhos usa este par: .detalhe é a palavra
     inteira (computador) e .ini é a inicial ou abreviação (celular). Os dois
     vão no HTML e quem escolhe é o CSS — girar o aparelho não redesenha nada. */
  .detalhe{display:none;}
  .ini{display:inline;}

  /* ---- caixas de contagem: menores e lado a lado ---- */
  .grid-kpi{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px;}
  .grid-kpi .kpi{padding:8px 10px;}
  .grid-kpi .kpi .v{font-size:17px;line-height:1.15;}
  .grid-kpi .kpi .l{font-size:10px;margin-top:1px;line-height:1.25;}

  /* ---- a tabela de lançar o dia tem que CABER, não rolar ---- */
  table.ponto-dia{font-size:12px;}
  table.ponto-dia th, table.ponto-dia td{padding:5px 3px;}
  /* A coluna "#" some no celular. É só numeração de linha, não informação — e os
     13px dela eram justamente o que faltava para os botões não quebrarem em duas
     linhas. Quantas pessoas há no dia continua escrito acima da tabela. */
  table.ponto-dia th:first-child, table.ponto-dia td:first-child{display:none;}
  /* nome em UMA linha; se não couber, corta com reticências (o title mostra inteiro) */
  table.ponto-dia td.nome{max-width:0;width:99%;overflow:hidden;
                          text-overflow:ellipsis;white-space:nowrap;}
  table.ponto-dia td.nome b{font-weight:600;}
  table.ponto-dia td.lancamento{white-space:nowrap;padding-right:0;width:1px;}
  table.ponto-dia td.lancamento .btn{padding:5px 4px;min-width:25px;justify-content:center;
                                     font-size:11.5px;border-radius:5px;margin-left:2px;
                                     gap:0;}
  table.ponto-dia td.lancamento .btn:first-child{margin-left:0;}
  table.ponto-dia .badge{padding:2px 4px;font-size:10px;}
}

/* Aparelho estreito (iPhone mini, SE): em 390px a tabela do dia cabia, mas
   raspando. Aqui ela ganha folga apertando o que não é informação — recuo das
   células e tamanho dos botões. Abaixo de ~340px ainda sobra rolagem lateral
   dentro da tabela; é o limite honesto sem esconder coluna que o Maycon pediu. */
@media(max-width:410px){
  table.ponto-dia{font-size:11.5px;}
  table.ponto-dia th, table.ponto-dia td{padding:4px 2px;}
  table.ponto-dia td.lancamento .btn{padding:5px 3px;min-width:22px;font-size:11px;
                                     margin-left:1px;}
  table.ponto-dia .badge{padding:1px 3px;font-size:9.5px;}

  /* ---- nada empurra a página para os lados ---- */
  .card{padding:14px;}
  .modal{padding:16px 14px;}
  .modal-bg{padding:16px 10px;}
  .searchbar{max-width:none;}
  .section-title{align-items:flex-start;}
  /* botão em linha de tabela vira largura cheia quando a tabela empilha */
  .table-wrap{margin-left:-2px;margin-right:-2px;}
}

/* trava final: o corpo da página nunca rola de lado, em nenhum tamanho.
   Conteúdo largo (tabela, calendário) rola dentro da própria caixa. */
html, body{max-width:100%;overflow-x:hidden;}
#main, #content{min-width:0;}

/* Item de grid nasce com min-width:auto, então um número comprido
   ("R$ 1.234.567,89") empurra a coluna para além do 1fr e a linha inteira
   fica mais larga que a tela. minmax(0,1fr) + min-width:0 impedem isso.
   Era o que estourava a tela de Custo Consolidado em 8px. */
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));}}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:minmax(0,1fr);}}
.kpi, .grid > *{min-width:0;}
.kpi .v{overflow-wrap:anywhere;}

/* =========================================================
   TABELA VIRA FICHA NO CELULAR
   O incômodo relatado: a lista de funcionários era mais larga que a tela, e o
   botão de ação ficava escondido à direita — para achar, tinha que arrastar de
   lado. Aqui cada LINHA vira um cartão empilhado, com o nome da coluna ao lado
   do valor. Nada mais fica escondido e não existe mais rolagem lateral.

   O rótulo de cada célula vem do data-rotulo, que o 09c_ui_mobile.js coloca
   sozinho lendo o <th> da própria tabela. Assim vale para TODAS as telas do
   sistema sem mexer em nenhuma delas.

   A tabela que se recusa a empilhar (calendário, tabelas de conferência lado a
   lado) recebe a classe .tabela-larga e continua rolando dentro da caixa dela.
   ========================================================= */
@media(max-width:760px){
  table.empilha, table.empilha tbody, table.empilha tr, table.empilha td{
    display:block;width:100%;
  }
  table.empilha thead{
    position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;   /* some da vista, fica para o leitor de tela */
  }
  table.empilha tr{
    border:1px solid var(--cinza-borda);border-radius:10px;
    padding:4px 0;margin-bottom:10px;background:#fff;
  }
  table.empilha tr:hover td{background:transparent;}
  table.empilha td{
    display:flex;align-items:flex-start;gap:12px;
    padding:7px 12px;border-bottom:1px solid #f1f2f6;text-align:left;
  }
  table.empilha tr td:last-child{border-bottom:none;}
  table.empilha td::before{
    content:attr(data-rotulo);
    flex:0 0 38%;max-width:38%;
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:#8b909a;padding-top:2px;
  }
  /* célula sem rótulo (a dos botões) ocupa a linha inteira */
  table.empilha td[data-rotulo=""]::before,
  table.empilha td:not([data-rotulo])::before{display:none;}
  table.empilha td[data-rotulo=""],
  table.empilha td:not([data-rotulo]){
    justify-content:flex-start;flex-wrap:wrap;gap:6px;
    background:#fbfbfd;border-radius:0 0 9px 9px;padding-top:10px;padding-bottom:10px;
  }
  /* a primeira célula é o identificador da ficha: maior e sem rótulo repetido */
  table.empilha td:first-child{
    font-weight:700;font-size:13.6px;color:var(--chumbo);
    background:var(--cinza-bg);border-radius:9px 9px 0 0;padding:10px 12px;
  }
  table.empilha td:first-child::before{display:none;}

  /* a que não empilha: rola dentro da caixa, com aviso de que dá para arrastar */
  .table-wrap{position:relative;}
  .table-wrap.rolavel::after{
    content:'arraste de lado para ver o resto →';
    display:block;font-size:10.5px;color:#9aa0ab;padding:6px 2px 0;text-align:right;
  }
}

/* ---------- COMPONENTS ---------- */
.btn{
  border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.btn-primary{background:var(--azul);color:#fff;}
.btn-primary:hover{background:var(--azul-esc);}
.btn-secondary{background:var(--branco);color:var(--chumbo);border:1px solid var(--cinza-borda);}
.btn-secondary:hover{background:#eceef2;}
.btn-danger{background:#fdecea;color:var(--vermelho);}
.btn-danger:hover{background:#f9d8d4;}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.card{background:var(--branco);border:1px solid var(--cinza-borda);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
.card h2{font-size:15px;margin:0 0 14px;color:var(--chumbo);}
.card h3{font-size:13px;margin:0 0 10px;color:var(--chumbo-claro);text-transform:uppercase;letter-spacing:.03em;}

.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

label{display:block;font-size:11.5px;font-weight:600;color:var(--chumbo-claro);margin-bottom:4px;}
input, select, textarea{
  width:100%;padding:8px 10px;border:1px solid var(--cinza-borda);border-radius:7px;
  font-size:13.5px;font-family:var(--font);background:#fff;color:var(--chumbo);
}
input:focus, select:focus, textarea:focus{outline:2px solid var(--azul-claro);border-color:var(--azul);}
input:disabled{background:#f5f6f9;color:#7a808c;}
.field{margin-bottom:12px;}
.field-inline{display:flex;gap:8px;align-items:center;}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--chumbo-claro);margin-bottom:7px;cursor:pointer;}
.check input{width:auto;margin:0;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{background:var(--cinza-bg);text-align:left;padding:8px 10px;font-weight:700;color:var(--chumbo-claro);border-bottom:2px solid var(--cinza-borda);white-space:nowrap;}
td{padding:7px 10px;border-bottom:1px solid #eceef2;vertical-align:middle;}
tr:hover td{background:#fafbfd;}
.table-wrap{overflow-x:auto;}
.empty{padding:26px;text-align:center;color:#9aa0ab;font-size:13px;}
.num{text-align:right;}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-blue{background:var(--azul-claro);color:var(--azul-esc);}
.badge-green{background:#e5f5ea;color:var(--verde);}
.badge-red{background:#fdecea;color:var(--vermelho);}
.badge-yellow{background:#fbf1dc;color:var(--amarelo);}
.badge-gray{background:#eceef2;color:#6c7280;}
.badge-purple{background:#f0e9fb;color:#6b3fa0;}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{background:#fff;border:1px solid var(--cinza-borda);border-radius:var(--radius);padding:16px 18px;}
.kpi .v{font-size:23px;font-weight:800;color:var(--azul-esc);}
.kpi .l{font-size:11.5px;color:#7a808c;margin-top:3px;}

.modal-bg{position:fixed;inset:0;background:rgba(20,22,26,.55);display:flex;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:30px 14px;}
.modal{background:#fff;border-radius:12px;max-width:820px;width:100%;padding:22px 24px;margin-bottom:30px;}
.modal.wide{max-width:1000px;}
.modal h2{margin:0 0 16px;font-size:16px;}
.modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#9aa0ab;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;border-top:1px solid var(--cinza-borda);padding-top:14px;}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--cinza-borda);margin-bottom:16px;flex-wrap:wrap;}
.tab{background:none;border:none;padding:9px 15px;font-size:13px;font-weight:600;color:#7a808c;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab.active{color:var(--azul-esc);border-bottom-color:var(--azul);}
/* aba-botão apagada: usada nos dois passos da tela do dia, que só acendem
   quando têm o que fazer. Fica na tela mesmo apagada, senão o passo some e
   ninguém descobre que ele existe. */
.tab:disabled{opacity:.38;cursor:default;}

/* Seletor das duas folhas de ponto (fichados / diaristas). Deliberadamente NÃO
   usa .tabs: no celular a regra .tab{flex:1 1 100%} joga cada aba numa linha,
   e estes dois precisam ficar lado a lado — é a escolha de QUEM, feita antes de
   tudo, e ver as duas juntas é o que mostra que a outra folha existe. */
.segmento{display:flex;gap:4px;max-width:560px;background:var(--cinza-bg);border:1px solid var(--cinza-borda);border-radius:10px;padding:4px;margin-bottom:14px;}
.seg{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:none;border-radius:7px;padding:9px 10px;font-size:13px;font-weight:700;color:#7a808c;cursor:pointer;font-family:inherit;}
.seg.active{background:var(--branco);color:var(--azul-esc);box-shadow:0 1px 3px rgba(16,24,40,.14);}
/* contador de presença a confirmar da OUTRA folha: sem ele, unir as telas
   esconderia a pendência do tipo que não está aberto */
.seg-pend{background:var(--amarelo);color:#fff;border-radius:9px;min-width:18px;padding:1px 6px;font-size:11px;font-weight:700;}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.calendar .dow{font-size:10.5px;font-weight:700;color:#9aa0ab;text-align:center;padding:4px 0;}
.calendar .day{
  border:1px solid var(--cinza-borda);border-radius:7px;min-height:58px;padding:5px;font-size:11px;cursor:pointer;background:#fff;position:relative;
}
.calendar .day.blank{background:transparent;border:none;cursor:default;}
.calendar .day .nd{font-weight:700;color:var(--chumbo-claro);}
.calendar .day .st{font-size:9.5px;font-weight:700;margin-top:2px;line-height:1.2;}
.calendar .day.trabalhado{background:#e5f5ea;}
.calendar .day.falta_justificada{background:#fbf1dc;}
.calendar .day.falta_injustificada{background:#fdecea;}
.calendar .day.atestado{background:var(--azul-claro);}
.calendar .day.folga{background:#eceef2;}
.calendar .day.falta{background:#fdecea;}
.calendar .day.feriado{background:#f0e9fb;}
.calendar .day.sabado{background:#e5f5ea;}
.calendar .day.fora{opacity:.42;}
/* dia preenchido pelo sistema e ainda não conferido pelo usuário */
.calendar .day.aconfirmar{border-style:dashed;border-color:var(--amarelo);}
.calendar .day .pend{color:var(--amarelo);font-size:15px;line-height:0;margin-left:3px;}
.calendar .day .qbtn{position:absolute;bottom:3px;right:4px;font-size:12px;opacity:.28;}
.calendar .day .qbtn.on{opacity:1;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--chumbo-claro);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.08);}

.toast{position:fixed;bottom:20px;right:20px;background:var(--chumbo);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2);}

/* faixa de estado da sincronização — aparece em todas as telas */
.sync-ind{display:flex;align-items:center;gap:10px;padding:9px 26px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--cinza-borda);}
.sync-ind .pt{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.sync-ind button{margin-left:auto;}
.sync-ind.pendente{background:#fdf3e2;color:#8a5a00;border-bottom-color:#e8d2a8;}
.sync-ind.pendente .pt{background:#e39b00;box-shadow:0 0 0 3px rgba(227,155,0,.22);}
.sync-ind.ok{background:#eef8f1;color:#1f6b3e;border-bottom-color:#cfe8d8;}
.sync-ind.ok .pt{background:var(--verde);}
.sync-ind.neutro{background:var(--azul-claro);color:var(--azul-esc);border-bottom-color:#c9d6f7;}
.sync-ind.neutro .pt{background:var(--azul);}
@media(max-width:760px){.sync-ind{padding:9px 14px;}}

/* ---- o mesmo estado, no pé da barra lateral (computador) ----
   Sobre fundo escuro, então as cores são as do ponto e do texto, não do fundo:
   uma faixa clara aqui brigaria com a lateral. */
.sync-lat{display:none;padding:10px 16px;border-top:1px solid #40444c;font-size:11px;
          line-height:1.45;color:#a9b0bd;}
.sync-lat .pt{display:inline-block;width:8px;height:8px;border-radius:50%;
              margin-right:6px;vertical-align:middle;flex-shrink:0;}
.sync-lat .btn{width:100%;justify-content:center;margin-top:7px;padding:6px 8px;font-size:11.5px;}
.sync-lat.pendente{color:#f0c674;}
.sync-lat.pendente .pt{background:#e39b00;box-shadow:0 0 0 3px rgba(227,155,0,.25);}
.sync-lat.ok      .pt{background:#3fbf6f;}
.sync-lat.neutro  .pt{background:#6f8ad6;}

/* No computador o estado fica na lateral; no celular, na faixa do topo.
   Um dos dois sempre aparece, nunca os dois. */
@media(min-width:761px){
  #syncIndicador{display:none;}
  .sync-lat{display:block;}
}

.help{font-size:11.5px;color:#9aa0ab;margin-top:3px;line-height:1.5;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.searchbar{max-width:280px;}
.rowlink{cursor:pointer;}

/* =========== PRINT / DOCUMENTOS =========== */
#printArea{display:none;}
@media print{
  @page{size:A4;margin:10mm;}

  /* O app sai da impressão com display:none, NÃO com visibility:hidden.
     `visibility:hidden` esconde mas mantém o espaço ocupado: a altura da tela
     do app continuava contando e saíam páginas em branco no fim de todo
     documento curto. Descoberto em 28/08/2026, ao ver o resumo do mês — que
     cabe em meia folha — sair com 2 páginas. */
  #app{display:none!important;}
  #printArea{display:block;position:static;width:100%;}
  .no-print{display:none!important;}
  .pagebreak{page-break-after:always;}
}
.doc{font-family:Arial, Helvetica, sans-serif;color:#111;font-size:11px;}
.doc + .doc{margin-top:26px;}

/* cabeçalho institucional */

/* tabela formulário (ficha de admissão) */

.fbox .fbt{background:#e9edf6;font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-bottom:1px solid #444;text-transform:uppercase;}

/* tabela de dados nos documentos */
.dtab{width:100%;border-collapse:collapse;font-size:10px;}
.dtab th{background:#e9edf6;border:1px solid #444;padding:3px 5px;font-weight:800;font-size:9px;text-transform:uppercase;letter-spacing:.03em;color:#111;text-align:left;white-space:nowrap;}
.dtab td{border:1px solid #b9bec8;padding:3px 5px;}
.dtab td.n{text-align:right;white-space:nowrap;}
.dtab td.c{text-align:center;}
.dtab tfoot td{font-weight:800;background:#f2f4f9;}
.dtab .grp td{background:#dde3f0;font-weight:800;font-size:9.5px;text-transform:uppercase;}

/* ---- folha de ponto para a contabilidade ----
   Um bloco por semana, 5 dias × 2 colunas (D e E) + nome + cargo + total = 14
   colunas. Só cabe em A4 retrato apertando fonte e padding, e deixando o nome
   quebrar linha (o white-space:nowrap do .dtab th estouraria a largura). */
/* Uma folha da impressão. O cabeçalho é repetido dentro de cada `.fpag` pelo
   próprio código (04c_folha_contabil.js), e a quebra é explícita.

   Já foi feito com `<thead>` de uma tabela que envolvia o documento, contando
   que o navegador repetisse o thead a cada página. **Funciona no Chrome/Edge e
   não funciona no Safari do iPhone**, onde o cabeçalho saía sozinho numa
   primeira folha em branco. Não voltar para aquilo. */
.fpag.quebra{page-break-after:always;break-after:page;}

.fcont{font-size:9px;margin-bottom:12px;page-break-inside:avoid;}
.fcont th{padding:3px 4px;font-size:8px;white-space:normal;text-align:center;vertical-align:middle;}
.fcont td{padding:3px 4px;}
.fcont th.c, .fcont td.c{text-align:center;}
/* dia que pertence ao mês vizinho, ou pessoa fora do vínculo: não conta */

.flegenda{margin:8px 0 12px;font-size:9px;color:#333;background:#f2f4f9;
          border:1px solid #d5dae6;border-radius:4px;padding:5px 8px;}
.flegenda b{color:#111;}

/* resumo do mês: uma linha por pessoa, os números do mês fechado */

.fresumo th{padding:3px 4px;font-size:8px;white-space:normal;text-align:center;}
.fresumo td{padding:3px 5px;}
.fresumo td.c, .fresumo th.c{text-align:center;}
.fresumo .obs{font-size:8px;color:#555;}
.fresumo tfoot td{font-weight:800;background:#f2f4f9;}

/* holerite / recibo de pagamento */
.hol{border:1.4px solid #000;padding:0;margin-bottom:8px;}

.hol .hfun .r{text-align:right;line-height:1.45;}
.holtab{width:100%;border-collapse:collapse;font-size:9.5px;}
.holtab th{border-bottom:1px solid #000;border-right:1px solid #000;padding:2px 5px;font-weight:700;font-size:9px;background:#fff;text-align:center;}
.holtab th.hl{text-align:left;}
.holtab td{border-right:1px solid #000;padding:1.5px 5px;}
.holtab td.n{text-align:right;}
.holtab td.c{text-align:center;}
.holtab td:last-child, .holtab th:last-child{border-right:none;}
.holtab .filler td{height:100%;border-right:1px solid #000;}

.holliq{display:flex;border-top:1px solid #000;border-bottom:1.4px solid #000;font-size:10px;}

/* assinaturas genéricas */

.dnote{font-size:9.5px;line-height:1.6;margin:10px 0 0;}
</style>

<body>
<div id="app">
  <!-- Fundo escurecido atrás da gaveta. Só existe no celular. -->
  <div id="gavetaFundo" class="no-print" onclick="fecharGaveta()"></div>
  <div id="sidebar">
    <div class="brand">
      <!-- logo e nome vêm dos DADOS, não do HTML — ver "AS DUAS LOGOS" mais abaixo -->
      <img id="brandLogo" alt="">
      <div class="name" id="brandNome"></div>
      <button id="btnFecharGaveta" class="no-print" onclick="fecharGaveta()" aria-label="Fechar menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <nav id="navMenu"></nav>
    <!-- No computador o estado da sincronização mora AQUI, no pé da barra
         lateral, junto da versão. Antes era uma faixa colorida de largura
         inteira no topo do conteúdo, que no monitor grande ficava enorme para
         a informação que carrega. No celular ela continua no topo — lá o
         espaço é vertical e a faixa é o único lugar onde se vê o estado. -->
    <div id="syncLateral" class="sync-lat"></div>
    <div class="foot">Sistema de RH · offline<br>Dados salvos neste navegador
      <br><span id="versaoApp" style="color:#6f747d;"></span></div>
  </div>
  <div id="main">
    <div id="topbar">
      <!-- Botão da gaveta. Só aparece no celular; no computador a barra lateral
           fica sempre visível e o CSS esconde este botão. -->
      <button id="btnMenu" class="no-print" onclick="abrirGaveta()" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="tit">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub">Visão geral da operação</div>
      </div>
      <div class="actions no-print">
        <button class="btn btn-secondary btn-sm" onclick="exportBackup()">⬇ Exportar backup</button>
        <label class="btn btn-secondary btn-sm" style="margin:0;">⬆ Importar backup
          <input type="file" accept=".json" style="display:none" onchange="importBackup(event)">
        </label>
      </div>
    </div>
    <div id="syncIndicador" class="sync-ind neutro"></div>
    <div id="content"></div>
  </div>
</div>

<div id="printArea"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* Versão do programa. BUMPAR A MÃO a cada publicação — é o que permite
   comparar num relance se o celular e os PCs estão na mesma versão. */
const VERSAO = '2026-09-01 · 24';

/* =========================================================
   AS DUAS LOGOS — e por que são duas

   Até 28/08/2026 a logo da EMPRESA vinha embutida no HTML, junto com o nome, o
   CNPJ, o endereço e os nomes das obras (que são os clientes). Como o app é
   publicado num repositório PÚBLICO do GitHub, tudo isso ia junto.

   Agora:
   - `LOGO_APP` é uma marca genérica, desenhada para o app. É a única que fica
     no arquivo, e não identifica ninguém. Vale como ícone na Tela de Início.
   - A logo da EMPRESA mora nos DADOS (`DB.empresa.logo`), importada pelo próprio
     usuário em Configurações. Sai nos documentos e no topo do menu.

   Nunca volte a embutir a logo ou os dados da empresa no HTML.
   ========================================================= */
const LOGO_APP = 'data:image/svg+xml;base64,' + btoa(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
  '<rect width="64" height="64" rx="14" fill="#1c4fd8"/>' +
  '<circle cx="26" cy="24" r="7.5" fill="#fff"/>' +
  '<path d="M12 47a14 14 0 0 1 28 0z" fill="#fff"/>' +
  '<path d="M40 34.5l5.5 5.5L56 29.5" fill="none" stroke="#fff" ' +
  'stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>' +
  '</svg>');

/* a marca que aparece para o usuário: a da empresa quando ele importou, senão a do app */
function logoVisivel(){ return (DB.empresa && DB.empresa.logo) || LOGO_APP; }
/* o nome que aparece: o que ele cadastrou, senão um convite para cadastrar */
function nomeVisivel(){
  return (DB.empresa && DB.empresa.razaoSocial) || 'Configure sua empresa';
}
function pintarMarca(){
  const img = document.getElementById('brandLogo');
  const nom = document.getElementById('brandNome');
  if(img) img.src = logoVisivel();
  if(nom) nom.textContent = nomeVisivel();
}

document.getElementById('versaoApp').textContent = 'versão ' + VERSAO;
/* ícone da Tela de Início no iPhone — sempre o do APP, nunca o da empresa:
   o ícone é gerado antes de existir dado, e não pode vazar marca nenhuma */
(function(){
  const l = document.createElement('link');
  l.rel = 'apple-touch-icon';
  l.href = LOGO_APP;
  document.head.appendChild(l);
})();
/* =========================================================
   BELA ANGRA · SISTEMA DE RH — offline, dados no localStorage
   ========================================================= */

const DB_KEY = 'belaAngraRH_v1';
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW = ['D','S','T','Q','Q','S','S'];
const DOW_FULL = ['DOM','SEG','TER','QUA','QUI','SEX','SAB'];

/* Tabela INSS 2026 — faixas progressivas (alíquota + parcela a deduzir) */
const TABELA_INSS_2026 = [
  {ate: 1621.00,  aliq: 7.5,  deduz: 0     },
  {ate: 2902.84,  aliq: 9.0,  deduz: 24.32 },
  {ate: 4354.27,  aliq: 12.0, deduz: 111.40},
  {ate: 8475.55,  aliq: 14.0, deduz: 198.49}
];
const TETO_INSS_2026 = 8475.55;

function defaultDB(){
  return {
    /* EM BRANCO DE PROPÓSITO. O app é publicado num repositório PÚBLICO do
       GitHub: tudo que estiver aqui vai junto no arquivo. Até 28/08/2026 estes
       campos vinham preenchidos, e o `index.html` publicado carregava o CNPJ, o
       endereço e — pelas obras padrão — os NOMES DOS CLIENTES.
       Empresa e obras agora são dados, preenchidos pelo usuário e sincronizados
       como qualquer registro. Não repovoar. */
    empresa: {
      codigo: '',
      razaoSocial: '',
      endereco: '',
      cnpj: '',
      logo: ''            // data URI, importada em Configurações
    },
    funcionarios: [],
    obras: [],
    diasUteisMes: {},     // 'YYYY-MM' -> nº de dias trabalhados usado no vale daquele mês
    pontoMensal: {},      // `${funcId}_${YYYY-MM}` -> {dias:{'YYYY-MM-DD':status}}
    pontoDiarista: [],    // {id, funcionarioId, obraId, data, status, quentinha}
    adiantamentos: [],    // {id, funcionarioId, data, valor, descricao}
    /* Pagamentos já feitos, marcados à mão no fechamento enquanto ele paga um a
       um. Serve para não pagar duas vezes nem esquecer alguém no meio da lista.
       {id, funcionarioId, sexta, periodicidade, valor, quando}
       Quando o módulo de caixa existir, cada marca destas vira um lançamento de
       saída — é a ponte já pensada entre o RH e o financeiro. */
    pagamentos: [],
    vales: [],            // VT/VR dos fichados
    holerites: [],
    epiEntradas: [],
    epiSaidas: [],

    /* ---------- FINANCEIRO ----------
       Tudo aqui nasce VAZIO pelo mesmo motivo de `empresa` e `obras`: o app é
       publicado num repositório PÚBLICO. O nome das empresas do grupo é o nome
       da família, e o nome das contas e dos clientes identifica a operação.
       NADA disso pode virar valor padrão no código — é cadastro do usuário.

       Por que uma LISTA de empresas e não um campo: a operação tem duas pessoas
       jurídicas. Uma assina os contratos e recebe do cliente; a outra tem os
       funcionários e as despesas. Um financeiro de uma empresa só mostraria
       resultado zero para sempre, porque a segunda é centro de custo por
       desenho. Ver "SINCRONIA CLAUDE/ESTRUTURA - CBA e CEBA.md".

       `DB.empresa` (singular, acima) é OUTRA COISA: é o cabeçalho dos
       documentos de RH — quem assina o holerite e o recibo. Não confundir. */
    empresas: [],     // {id, nome, apelido, cnpj, papel, ativo}
    contas: [],       // {id, empresaId, nome, tipo, saldoInicial, dataSaldoInicial, ativo}
    categorias: [],   // {id, nome, especie:'receita'|'despesa', ativo}  — o plano de contas
    /* {id, empresaId, tipo:'receita'|'despesa'|'transferencia', natureza:'operacao'|'particular',
        descricao, categoriaId, obraId, contaId, contaDestinoId, empresaDestinoId,

       A baixa é uma LISTA, não um campo: em 2025 três medições foram pagas a

let DB = loadDB();

function migrate(db){
  const base = defaultDB();
  db.empresa       = Object.assign({}, base.empresa, db.empresa||{});
  db.config        = Object.assign({}, base.config, db.config||{});
  db.config.encargosAtivos = Object.assign({}, base.config.encargosAtivos, db.config.encargosAtivos||{});
  db.config.codigos        = Object.assign({}, base.config.codigos, db.config.codigos||{});
  db.adiantamentos = db.adiantamentos || [];
  db.pagamentos    = db.pagamentos    || [];   /* marca de pago no fechamento */
  db.diasUteisMes  = db.diasUteisMes  || {};
  /* financeiro — coleções novas em 30/08/2026. Banco antigo não tem nenhuma
     delas, e o app precisa abrir igual com ou sem financeiro cadastrado. */
  db.empresas      = db.empresas      || [];
  db.contas        = db.contas        || [];
  db.categorias    = db.categorias    || [];
  db.lancamentos   = db.lancamentos   || [];
  db.recorrentes   = db.recorrentes   || [];
  (db.lancamentos).forEach(l=>{ l.baixas = l.baixas || []; });
  db._meta = Object.assign({tombstones:{}, mapaTs:{}, objetoTs:{}, ultimaSync:null, ultimaEdicao:null, arquivoNome:''}, db._meta||{});
  Object.keys(db.pontoMensal||{}).forEach(k=>{
    const r = db.pontoMensal[k]; r.dias = r.dias||{}; r.ts = r.ts||{};
  });
  /* separa o antigo campo único `vt` em dois: transporte e refeição */
  (db.funcionarios||[]).forEach(f=>{
    if(f.recebeVT === undefined) f.recebeVT = (f.vt === 'sim');
    if(f.recebeVR === undefined) f.recebeVR = (f.vt === 'sim');
  });
  db.funcionarios  = (db.funcionarios||[]).map(f=>Object.assign({
    tipoServico: 'homem_hora',
    periodicidade: 'semanal',
    regimePagamento: f.tipo==='diarista' ? 'dia' : 'mes',
    dependentes: [],
    cbo: '', matricula: ''
  }, f));
  return db;
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    return migrate(Object.assign(defaultDB(), parsed));
  }catch(e){
    console.error('Falha ao carregar dados, iniciando novo banco.', e);
    return defaultDB();
  }
}
/* Se o navegador bloquear o armazenamento local, o app continua funcionando na
   sessão atual e avisa o usuário — em vez de quebrar a tela inteira. */
let storageOK = true;
function saveDB(){
  // carimba nos registros alterados a hora da mudança — é o que permite
  // juntar os dados de dois computadores sem ninguém perder trabalho
  try{ carimbarAlteracoes(); _foto = tirarFoto(DB); atualizarIndicadorSync(); }catch(e){ /* módulo de sync ainda não carregado */ }
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  }catch(e){
    if(storageOK){
      storageOK = false;
      console.warn('Armazenamento local indisponível:', e);
      avisoStorage();
    }
  }
}

function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function dowOf(iso){ return parseISO(iso).getDay(); }
function isSabado(iso){ return dowOf(iso)===6; }

function esc(s){

/* ---------------- CÁLCULO DE INSS (tabela progressiva 2026) ---------------- */
function calcInss(base){
  base = Number(base)||0;
  if(base<=0) return 0;
  const b = Math.min(base, TETO_INSS_2026);
  const faixa = TABELA_INSS_2026.find(f=> b <= f.ate) || TABELA_INSS_2026[TABELA_INSS_2026.length-1];
  return Math.round((b*faixa.aliq/100 - faixa.deduz)*100)/100;
}
function aliquotaInss(base){
  const b = Math.min(Number(base)||0, TETO_INSS_2026);
  const faixa = TABELA_INSS_2026.find(f=> b <= f.ate) || TABELA_INSS_2026[TABELA_INSS_2026.length-1];
  return faixa.aliq;
}

function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('Importar este backup vai SUBSTITUIR todos os dados atuais. Continuar?')) return;
      DB = migrate(Object.assign(defaultDB(), data));
      saveDB();
      toast('Backup importado com sucesso.');
      render();
    }catch(err){
      alert('Arquivo inválido: ' + err.message);
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

function obraNome(id){ const o = DB.obras.find(o=>o.id===id); return o ? o.nome : '—'; }
function funcNome(id){ const f = DB.funcionarios.find(f=>f.id===id); return f ? f.nome : '—'; }

function ativos(){ return DB.funcionarios.filter(f=>f.status!=='inativo'); }

/* Quem estava na empresa em algum momento do período [ini, fim].
   O demitido continua aparecendo no fechamento/holerite do período em que saiu —
   senão não teria como pagar o acerto dele. Nos períodos seguintes ele some. */
function ativosNoPeriodo(ini, fim){
  return DB.funcionarios.filter(f=>{
    if(fim && f.admissao && f.admissao > fim) return false;   // ainda não tinha entrado
    if(f.demissao) return !ini || f.demissao >= ini;          // saiu: só até o período da saída
    return f.status !== 'inativo';
  });
}
function ativosNoMes(ym){ return ativosNoPeriodo(primeiroDiaMes(ym), ultimoDiaMes(ym)); }

/* ---------- ORDEM DAS LISTAS DE FUNCIONÁRIOS ----------
   A ordem padrão espelha a folha de ponto do Maycon e a medição da Bandeira:
   agrupado por cargo (do mais graduado para o mais simples) e, dentro do cargo,
   o mais antigo de casa primeiro. Quem chegou hoje aparece por último.
   As outras ordens são opcionais — a tela sempre abre no padrão. */
const ORDEM_CARGOS = [
  ['ENCARREGADO','ENCA'],
  ['ADMINISTRATIVO','ADM'],
  ['ARMADOR','ARMA'],
  ['CARPINTEIRO','CARP'],
  ['PEDREIRO','PEDR'],
  ['ELETRICISTA','ELET'],
  ['MEIO OFICIAL','MEIO','MEIO-OFICIAL','1/2 OF','1/2 OFICIAL'],
  ['SERVENTE','SERV','AJUDANTE']
];
/* "Meio Oficial", "MEIO-OFICIAL", "1/2 of" e "Eletricista" têm que cair no mesmo lugar */
function normFuncao(s){
  return (s||'').toString().toUpperCase()
    .replace(/[ÁÀÂÃÄ]/g,'A').replace(/[ÉÈÊË]/g,'E').replace(/[ÍÌÎÏ]/g,'I')
    .replace(/[ÓÒÔÕÖ]/g,'O').replace(/[ÚÙÛÜ]/g,'U').replace(/Ç/g,'C')
    .replace(/[^A-Z0-9/ ]/g,' ').replace(/\s+/g,' ').trim();
}
function cargoRank(funcao){
  const n = normFuncao(funcao);
  if(!n) return ORDEM_CARGOS.length + 1;                    // sem cargo, no fim de tudo
  for(let i=0;i<ORDEM_CARGOS.length;i++){
    if(ORDEM_CARGOS[i].some(a=>normFuncao(a)===n)) return i;
  }
  return ORDEM_CARGOS.length;                               // cargo que não está na lista
}
/* Admissão em branco não dá para posicionar: vai para o fim do próprio cargo, do mesmo
   jeito que quem está sem cargo vai para o fim da lista. Cadastro incompleto fica visível
   no fim, em vez de fingir que a pessoa é a mais antiga da casa. */
function chaveAdmissao(f){ return f.admissao || '9999-99-99'; }

const ORDENACOES = {
  padrao: 'Padrão (cargo, antigo primeiro)',
  nome:   'Nome (A–Z)',
  funcao: 'Função (A–Z)',
  obra:   'Obra'
};
let ordemFuncionarios = 'padrao';

/* Comparador único — é ele que manda em TODA lista de funcionário do sistema.
   Use `.sort(cmpFuncionarios)` em qualquer lugar que liste gente. */
function cmpFuncionarios(a, b){
  const cmpNome = (x,y)=> (x.nome||'').localeCompare(y.nome||'', 'pt-BR');
  const cmpPadrao = (x,y)=>
       (cargoRank(x.funcao) - cargoRank(y.funcao))
    || chaveAdmissao(x).localeCompare(chaveAdmissao(y))
    || cmpNome(x,y);

  switch(ordemFuncionarios){
    case 'nome':   return cmpNome(a,b);
    case 'funcao': return normFuncao(a.funcao).localeCompare(normFuncao(b.funcao),'pt-BR') || cmpPadrao(a,b);
    case 'obra':   return obraNome(a.obraPadrao).localeCompare(obraNome(b.obraPadrao),'pt-BR') || cmpPadrao(a,b);
    default:       return cmpPadrao(a,b);
  }
}
function ordenarFuncionarios(lista){ return lista.slice().sort(cmpFuncionarios); }

/* <select> de ordenação, igual em todas as telas que listam gente */
function selectOrdem(acao){
  return `<select onchange="ordemFuncionarios=this.value; ${acao}">`
    + Object.keys(ORDENACOES).map(k=>
        `<option value="${k}" ${ordemFuncionarios===k?'selected':''}>${ORDENACOES[k]}</option>`).join('')
    + `</select>`;
}
/* <option>s de obra para os filtros; `sel` é o id da obra escolhida */
function opcoesObra(sel){
  return `<option value="">Todas as obras</option>`
    + DB.obras.map(o=>`<option value="${o.id}" ${sel===o.id?'selected':''}>${esc(o.nome)}</option>`).join('');
}
function filtraObra(lista, obraId){
  return obraId ? lista.filter(f=>f.obraPadrao===obraId) : lista;
}

/* Ponto não pode ser lançado fora do vínculo. Devolve 'antes', 'depois' ou ''. */
function foraDoVinculo(f, iso){
  if(!f) return '';
  if(f.admissao && iso < f.admissao) return 'antes';
  if(f.demissao && iso > f.demissao) return 'depois';
  return '';
}
/* =========================================================
   PRESENÇA PRESUMIDA
   O ponto é preenchido como presença por padrão (é o mais provável) e marcado
   como "a confirmar". Quem confirma é o Maycon, tocando no dia. Enquanto não
   confirma, o app mostra o número e cobra — porque presença presumida vira
   dinheiro cobrado do cliente e pago ao funcionário.
   ========================================================= */
function ehFuturo(iso){ return iso > todayISO(); }

/* dias presumidos (ainda não conferidos) de um funcionário num mês */
function presumidosDoMes(f, ym){
  let n = 0;
  if(f.tipo === 'fichado'){
    const reg = DB.pontoMensal[`${f.id}_${ym}`];
    if(reg && reg.auto) Object.keys(reg.auto).forEach(iso=>{
      if(reg.auto[iso] && reg.dias[iso]) n++;
    });
  } else {
    DB.pontoDiarista.forEach(e=>{
      if(e.funcionarioId===f.id && e.auto && e.status && (e.data||'').slice(0,7)===ym) n++;
    });
  }
  return n;
}

/* total de dias a confirmar até hoje — é o que a faixa de aviso mostra */
function totalPresumidosAteHoje(tipo){
  const hoje = todayISO();
  /* 'todos' é a folha mista da tela do dia; sem tipo nenhum vale o mesmo */
  const ambos = !tipo || tipo === 'todos';
  let n = 0, maisAntigo = null;
  const conta = iso => { n++; if(!maisAntigo || iso < maisAntigo) maisAntigo = iso; };

  if(ambos || tipo==='fichado'){
    Object.keys(DB.pontoMensal).forEach(k=>{
      const reg = DB.pontoMensal[k];
      if(!reg || !reg.auto) return;
      const fid = k.replace(/_\d{4}-\d{2}$/,'');
      const f = func(fid);
      if(!f || f.tipo!=='fichado') return;
      Object.keys(reg.auto).forEach(iso=>{
        if(reg.auto[iso] && reg.dias[iso] && iso <= hoje) conta(iso);
      });
    });
  }
  if(ambos || tipo==='diarista'){
    DB.pontoDiarista.forEach(e=>{
      if(!e.auto || !e.status || e.data > hoje) return;
      const f = func(e.funcionarioId);
      if(!f || f.tipo!=='diarista') return;
      conta(e.data);
    });
  }
  return {n, maisAntigo};
}

function motivoBloqueio(f, iso){
  const fora = foraDoVinculo(f, iso);
  if(fora === 'antes')  return `Antes da admissão (${fmtDate(f.admissao)})`;
  if(fora === 'depois') return `Depois da demissão (${fmtDate(f.demissao)})`;
  return '';
}

/* dias de semana (seg a sex) de um mês — base do vale de transporte/alimentação */
function diasDeSemanaDoMes(ym){
  const [y,m] = ym.split('-').map(Number);
  const nd = daysInMonth(y,m);
  let n = 0;
  for(let d=1; d<=nd; d++){
    const dow = new Date(y, m-1, d).getDay();
    if(dow>=1 && dow<=5) n++;
  }
  return n;
}
/* quantos dias usar no vale daquele mês: o que o usuário informou, ou os dias de semana */
function diasVale(ym){
  const v = DB.diasUteisMes[ym];
  return (v===undefined || v===null || v==='') ? diasDeSemanaDoMes(ym) : Number(v);
}
/* Vale-transporte e vale-refeição são independentes: tem gente que recebe a
   alimentação mas não a passagem (o Maycon leva a pessoa, por exemplo). */
function recebeVT(f){ return f.recebeVT === undefined ? (f.vt === 'sim') : !!f.recebeVT; }
function recebeVR(f){ return f.recebeVR === undefined ? (f.vt === 'sim') : !!f.recebeVR; }
function recebeAlgumVale(f){ return recebeVT(f) || recebeVR(f); }

/* valores diários — zero quando o funcionário não recebe aquele vale */
function vtPorDia(f){
  if(!recebeVT(f)) return 0;
  return (Number(f.valorVT1)||0) + (Number(f.valorVT2)||0);
}
function vrPorDia(f){
  if(!recebeVR(f)) return 0;
  return f.valorVR===undefined || f.valorVR==='' ? (DB.config.valorVRPadrao||0) : Number(f.valorVR)||0;
}

/* ---------- navegação entre meses ---------- */
function mesMais(ym, n){
  let [y,m] = ym.split('-').map(Number);
  m += n;
  y += Math.floor((m-1)/12);
  m = ((m-1)%12+12)%12 + 1;
  return `${y}-${String(m).padStart(2,'0')}`;
}
function mesAnteriorDe(ym){ return mesMais(ym, -1); }
function primeiroDiaMes(ym){ return `${ym}-01`; }
function ultimoDiaMes(ym){
  const [y,m] = ym.split('-').map(Number);
  return `${ym}-${String(daysInMonth(y,m)).padStart(2,'0')}`;
}
/* 5º dia útil do mês — data em que o salário do mês anterior é pago */
function quintoDiaUtil(ym){
  let iso = primeiroDiaMes(ym), n = 0;
  while(true){
    const dw = dowOf(iso);
    if(dw>=1 && dw<=5) n++;
    if(n===5) return iso;
    iso = addDays(iso, 1);
  }
}

/* Dias que o funcionário efetivamente trabalha no mês, respeitando a admissão.
   É a base do vale: quem entra dia 17 não recebe o mês inteiro. */
function diasUteisDoFuncionarioNoMes(f, ym){
  const ini = primeiroDiaMes(ym), fim = ultimoDiaMes(ym);
  // admitido antes do mês começar: vale o número de dias do mês (com o ajuste global, se houver)
  if(!f.admissao || f.admissao <= ini) return diasVale(ym);
  if(f.admissao > fim) return 0;                       // ainda não tinha entrado
  let n = 0, iso = f.admissao;
  while(iso <= fim){
    const dw = dowOf(iso);
    if(dw>=1 && dw<=5) n++;
    iso = addDays(iso, 1);
  }
  return n;
}

const SERVICO_LABEL = {homem_hora:'Homem-Hora', empreitada:'Empreitada'};
const PERIODICIDADE_LABEL = {semanal:'Semanal', quinzenal:'Quinzenal'};
const REGIME_LABEL = {hora:'hora', dia:'dia', mes:'mês'};

/* ---------------- NAVEGAÇÃO ----------------
   O menu ganhou SEÇÕES em 30/08/2026, ao entrar o financeiro: com 15 telas numa
   lista corrida ninguém acha nada. O campo `secao` só agrupa visualmente — a
   navegação continua sendo `goTo(id)`, e o id de nenhuma tela mudou. */
const PAGES = [
  {id:'dashboard',    secao:'',           label:'Dashboard',                 icon:'painel',   sub:'Visão geral da operação'},

  {id:'funcionarios', secao:'RH',         label:'Funcionários',              icon:'pessoa',   sub:'Cadastro completo (ficha de admissão)'},

function icone(nome){
  return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
       + 'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" '
       + 'aria-hidden="true">' + (ICONES[nome] || '') + '</svg>';

let currentPage = 'dashboard';

function buildNav(){
  let secaoAberta = null;
  document.getElementById('navMenu').innerHTML = PAGES.map(p=>{
    /* o título só sai quando a seção MUDA — assim a ordem do PAGES manda, e
       acrescentar tela nova no meio de um grupo não exige mexer aqui */
    const titulo = (p.secao && p.secao !== secaoAberta)
      ? `<div class="navsec">${esc(p.secao)}</div>` : '';
    secaoAberta = p.secao;
    return titulo + `<button class="navbtn ${p.id===currentPage?'active':''}" onclick="goTo('${p.id}')">
      ${icone(p.icon)}<span class="rot">${p.label}</span>
    </button>`;
  }).join('');
}
/* As duas folhas de ponto viraram uma tela só em 28/08/2026. Os nomes antigos
   continuam valendo como atalho: quem chamar goTo('pontoDiarista') cai na tela
   nova já com a folha certa aberta. É o que mantém funcionando os botões que
   apontam para uma folha específica (a faixa de pendências, por exemplo). */
const PAGINA_PONTO_ANTIGA = {pontoMensal:'fichado', pontoDiarista:'diarista'};

function goTo(id){
  if(PAGINA_PONTO_ANTIGA[id]){ pontoTipo = PAGINA_PONTO_ANTIGA[id]; id = 'ponto'; }
  currentPage = id; window.scrollTo(0,0); render();
}

function render(){
  buildNav();
  pintarMarca();   /* logo e nome da empresa vêm dos dados, não do HTML */
  const page = PAGES.find(p=>p.id===currentPage);
  document.getElementById('pageTitle').textContent = page.label;
  document.getElementById('pageSub').textContent = page.sub;
  const renderers = {
    dashboard: renderDashboard, funcionarios: renderFuncionarios, obras: renderObras,
    ponto: renderPonto, fechamento: renderFechamento,
    adiantamentos: renderAdiantamentos, vales: renderVales, holerite: renderHolerite,
    estoque: renderEstoque, custos: renderCustos,
    caixa: renderCaixa, lancamentos: renderLancamentos, fluxo: renderFluxo,
    sync: renderSync, config: renderConfig
  };
  document.getElementById('content').innerHTML = '';
  renderers[currentPage]();
  try{ atualizarIndicadorSync(); }catch(e){}
}
document.addEventListener('DOMContentLoaded', render);

  const emp = DB.funcionarios.filter(f=>f.tipoServico==='empreitada' && f.status!=='inativo').length;

  const ym = currentYM();
  let faltasMes = 0;
  Object.keys(DB.pontoMensal).forEach(k=>{
    if(k.endsWith('_'+ym)){
      Object.values(DB.pontoMensal[k].dias||{}).forEach(st=>{ if(st && st.indexOf('falta')===0) faltasMes++; });
    }
  });

  const custoEstoque = DB.epiEntradas.reduce((s,e)=> s + (Number(e.quantidade)*Number(e.valorUnit)), 0);
  const saidaEstoque = DB.epiSaidas.reduce((s,e)=> s + (Number(e.quantidade)*Number(e.valorUnit)), 0);

  const proximaSexta = proximaSextaISO();
  const semanais   = ativos().filter(f=>f.tipo==='diarista' && f.periodicidade==='semanal');
  const quinzenais = ativos().filter(f=>f.tipo==='diarista' && f.periodicidade==='quinzenal');
  const ehQuinzena = isSextaQuinzenal(proximaSexta);

  const valesAbertos = DB.adiantamentos.filter(a=>{
    const f = func(a.funcionarioId);
    if(!f) return false;
    const per = periodoDaSexta(proximaSexta, f.periodicidade);
    return a.data >= per.inicio && a.data <= per.fim;

  c.innerHTML = `

        <div class="kpi"><div class="v">${semanais.length}</div><div class="l">Diaristas semanais (recebem toda sexta)</div></div>
        <div class="kpi"><div class="v">${ehQuinzena ? quinzenais.length : 0}</div><div class="l">Diaristas quinzenais ${ehQuinzena?'— fecha nesta sexta':'— não fecha nesta sexta'}</div></div>
        <div class="kpi"><div class="v">${fmtMoney(totalValesAbertos)}</div><div class="l">Vales a descontar no período (${valesAbertos.length})</div></div>
      </div>
      <button class="btn btn-primary" style="margin-top:6px;" onclick="goTo('fechamento')">Abrir fechamento desta sexta →</button>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h2>Estoque de EPI / uniformes</h2>
        <table>
          <tr><td>Total comprado</td><td class="num" style="font-weight:700;">${fmtMoney(custoEstoque)}</td></tr>
          <tr><td>Total entregue (saída)</td><td class="num" style="font-weight:700;">${fmtMoney(saidaEstoque)}</td></tr>
          <tr><td>Saldo em valor no almoxarifado</td><td class="num" style="font-weight:700;color:var(--azul-esc);">${fmtMoney(custoEstoque-saidaEstoque)}</td></tr>
        </table>
      </div>
      <div class="card">
        <h2>Atalhos</h2>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="btn btn-secondary" onclick="goTo('funcionarios')">+ Novo funcionário</button>
          <button class="btn btn-secondary" onclick="goTo('adiantamentos')">+ Lançar vale de diarista</button>
          <button class="btn btn-secondary" onclick="goTo('holerite')">Gerar holerite / encargos</button>
          <button class="btn btn-secondary" onclick="goTo('sync')">⟳ Sincronizar com o Drive</button>
        </div>

    <div class="card">
      <h2>Como este sistema funciona</h2>
      <p class="help" style="font-size:13px;color:var(--chumbo-claro);">
      Tudo o que você cadastra fica salvo <b>neste computador</b> e funciona sem internet.
      Para levar as alterações para outro computador, use a tela <b>Sincronizar (Drive)</b> — ela <b>junta</b> os dados
      dos dois lados em vez de substituir, então ninguém perde lançamento.

let funcFiltro = '';
let funcFiltroTipo = '';
let funcFiltroObra = '';

function renderFuncionarios(){
  const c = document.getElementById('content');

  /* A busca chama esta função a cada tecla, e o `innerHTML` abaixo destrói o
     próprio campo em que ele está digitando — o foco ia junto, e parecia que o
     campo travava depois da primeira letra. Guardamos onde o cursor estava para
     devolver no fim. (Relatado pelo Maycon em 28/08/2026.) */
  const ativo = document.activeElement;
  const eraBusca = !!(ativo && ativo.classList && ativo.classList.contains('searchbar'));
  const cursor = eraBusca ? ativo.selectionStart : null;

  const filtrados = DB.funcionarios
    .filter(f => (f.nome||'').toLowerCase().includes(funcFiltro.toLowerCase()))
    .filter(f => !funcFiltroTipo || f.tipo===funcFiltroTipo || f.tipoServico===funcFiltroTipo || f.periodicidade===funcFiltroTipo);
  const lista = ordenarFuncionarios(filtraObra(filtrados, funcFiltroObra));

  c.innerHTML = `
    <div class="card">
      <div class="section-title">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <input class="searchbar" placeholder="Buscar por nome..." value="${esc(funcFiltro)}" oninput="funcFiltro=this.value; renderFuncionarios();">
          <select style="max-width:200px;" onchange="funcFiltroTipo=this.value; renderFuncionarios();">
            <option value="">Todos</option>
            <option value="fichado"    ${funcFiltroTipo==='fichado'?'selected':''}>Só fichados</option>
            <option value="diarista"   ${funcFiltroTipo==='diarista'?'selected':''}>Só diaristas</option>
            <option value="semanal"    ${funcFiltroTipo==='semanal'?'selected':''}>Diaristas semanais</option>
            <option value="quinzenal"  ${funcFiltroTipo==='quinzenal'?'selected':''}>Diaristas quinzenais</option>
            <option value="homem_hora" ${funcFiltroTipo==='homem_hora'?'selected':''}>Homem-Hora</option>
            <option value="empreitada" ${funcFiltroTipo==='empreitada'?'selected':''}>Empreitada</option>
          </select>
          <select style="max-width:200px;" onchange="funcFiltroObra=this.value; renderFuncionarios();">
            ${opcoesObra(funcFiltroObra)}
          </select>
          <span style="font-size:12px;color:#9aa0ab;">Ordem:</span>
          ${selectOrdem('renderFuncionarios();')}
        </div>
        <button class="btn btn-primary" onclick="openFuncModal()">+ Novo funcionário</button>
      </div>
      <div class="table-wrap">
        ${lista.length ? `
        <table>
          <thead><tr>
            <th>Nome</th><th>Função</th><th>Vínculo</th><th>Tipo de serviço</th><th>Pagamento</th>
            <th>Obra</th><th class="num">Valor</th><th>Status</th><th></th>
          </tr></thead>
          <tbody>
            ${lista.map(f=>`
              <tr>
                <td><b>${esc(f.nome)}</b><br><span style="color:#9aa0ab;font-size:11px;">${esc(f.cpf||'')}</span></td>
                <td>${esc(f.funcao||'—')}</td>
                <td><span class="badge ${f.tipo==='fichado'?'badge-blue':'badge-yellow'}">${f.tipo==='fichado'?'Fichado':'Diarista'}</span></td>
                <td><span class="badge ${f.tipoServico==='empreitada'?'badge-purple':'badge-gray'}">${SERVICO_LABEL[f.tipoServico]||'—'}</span></td>
                <td>${f.tipo==='diarista'
                      ? `<span class="badge badge-gray">${PERIODICIDADE_LABEL[f.periodicidade]||'—'}</span>`
                      : '<span class="badge badge-gray">Mensal</span>'}</td>
                <td>${esc(obraNome(f.obraPadrao))}</td>
                <td class="num">${f.tipo==='fichado' ? fmtMoney(f.salario)+'/mês' : fmtMoney(f.valorDiaria)+'/dia'}</td>
                <td>${f.status==='inativo'
                      ? `<span class="badge badge-red">${f.demissao?'Demitido':'Inativo'}</span>${
                          f.demissao?`<br><span style="color:#9aa0ab;font-size:11px;">saiu em ${fmtDate(f.demissao)}</span>`:''}`
                      : '<span class="badge badge-green">Ativo</span>'}</td>
                <td style="white-space:nowrap;">
                  <button class="btn btn-secondary btn-sm" onclick="openFuncModal('${f.id}')">Editar</button>

                  ${f.demissao

    if(busca){
      busca.focus();
      try{ busca.setSelectionRange(cursor, cursor); }catch(e){ /* alguns navegadores recusam */ }

function deleteFunc(id){
  if(!confirm('Excluir este funcionário? Essa ação não pode ser desfeita.')) return;
  DB.funcionarios = DB.funcionarios.filter(f=>f.id!==id);
  saveDB(); renderFuncionarios(); toast('Funcionário excluído.');
}

/* --------- DEMISSÃO ---------
   Excluir apaga o histórico; demitir guarda a data de saída. É o que se quer
   quando alguém sai: o ponto lançado continua lá, mas ele some do apontamento. */
function demitirFunc(id){
  const f = func(id);
  if(!f) return;
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Demitir — ${esc(f.nome)}</h2>
    <div class="grid grid-2">
      <div class="field"><label>Último dia trabalhado</label>
        <input type="date" id="dm_data" value="${todayISO()}" ${f.admissao?`min="${f.admissao}"`:''}></div>
      <div class="field"><label>Motivo da saída</label>
        <input id="dm_motivo" value="${esc(f.motivoDemissao||'')}" placeholder="Ex: pedido de demissão, fim de obra, dispensa"></div>
    </div>
    <p class="help">
      Do dia seguinte em diante ele some das telas de ponto e o calendário não aceita mais lançamento —
      é o que evita apontar sem querer. O ponto já lançado fica guardado, e ele continua aparecendo no
      fechamento, no vale e no holerite do período em que saiu, para você fechar o acerto.
    </p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button type="button" class="btn btn-danger" onclick="confirmarDemissao('${id}')">Confirmar demissão</button>
    </div>
  `);
}

function confirmarDemissao(id){
  const f = func(id);
  if(!f) return;
  const data = val('dm_data');
  if(!data){ alert('Informe o último dia trabalhado.'); return; }
  if(f.admissao && data < f.admissao){
    alert(`${f.nome} foi admitido em ${fmtDate(f.admissao)}.\n\nA saída não pode ser antes disso.`); return;
  }
  f.demissao = data;
  f.motivoDemissao = val('dm_motivo').trim();
  f.status = 'inativo';
  saveDB(); closeModal(); renderFuncionarios();
  toast(`${f.nome} demitido em ${fmtDate(data)}.`);
}

function readmitirFunc(id){
  const f = func(id);
  if(!f) return;
  if(!confirm(`Readmitir ${f.nome}?\n\nA data de saída (${fmtDate(f.demissao)}) vai ser apagada e ele volta a aparecer no ponto.`)) return;
  f.demissao = '';
  f.motivoDemissao = '';
  f.status = 'ativo';
  saveDB(); renderFuncionarios(); toast(`${f.nome} voltou para a lista de ativos.`);
}

function renderDependentes(){
  const el = document.getElementById('depList');
  if(!el) return;
  el.innerHTML = modalDependentes.length ? modalDependentes.map((d,i)=>`
    <div class="grid grid-3" style="align-items:end;">
      <div class="field" style="grid-column:span 2;"><input placeholder="Nome do dependente" value="${esc(d.nome||'')}" oninput="modalDependentes[${i}].nome=this.value"></div>
      <div class="field" style="display:flex;gap:6px;align-items:center;">
        <input type="date" value="${d.nascimento||''}" onchange="modalDependentes[${i}].nascimento=this.value">
        <button type="button" class="btn btn-danger btn-sm" onclick="modalDependentes.splice(${i},1); renderDependentes();">×</button>
      </div>
    </div>`).join('') : '<p class="help">Nenhum dependente cadastrado.</p>';
}
function addDependente(){ modalDependentes.push({nome:'', nascimento:''}); renderDependentes(); }

function toggleFuncTipo(){
  const tipo = val('f_tipo');
  const diarista = tipo==='diarista';
  document.getElementById('wrap_diaria').style.display = diarista ? '' : 'none';
  document.getElementById('wrap_periodicidade').style.display = diarista ? '' : 'none';
  document.getElementById('wrap_salario').style.display = diarista ? 'none' : '';
  const reg = document.getElementById('f_regimePagamento');
  if(reg && !reg.dataset.touched) reg.value = diarista ? 'dia' : 'mes';
  const help = document.getElementById('vtHelp');
  if(help) help.textContent = diarista
    ? 'Diarista NÃO recebe vale-transporte nem vale-refeição por fora — recebe a diária e pronto. Estes campos ficam só para registro na ficha.'
    : 'Usado para calcular o adiantamento de VT/VR do mês na tela "Vales VT / VR".';
  atualizaResumoVale();
}

/* prévia do vale enquanto preenche a ficha */
function atualizaResumoVale(){
  const box = document.getElementById('valeResumo');
  if(!box) return;
  if(val('f_tipo')==='diarista' || (val('f_recebeVT')!=='sim' && val('f_recebeVR')!=='sim')){ box.style.display='none'; return; }
  box.style.display='';
  const vtDia = numVal('f_valorVT1') + numVal('f_valorVT2');
  const vrDia = numVal('f_valorVR');
  const ym = currentYM();
  const dias = diasVale(ym);
  box.innerHTML = `
    <div style="font-size:11.5px;font-weight:700;color:var(--chumbo-claro);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;">
      Prévia do vale em ${monthLabel(ym)} — ${dias} dias
    </div>
    <div class="grid grid-3" style="gap:10px;">
      <div><b>${fmtMoney(vtDia)}</b>/dia de transporte <span style="color:#7a808c;">→ ${fmtMoney(vtDia*dias)} no mês</span></div>
      <div><b>${fmtMoney(vrDia)}</b>/dia de refeição <span style="color:#7a808c;">→ ${fmtMoney(vrDia*dias)} no mês</span></div>
      <div style="font-weight:800;color:var(--azul-esc);">Total: ${fmtMoney((vtDia+vrDia)*dias)}</div>
    </div>`;
}

function saveFunc(id){
  const nome = val('f_nome').trim();
  if(!nome){ alert('Informe o nome do funcionário.'); return; }
  const dAdm = val('f_admissao'), dDem = val('f_demissao');
  if(dDem && dAdm && dDem < dAdm){
    alert('A data de demissão não pode ser anterior à data de admissão.'); return;
  }
  const existing = DB.funcionarios.find(x=>x.id===id) || {};
  const data = Object.assign({}, existing, {
    id, nome,
    tipo: val('f_tipo'),
    tipoServico: val('f_tipoServico'),
    periodicidade: val('f_periodicidade') || 'semanal',
    regimePagamento: val('f_regimePagamento'),
    /* quem tem data de saída fica inativo por definição — é o que tira ele do ponto */
    status: dDem ? 'inativo' : val('f_status'),
    obraPadrao: val('f_obraPadrao'),
    admissao: val('f_admissao'),
    demissao: val('f_demissao'),
    motivoDemissao: val('f_motivoDemissao'),
    funcao: val('f_funcao'),
    matricula: val('f_matricula'),
    cbo: val('f_cbo'),
    salario: numVal('f_salario'),
    valorDiaria: numVal('f_valorDiaria'),
    cpf: val('f_cpf'), nascimento: val('f_nascimento'), localNascimento: val('f_localNascimento'),
    uf: val('f_uf'), pis: val('f_pis'), fone: val('f_fone'), cel: val('f_cel'),
    tituloEleitor: val('f_tituloEleitor'), zona: val('f_zona'), secao: val('f_secao'),
    endereco: val('f_endereco'), numero: val('f_numero'), complemento: val('f_complemento'),
    bairro: val('f_bairro'), cidade: val('f_cidade'), cep: val('f_cep'), estado: val('f_estado'),
    pai: val('f_pai'), mae: val('f_mae'), conjuge: val('f_conjuge'),
    recebeVT: val('f_recebeVT')==='sim', recebeVR: val('f_recebeVR')==='sim',
    vt: (val('f_recebeVT')==='sim'||val('f_recebeVR')==='sim') ? 'sim' : 'nao',
    cidadeVT1: val('f_cidadeVT1'), valorVT1: numVal('f_valorVT1'),
    cidadeVT2: val('f_cidadeVT2'), valorVT2: numVal('f_valorVT2'), valorVR: numVal('f_valorVR'),
    dependentes: modalDependentes.filter(d=>d.nome && d.nome.trim())
  });
  const idx = DB.funcionarios.findIndex(x=>x.id===id);
  if(idx>=0) DB.funcionarios[idx] = data; else DB.funcionarios.push(data);
  saveDB(); closeModal(); renderFuncionarios(); toast('Funcionário salvo.');
}

/* =========================================================
   PERÍODOS DE PAGAMENTO — sempre terminam numa sexta-feira
   Semanal   : sábado anterior .. sexta do pagamento  (7 dias)
   Quinzenal : sábado de 2 semanas antes .. sexta      (14 dias)
   ========================================================= */
function sextaDaSemana(iso){
  // devolve a sexta-feira da semana em que a data cai (sábado já pertence à próxima)
  const d = parseISO(iso);
  const dow = d.getDay();               // 0=dom ... 6=sáb
  const diff = dow === 6 ? 6 : (5 - dow);
  return addDays(iso, diff);
}
function proximaSextaISO(){ return sextaDaSemana(todayISO()); }

function periodoDaSexta(sextaISO, periodicidade){
  const dias = periodicidade==='quinzenal' ? 13 : 6;
  return {inicio: addDays(sextaISO, -dias), fim: sextaISO, sexta: sextaISO, periodicidade};
}
function periodoLabel(p){
  return `${fmtDate(p.inicio)} a ${fmtDate(p.fim)}`;
}
/* NÃO grava sozinho: só sugere a sexta de hoje enquanto ninguém configurou.
   Já gravou automaticamente uma vez (31/08/2026) e, como o carimbo é "agora",
   isso venceu a âncora certa numa sincronização e reclassificou sextas
   passadas — sumindo com quinzenais já fechados e pagos. A âncora só deve
   virar dado de verdade pela mão do usuário, em Configurações. */
function ancoraQuinzenal(){
  return DB.config.quinzenalAncora || proximaSextaISO();
}
function isSextaQuinzenal(sextaISO){
  const a = parseISO(ancoraQuinzenal());
  const d = parseISO(sextaISO);
  const semanas = Math.round((d - a) / (7*24*3600*1000));
  return Math.abs(semanas % 2) === 0;
}
/* lista de sextas: das últimas `atras` até as próximas `frente` */
function listaSextas(atras, frente){
  const base = proximaSextaISO();
  const out = [];
  for(let i=-atras; i<=frente; i++) out.push(addDays(base, i*7));
  return out;
}

   Até 28/08/2026 eram duas páginas separadas no menu; viraram uma só, porque a
   tela é a mesma coisa e o Maycon trocava de página o tempo todo. */
let pontoTipo = 'todos';

/* A tela de Ponto: escolhe a folha, e daí cai no renderizador de sempre.
   Os três renderizadores (mês fichado, mês diarista, dia) começam chamando
   abasPonto(), então o seletor aparece nos três sem precisar repetir nada. */
function renderPonto(){
  /* "Todos" só existe em "Lançar o dia": em "Ver o mês" é um funcionário por
     vez, e misturar as duas folhas ali não quer dizer nada. */
  if(pontoTipo === 'todos' && pontoAba !== 'dia') pontoTipo = 'fichado';
  pdiaTipo = pontoTipo;
  if(pontoAba === 'dia'){ renderPontoDia(); return; }
  if(pontoTipo === 'diarista') renderPontoDiarista();
  else renderPontoMensal();
}

/* O seletor de folha. Mostra o número de dias a confirmar de CADA folha —
   inclusive a que não está aberta. Sem isso, unir as telas esconderia a
   pendência do outro tipo, que é justamente dinheiro esperando conferência.

   "Todos" aparece só na tela do dia: é como o Maycon aponta — chega na obra,
   filtra a obra e marca a equipe inteira, fichado e diarista misturados. */
function segmentoPonto(tipo){
  const opcao = (valor, rotulo, dica) => {
    const p = totalPresumidosAteHoje(valor);
    const quantos = DB.funcionarios.filter(f=>
      (valor==='todos' || f.tipo===valor) && f.status!=='inativo').length;
    return `<button class="seg ${tipo===valor?'active':''}" onclick="pontoTipo='${valor}'; renderPonto();"
        title="${quantos} ${dica}${p.n?` · ${p.n} dia(s) a confirmar`:''}">
      ${rotulo}
      ${p.n?`<span class="seg-pend">${p.n}</span>`:''}
    </button>`;
  };
  /* "Todos" vem PRIMEIRO porque é o padrão de trabalho: chega na obra, filtra a
     obra e aponta a equipe inteira. Fichados e Diaristas são os desvios, para
     quando ele precisa olhar uma folha só. */
  return `<div class="segmento">
    ${pontoAba==='dia' ? opcao('todos','Todos','pessoa(s) no cadastro — as duas folhas juntas') : ''}
    ${opcao('fichado','Fichados','fichado(s) no cadastro')}
    ${opcao('diarista','Diaristas','diarista(s) no cadastro')}
  </div>`;
}

function pmKey(){ return `${pmFuncId}_${pmAno}-${String(pmMes).padStart(2,'0')}`; }

  const reg = DB.pontoMensal[pmKey()] || {dias:{}, auto:{}};
  const auto = reg.auto || {};
  const nd = daysInMonth(pmAno, pmMes);
  const firstDow = new Date(pmAno, pmMes-1, 1).getDay();

function cycleDia(iso){
  const f = func(pmFuncId);
  if(antesDaAdmissao(f, iso)){ avisaAdmissao(f, iso); return; }
  const key = pmKey();
  const reg = DB.pontoMensal[key] = DB.pontoMensal[key] || {dias:{}, ts:{}, auto:{}};
  reg.dias = reg.dias||{}; reg.auto = reg.auto||{};
  const cur = reg.dias[iso] || '';
  const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur)+1) % STATUS_CYCLE.length];
  reg.dias[iso] = next;              // vazio em vez de apagar, para a sincronização enxergar a mudança
  delete reg.auto[iso];              // tocar no dia confirma: deixa de ser presunção
  saveDB(); renderPontoMensal();
}

function preencherMesUtil(){
  const f = func(pmFuncId);
  if(!confirm('Marcar todos os dias de segunda a sexta como "trabalhado"? Os dias que você já lançou serão mantidos, e dias anteriores à admissão são ignorados.')) return;
  const key = pmKey();
  if(!DB.pontoMensal[key]) DB.pontoMensal[key] = {dias:{}};
  const nd = daysInMonth(pmAno, pmMes);
  let n = 0;
  for(let d=1; d<=nd; d++){
    const iso = `${pmAno}-${String(pmMes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = dowOf(iso);
    if(antesDaAdmissao(f, iso)) continue;
    if(dow>=1 && dow<=5 && !DB.pontoMensal[key].dias[iso]){ DB.pontoMensal[key].dias[iso] = 'trabalhado'; n++; }
  }
  saveDB(); renderPontoMensal(); toast(`${n} dia(s) preenchido(s).`);
}

function getFaltasMes(funcId, ym){
  const reg = DB.pontoMensal[`${funcId}_${ym}`];
  const r = {justificada:0, injustificada:0, atestado:0, trabalhado:0, folga:0};
  if(!reg) return r;
  Object.values(reg.dias||{}).forEach(s=>{
    if(s==='falta_justificada') r.justificada++;
    else if(s==='falta_injustificada') r.injustificada++;
    else if(s==='atestado') r.atestado++;
    else if(s==='trabalhado') r.trabalhado++;
    else if(s==='folga') r.folga++;
  });
  return r;
}
