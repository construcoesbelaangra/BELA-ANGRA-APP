/* =========================================================
   SINCRONIZAÇÃO ENTRE COMPUTADORES
   Cada registro carrega a hora da última alteração. Ao sincronizar,
   a mesclagem é feita registro a registro — não arquivo contra arquivo.
   Assim, duas pessoas mexendo em coisas diferentes nunca perdem trabalho.
   ========================================================= */

const DEV_KEY = 'belaAngraRH_dispositivo';

/* coleções em lista, identificadas por id */
const SYNC_COLECOES = ['funcionarios','obras','pontoDiarista','adiantamentos','pagamentos','vales','holerites','epiEntradas','epiSaidas',
  /* financeiro (30/08/2026). Sem entrar nesta lista o módulo funciona num PC só
     e o outro nunca fica sabendo — é o erro mais fácil de cometer aqui.
     As BAIXAS viajam dentro do próprio lançamento: são um campo dele, não uma
     coleção. Dar baixa num PC carimba o lançamento inteiro, e a mesclagem leva
     a versão mais recente. Se os dois derem baixa no mesmo lançamento antes de
     sincronizar, vale a última — a mesma limitação já avisada na tela. */
  'empresas','contas','categorias','lancamentos','recorrentes'];
/* mapas de dia: {chave: {dias:{iso:status}, ts:{iso:hora}}} */
const SYNC_MAPAS_DIA = ['pontoMensal'];
/* mapas simples: {chave: valor} com hora paralela em _meta */
const SYNC_MAPAS = ['diasUteisMes'];
/* objetos únicos, com hora própria */
const SYNC_OBJETOS = ['empresa','config'];

function dispositivo(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(DEV_KEY)||'null'); }catch(e){}
  if(!d || !d.id){
    d = {id: uid(), nome: ''};
    try{ localStorage.setItem(DEV_KEY, JSON.stringify(d)); }catch(e){}
  }
  return d;
}
function nomeDispositivo(){
  const d = dispositivo();
  return d.nome || 'Computador sem nome';
}
function setNomeDispositivo(nome){
  const d = dispositivo();
  d.nome = (nome||'').trim();
  try{ localStorage.setItem(DEV_KEY, JSON.stringify(d)); }catch(e){}
}

function metaVazia(){
  return {tombstones:{}, mapaTs:{}, objetoTs:{}, ultimaSync:null, ultimaEdicao:null, arquivoNome:''};
}
function meta(){
  if(!DB._meta) DB._meta = metaVazia();
  DB._meta.tombstones = DB._meta.tombstones || {};
  DB._meta.mapaTs     = DB._meta.mapaTs     || {};
  DB._meta.objetoTs   = DB._meta.objetoTs   || {};
  return DB._meta;
}

/* ---------- carimbo automático das alterações ----------
   Comparamos o estado atual com uma fotografia do último save.
   O que mudou ganha a hora atual; o que sumiu vira "lápide" (tombstone). */
let _foto = null;

function semCarimbo(o){
  const c = {};
  Object.keys(o||{}).forEach(k=>{ if(k!=='_ts' && k!=='_dev') c[k]=o[k]; });
  return JSON.stringify(c);
}
function tirarFoto(db){
  const f = {colecoes:{}, mapasDia:{}, mapas:{}, objetos:{}};
  SYNC_COLECOES.forEach(nome=>{
    f.colecoes[nome] = {};
    (db[nome]||[]).forEach(r=>{ f.colecoes[nome][r.id] = semCarimbo(r); });
  });
  SYNC_MAPAS_DIA.forEach(nome=>{
    f.mapasDia[nome] = {};
    Object.keys(db[nome]||{}).forEach(k=>{
      const reg = db[nome][k] || {};
      const snap = {};
      /* status + marcador "a confirmar" juntos: confirmar um dia também é uma
         alteração que precisa viajar para o outro computador */
      Object.keys(reg.dias||{}).forEach(iso=>{
        snap[iso] = (reg.dias[iso]||'') + ((reg.auto||{})[iso] ? '~auto' : '');
      });
      f.mapasDia[nome][k] = snap;
    });
  });
  SYNC_MAPAS.forEach(nome=>{ f.mapas[nome] = Object.assign({}, db[nome]||{}); });
  SYNC_OBJETOS.forEach(nome=>{ f.objetos[nome] = semCarimbo(db[nome]); });
  return f;
}

function carimbarAlteracoes(){
  const agora = Date.now();
  const dev = dispositivo().id;
  const m = meta();
  let mudou = false;

  if(!_foto){ _foto = tirarFoto(DB); return false; }

  SYNC_COLECOES.forEach(nome=>{
    const antes = _foto.colecoes[nome] || {};
    const vistos = {};
    (DB[nome]||[]).forEach(r=>{
      if(!r.id) r.id = uid();
      vistos[r.id] = true;
      const atual = semCarimbo(r);
      if(antes[r.id] === undefined || antes[r.id] !== atual){
        r._ts = agora; r._dev = dev; mudou = true;
      }
    });
    Object.keys(antes).forEach(id=>{
      if(!vistos[id]){
        m.tombstones[nome] = m.tombstones[nome] || {};
        m.tombstones[nome][id] = agora;
        mudou = true;
      }
    });
    // registro que voltou a existir cancela a lápide
    if(m.tombstones[nome]) Object.keys(vistos).forEach(id=>{
      if(m.tombstones[nome][id]) delete m.tombstones[nome][id];
    });
  });

  SYNC_MAPAS_DIA.forEach(nome=>{
    const antes = _foto.mapasDia[nome] || {};
    Object.keys(DB[nome]||{}).forEach(chave=>{
      const reg = DB[nome][chave];
      reg.dias = reg.dias || {}; reg.ts = reg.ts || {}; reg.auto = reg.auto || {};
      const antesDias = antes[chave] || {};
      Object.keys(reg.dias).forEach(iso=>{
        const atual = (reg.dias[iso]||'') + (reg.auto[iso] ? '~auto' : '');
        if(antesDias[iso] !== atual){ reg.ts[iso] = agora; mudou = true; }
      });
    });
  });

  SYNC_MAPAS.forEach(nome=>{
    const antes = _foto.mapas[nome] || {};
    m.mapaTs[nome] = m.mapaTs[nome] || {};
    Object.keys(DB[nome]||{}).forEach(chave=>{
      if(antes[chave] !== DB[nome][chave]){
        m.mapaTs[nome][chave] = agora; mudou = true;
      }
    });
  });

  SYNC_OBJETOS.forEach(nome=>{
    if(_foto.objetos[nome] !== semCarimbo(DB[nome])){
      m.objetoTs[nome] = agora; mudou = true;
    }
  });

  if(mudou) m.ultimaEdicao = {dev, nome: nomeDispositivo(), quando: agora};
  return mudou;
}

/* ---------- mesclagem ---------- */
function mesclar(local, remoto){
  const res = {novos:0, atualizados:0, removidos:0, enviados:0};
  const mLocal  = local._meta  || metaVazia();
  const mRemoto = remoto._meta || metaVazia();
  const ts = r => Number(r && r._ts) || 0;

  SYNC_COLECOES.forEach(nome=>{
    const porId = {};
    (local[nome]||[]).forEach(r=> porId[r.id] = {r, origem:'local'});
    (remoto[nome]||[]).forEach(r=>{
      const atual = porId[r.id];
      if(!atual){ porId[r.id] = {r, origem:'remoto'}; res.novos++; }
      else if(ts(r) > ts(atual.r)){ porId[r.id] = {r, origem:'remoto'}; res.atualizados++; }
      else if(ts(atual.r) > ts(r)) res.enviados++;
    });
    // lápides: apaga se a remoção for mais nova que o registro
    const tomb = Object.assign({}, mLocal.tombstones[nome]||{}, {});
    Object.keys(mRemoto.tombstones[nome]||{}).forEach(id=>{
      const t = mRemoto.tombstones[nome][id];
      if(!tomb[id] || t > tomb[id]) tomb[id] = t;
    });
    Object.keys(tomb).forEach(id=>{
      if(porId[id] && tomb[id] > ts(porId[id].r)){ delete porId[id]; res.removidos++; }
    });
    local[nome] = Object.keys(porId).map(id=>porId[id].r);
    mLocal.tombstones[nome] = tomb;
  });

  SYNC_MAPAS_DIA.forEach(nome=>{
    local[nome] = local[nome] || {};
    Object.keys(remoto[nome]||{}).forEach(chave=>{
      const rr = remoto[nome][chave] || {dias:{}, ts:{}};
      const rl = local[nome][chave] = local[nome][chave] || {dias:{}, ts:{}};
      rl.dias = rl.dias||{}; rl.ts = rl.ts||{}; rl.auto = rl.auto||{};
      Object.keys(rr.dias||{}).forEach(iso=>{
        const tr = Number((rr.ts||{})[iso])||0, tl = Number(rl.ts[iso])||0;
        if(tr > tl){
          rl.dias[iso] = rr.dias[iso]; rl.ts[iso] = tr;
          /* o marcador "a confirmar" viaja junto com o status */
          if((rr.auto||{})[iso]) rl.auto[iso] = true; else delete rl.auto[iso];
          res.atualizados++;
        }
      });
    });
  });

  SYNC_MAPAS.forEach(nome=>{
    local[nome] = local[nome] || {};
    mLocal.mapaTs[nome] = mLocal.mapaTs[nome] || {};
    const tsR = (mRemoto.mapaTs||{})[nome] || {};
    Object.keys(remoto[nome]||{}).forEach(chave=>{
      const tr = Number(tsR[chave])||0, tl = Number(mLocal.mapaTs[nome][chave])||0;
      if(tr > tl){ local[nome][chave] = remoto[nome][chave]; mLocal.mapaTs[nome][chave] = tr; res.atualizados++; }
    });
  });

  SYNC_OBJETOS.forEach(nome=>{
    const tr = Number((mRemoto.objetoTs||{})[nome])||0;
    const tl = Number((mLocal.objetoTs||{})[nome])||0;
    if(tr > tl && remoto[nome]){
      local[nome] = Object.assign({}, defaultDB()[nome], remoto[nome]);
      if(nome==='config'){
        local.config.encargosAtivos = Object.assign({}, defaultDB().config.encargosAtivos, remoto.config.encargosAtivos||{});
        local.config.codigos        = Object.assign({}, defaultDB().config.codigos,        remoto.config.codigos||{});
      }
      mLocal.objetoTs[nome] = tr;
      res.atualizados++;
    }
  });

  // quem editou por último, entre os dois lados
  const eL = mLocal.ultimaEdicao, eR = mRemoto.ultimaEdicao;
  mLocal.ultimaEdicao = (!eL || (eR && eR.quando > eL.quando)) ? eR : eL;
  local._meta = mLocal;
  return res;
}

/* ---------- pacote de sincronização ---------- */
function pacoteSync(){
  carimbarAlteracoes();
  const p = JSON.parse(JSON.stringify(DB));
  p._formato = 'bela-angra-sync-1';
  p._gravadoPor = {dev: dispositivo().id, nome: nomeDispositivo(), quando: Date.now()};
  return p;
}
function aplicarPacote(texto){
  const remoto = JSON.parse(texto);
  if(!remoto || typeof remoto !== 'object') throw new Error('Arquivo inválido.');
  if(!remoto.funcionarios && !remoto.obras) throw new Error('Este arquivo não parece ser do sistema Bela Angra.');
  carimbarAlteracoes();
  const res = mesclar(DB, migrate(Object.assign(defaultDB(), remoto)));
  meta().ultimaSync = Date.now();
  _foto = null;              // força novo carimbo coerente no próximo save
  saveDB();
  _foto = tirarFoto(DB);
  return res;
}
function resumoMesclagem(res){
  const p = [];
  if(res.novos)       p.push(`${res.novos} registro(s) novo(s) recebido(s)`);
  if(res.atualizados) p.push(`${res.atualizados} atualização(ões) trazida(s)`);
  if(res.removidos)   p.push(`${res.removidos} exclusão(ões) aplicada(s)`);
  if(res.enviados)    p.push(`${res.enviados} registro(s) seu(s) mais recente(s) mantido(s)`);
  return p.length ? p.join(' · ') : 'Nada novo — os dois lados já estavam iguais.';
}

/* ---------- transporte A: arquivo direto na pasta do Drive ---------- */
let arquivoSync = null;           // FileSystemFileHandle
function suportaArquivoDireto(){ return typeof window.showSaveFilePicker === 'function'; }

/* O navegador esquece o arquivo escolhido ao recarregar a página. Guardamos o
   "handle" no IndexedDB para reencontrá-lo sozinho. Se o navegador não deixar
   (acontece em algumas configurações de arquivo local), o app só volta a pedir
   o arquivo no primeiro clique — nunca fica travado. */
const IDB_NOME = 'belaAngraRH', IDB_STORE = 'handles';

function idbAbrir(){
  return new Promise((ok, falha)=>{
    try{
      const req = indexedDB.open(IDB_NOME, 1);
      req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
      req.onsuccess = ()=> ok(req.result);
      req.onerror   = ()=> falha(req.error);
    }catch(e){ falha(e); }
  });
}
async function idbGuardarHandle(h){
  try{
    const db = await idbAbrir();
    await new Promise((ok, falha)=>{
      const t = db.transaction(IDB_STORE, 'readwrite');
      t.objectStore(IDB_STORE).put(h, 'arquivoSync');
      t.oncomplete = ok; t.onerror = ()=> falha(t.error);
    });
    db.close();
    return true;
  }catch(e){ return false; }
}
async function idbLerHandle(){
  try{
    const db = await idbAbrir();
    const h = await new Promise((ok, falha)=>{
      const t = db.transaction(IDB_STORE, 'readonly');
      const r = t.objectStore(IDB_STORE).get('arquivoSync');
      r.onsuccess = ()=> ok(r.result || null);
      r.onerror   = ()=> falha(r.error);
    });
    db.close();
    return h;
  }catch(e){ return null; }
}

/* tenta reconectar sozinho ao abrir o app (sem pedir nada ao usuário) */
async function reconectarArquivoSync(){
  if(!suportaArquivoDireto()) return;
  const h = await idbLerHandle();
  if(!h) return;
  arquivoSync = h;
  try{
    const p = await h.queryPermission({mode:'readwrite'});
    arquivoSyncLiberado = (p === 'granted');
  }catch(e){ arquivoSyncLiberado = false; }
  atualizarIndicadorSync();
  if(currentPage === 'sync') renderSync();
}
let arquivoSyncLiberado = false;

/* garante permissão de escrita; precisa ser chamada a partir de um clique */
async function garantirPermissao(){
  if(!arquivoSync) return false;
  try{
    let p = await arquivoSync.queryPermission({mode:'readwrite'});
    if(p !== 'granted') p = await arquivoSync.requestPermission({mode:'readwrite'});
    arquivoSyncLiberado = (p === 'granted');
    return arquivoSyncLiberado;
  }catch(e){ return false; }
}

async function escolherArquivoSync(criar){
  try{
    if(criar){
      arquivoSync = await window.showSaveFilePicker({
        suggestedName: 'bela-angra-dados.json',
        types: [{description:'Dados do sistema Bela Angra', accept:{'application/json':['.json']}}]
      });
    } else {
      const [h] = await window.showOpenFilePicker({
        types: [{description:'Dados do sistema Bela Angra', accept:{'application/json':['.json']}}]
      });
      arquivoSync = h;
    }
    arquivoSyncLiberado = true;
    meta().arquivoNome = arquivoSync.name;
    const guardou = await idbGuardarHandle(arquivoSync);
    meta().lembraArquivo = guardou;
    saveDB();
    await sincronizarArquivo();
  }catch(e){
    if(e && e.name === 'AbortError') return;         // usuário cancelou
    alert('Não foi possível usar o arquivo diretamente neste navegador.\n\n'
        + 'Motivo: ' + (e && e.message ? e.message : e) + '\n\n'
        + 'Use o modo manual (botões "Baixar" e "Carregar"), que funciona em qualquer navegador e celular.');
    arquivoSync = null; arquivoSyncLiberado = false;
    renderSync();
  }
}

/* Botão único: conecta se precisar e sincroniza. Nunca fica desabilitado. */
async function sincronizarAgora(){
  if(!suportaArquivoDireto()){
    alert('Este navegador não permite gravar direto no arquivo. Use os botões "Carregar do Drive" e "Baixar para o Drive".');
    return;
  }
  if(!arquivoSync || !(await garantirPermissao())){
    // ainda não conectado nesta sessão — pede o arquivo e já sincroniza
    await escolherArquivoSync(false);
    return;
  }
  await sincronizarArquivo();
}

async function sincronizarArquivo(){
  if(!arquivoSync){ await escolherArquivoSync(false); return; }
  try{
    // 1) lê o que está no Drive e mescla
    let res = {novos:0, atualizados:0, removidos:0, enviados:0};
    try{
      const arq = await arquivoSync.getFile();
      const texto = await arq.text();
      if(texto && texto.trim()) res = aplicarPacote(texto);
    }catch(e){ /* arquivo novo/vazio — segue e grava */ }
    // 2) grava o resultado de volta
    const w = await arquivoSync.createWritable();
    await w.write(JSON.stringify(pacoteSync(), null, 2));
    await w.close();
    meta().ultimaSync = Date.now();
    saveDB();
    atualizarIndicadorSync();
    if(currentPage === 'sync') renderSync();
    toast('Sincronizado com o Drive. ' + resumoMesclagem(res));
  }catch(e){
    alert('Falha ao sincronizar: ' + (e && e.message ? e.message : e)
        + '\n\nSe o arquivo mudou de lugar, clique em "Escolher o arquivo no Drive" para apontar de novo.');
  }
}

/* ---------- transporte B: baixar / carregar (funciona em qualquer aparelho) ---------- */
function baixarSync(){
  const blob = new Blob([JSON.stringify(pacoteSync(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'bela-angra-dados.json'; a.click();
  URL.revokeObjectURL(url);
  meta().ultimaSync = Date.now();
  saveDB(); renderSync();
  toast('Arquivo gerado — salve-o na pasta do Google Drive, por cima do que já estava lá.');
}
function carregarSync(evt){
  const file = evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const res = aplicarPacote(e.target.result);
      renderSync();
      alert('Sincronizado com sucesso.\n\n' + resumoMesclagem(res)
        + '\n\nNada foi apagado: os dois lados foram juntados registro a registro.');
    }catch(err){ alert('Não deu para ler o arquivo: ' + err.message); }
  };
  reader.readAsText(file);
}

/* ---------- transporte C: área de transferência ----------
   Para celular e tablet, onde mexer com arquivo é trabalhoso. Entre aparelhos
   Apple da mesma conta a área de transferência é compartilhada, então copiar
   num e colar no outro funciona sem passar por lugar nenhum. */
async function copiarDados(){
  const texto = JSON.stringify(pacoteSync());
  try{
    await navigator.clipboard.writeText(texto);
    meta().ultimaSync = Date.now();
    saveDB(); atualizarIndicadorSync();
    if(currentPage === 'sync') renderSync();
    toast(`Copiado (${Math.round(texto.length/1024)} KB). Cole no outro aparelho.`);
  }catch(e){
    /* navegador recusou copiar sozinho: mostra o texto para copiar à mão */
    const box = document.getElementById('colarBox');
    const area = document.getElementById('colarTexto');
    if(box && area){
      box.style.display = '';
      area.value = texto;
      area.select();
      alert('Seu navegador não deixou copiar sozinho.\n\n'
          + 'O texto já está selecionado na caixa abaixo — copie com Ctrl+C '
          + '(ou toque e segure → Copiar).');
    } else {
      alert('Não foi possível copiar: ' + (e && e.message ? e.message : e));
    }
  }
}

function abrirColar(){
  const box = document.getElementById('colarBox');
  if(!box) return;
  box.style.display = '';
  const area = document.getElementById('colarTexto');
  if(area){ area.value = ''; area.focus(); }
}

function aplicarColado(){
  const area = document.getElementById('colarTexto');
  const texto = (area && area.value || '').trim();
  if(!texto){ alert('Cole o texto antes.'); return; }
  try{
    const res = aplicarPacote(texto);
    document.getElementById('colarBox').style.display = 'none';
    renderSync();
    alert('Juntado com sucesso.\n\n' + resumoMesclagem(res)
        + '\n\nNada foi apagado: os dois lados foram unidos registro a registro.');
  }catch(err){
    alert('Não deu para ler o que você colou: ' + err.message
        + '\n\nConfira se copiou o texto inteiro.');
  }
}

/* Registros que já existiam antes da sincronização ganham hora ZERO — nunca hora atual.
   Se recebessem a hora de agora, um computador que só ABRIU o sistema poderia sobrescrever
   a edição de verdade feita no outro. */
function backfillCarimbos(){
  const m = meta();
  SYNC_COLECOES.forEach(nome=>{
    (DB[nome]||[]).forEach(r=>{ if(!r._ts) r._ts = 0; });
  });
  SYNC_MAPAS_DIA.forEach(nome=>{
    Object.keys(DB[nome]||{}).forEach(k=>{
      const r = DB[nome][k]; r.dias = r.dias||{}; r.ts = r.ts||{}; r.auto = r.auto||{};
      Object.keys(r.dias).forEach(iso=>{ if(!r.ts[iso]) r.ts[iso] = 0; });
    });
  });
  SYNC_MAPAS.forEach(nome=>{
    m.mapaTs[nome] = m.mapaTs[nome] || {};
    Object.keys(DB[nome]||{}).forEach(k=>{ if(!m.mapaTs[nome][k]) m.mapaTs[nome][k] = 0; });
  });
  SYNC_OBJETOS.forEach(nome=>{ if(!m.objetoTs[nome]) m.objetoTs[nome] = 0; });
}

/* =========================================================
   INDICADOR DE PENDÊNCIA — visível em todas as telas
   É o que impede o usuário de fechar o expediente sem mandar
   o trabalho para o outro computador.
   ========================================================= */
/* Ainda não configurou a sincronização? Então não é "pendência" — é só
   não estar configurado. Sem isso, uma instalação nova já abriria alarmando. */
function syncConfigurada(){
  const m = meta();
  return !!(m.ultimaSync || m.arquivoNome);
}
function pendenteSync(){
  const m = meta();
  if(!syncConfigurada()) return false;
  if(!m.ultimaEdicao) return false;
  return !m.ultimaSync || m.ultimaEdicao.quando > m.ultimaSync;
}
function desdeQuando(ts){
  const min = Math.floor((Date.now() - ts) / 60000);
  if(min < 1)  return 'agora há pouco';
  if(min < 60) return `há ${min} min`;
  const h = Math.floor(min/60);
  if(h < 24)   return `há ${h}h`;
  const d = Math.floor(h/24);
  return d === 1 ? 'ontem' : `há ${d} dias`;
}

/* O mesmo estado sai em DOIS lugares, e o CSS escolhe qual aparece:
   - `#syncIndicador`, a faixa no topo do conteúdo — é o que se vê no celular;
   - `#syncLateral`, no pé da barra lateral — é o que se vê no computador.
   Os textos são diferentes de propósito: a lateral tem 230px de largura, então
   ali a frase é curta e o botão ocupa a linha inteira. */
function atualizarIndicadorSync(){
  const faixa = document.getElementById('syncIndicador');
  const lado  = document.getElementById('syncLateral');
  if(!faixa && !lado) return;
  const m = meta();

  let estado, faixaHTML, ladoHTML;

  if(pendenteSync()){
    estado = 'pendente';
    faixaHTML = `<span class="pt"></span>
      <span>Alterações não enviadas ao Drive${m.ultimaEdicao?' · última edição '+desdeQuando(m.ultimaEdicao.quando):''}</span>
      <button class="btn btn-primary btn-sm" onclick="sincronizarAgora()">⟳ Sincronizar agora</button>`;
    ladoHTML = `<span class="pt"></span>Não enviado ao Drive${
      m.ultimaEdicao?'<br>última edição '+desdeQuando(m.ultimaEdicao.quando):''}
      <button class="btn btn-primary btn-sm" onclick="sincronizarAgora()">⟳ Sincronizar</button>`;
  } else if(syncConfigurada() && m.ultimaSync){
    estado = 'ok';
    faixaHTML = `<span class="pt"></span><span>Tudo sincronizado com o Drive · ${desdeQuando(m.ultimaSync)}</span>`;
    ladoHTML  = `<span class="pt"></span>Sincronizado · ${desdeQuando(m.ultimaSync)}`;
  } else {
    estado = 'neutro';
    faixaHTML = `<span class="pt"></span>
      <span>Sincronização com o Drive ainda não configurada</span>
      <button class="btn btn-secondary btn-sm" onclick="goTo('sync')">Configurar</button>`;
    ladoHTML = `<span class="pt"></span>Drive não configurado
      <button class="btn btn-secondary btn-sm" onclick="goTo('sync')">Configurar</button>`;
  }

  if(faixa){ faixa.className = 'sync-ind ' + estado; faixa.innerHTML = faixaHTML; }
  if(lado){  lado.className  = 'sync-lat ' + estado; lado.innerHTML  = ladoHTML;  }
}

/* =========================================================
   FINANCEIRO — núcleo, cadastros e a tela de Caixa e Contas

   Leia antes de mexer: "SINCRONIA CLAUDE/ESTRUTURA - CBA e CEBA.md".
   Três coisas que o desenho inteiro depende:

   1. SÃO DUAS EMPRESAS. Uma assina os contratos e recebe do cliente; a outra
      tem os funcionários e as despesas. Um financeiro de uma empresa só
      mostraria resultado zero para sempre, porque a segunda é centro de custo
      por desenho. As duas precisam estar cadastradas.

   2. TRANSFERÊNCIA ENTRE EMPRESAS NÃO É RECEITA NEM DESPESA. Se a transferência
      entrar como receita de quem recebe, o faturamento consolidado conta o
      mesmo dinheiro duas vezes. Por isso `transferencia` é um TIPO próprio:
      mexe no caixa das duas contas e não entra em resultado nenhum.

   3. TEM DINHEIRO QUE SAIU DA CONTA E NÃO É DA OPERAÇÃO. Em 2026 foram
      R$ 124.098 (carro, moto, repasses). Isso precisa aparecer no CAIXA,
      porque saiu mesmo, e ficar FORA do resultado. É o campo `natureza`.

   Nada aqui pode ter nome de empresa, de conta ou de cliente escrito no
   código: o app é publicado num repositório público. Tudo é cadastro.
   ========================================================= */

/* ---------------- CONSULTAS DE APOIO ---------------- */

function empresaFin(id){ return DB.empresas.find(e=>e.id===id) || null; }
function empresaFinNome(id){ const e = empresaFin(id); return e ? (e.apelido || e.nome) : '—'; }
function empresasAtivas(){ return DB.empresas.filter(e=>e.ativo!==false); }

function conta(id){ return DB.contas.find(c=>c.id===id) || null; }
function contaNome(id){ const c = conta(id); return c ? c.nome : '—'; }
function contasAtivas(empresaId){
  return DB.contas.filter(c=>c.ativo!==false && (!empresaId || c.empresaId===empresaId));
}

function categoria(id){ return DB.categorias.find(c=>c.id===id) || null; }
function categoriaNome(id){ const c = categoria(id); return c ? c.nome : '—'; }
function categoriasDe(especie){
  return DB.categorias.filter(c=>c.ativo!==false && (!especie || c.especie===especie))
    .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}

const TIPO_LANC_LABEL   = {receita:'Receita', despesa:'Despesa', transferencia:'Transferência'};
const NATUREZA_LABEL    = {operacao:'Operação', particular:'Particular'};
const TIPO_CONTA_LABEL  = {banco:'Conta bancária', carteira:'Dinheiro em espécie', aplicacao:'Aplicação'};

/* ---------------- BAIXA E SITUAÇÃO DO LANÇAMENTO ----------------
   A baixa é uma LISTA de pagamentos parciais, não um campo "pago sim/não".
   Motivo concreto: em 2025 três medições foram pagas a menor e viraram
   R$ 117.437,69 de dívida que ninguém enxergava, porque a planilha só sabia
   dizer "pago" ou "não pago". Com baixa parcial isso vira saldo em aberto e
   aparece sozinho na lista. */

function valorBaixado(l){
  return (l.baixas||[]).reduce((s,b)=>s + (Number(b.valor)||0), 0);
}
function saldoAberto(l){
  /* arredonda na apresentação para não deixar resto de centavo em aberto */
  return Math.round(((Number(l.valor)||0) - valorBaixado(l)) * 100) / 100;
}
function statusLanc(l){
  const s = saldoAberto(l);
  if(s <= 0) return 'quitado';
  return valorBaixado(l) > 0 ? 'parcial' : 'aberto';
}
function estaVencido(l){
  return statusLanc(l) !== 'quitado' && l.vencimento && l.vencimento < todayISO();
}
function badgeStatus(l){
  const st = statusLanc(l);
  if(st === 'quitado') return '<span class="badge badge-green">Quitado</span>';
  if(st === 'parcial') return `<span class="badge badge-yellow">Parcial</span>`;
  if(estaVencido(l))   return '<span class="badge badge-red">Vencido</span>';
  return '<span class="badge badge-gray">Em aberto</span>';
}
/* a data em que o dinheiro de fato andou — a última baixa */
function dataUltimaBaixa(l){
  const bs = (l.baixas||[]).slice().sort((a,b)=>a.data.localeCompare(b.data));
  return bs.length ? bs[bs.length-1].data : '';
}

/* ---------------- SALDO ----------------
   O saldo anda pela BAIXA, não pelo vencimento: dinheiro só mexe no caixa
   quando entra ou sai de verdade. Cada baixa pode ter caído numa conta
   diferente da prevista (acontece), por isso ela carrega o próprio contaId. */

function contaDaBaixa(l, b){ return b.contaId || l.contaId; }

function saldoConta(contaId, ateISO){
  const c = conta(contaId);
  if(!c) return 0;
  const ate = ateISO || todayISO();
  let s = (!c.dataSaldoInicial || c.dataSaldoInicial <= ate) ? (Number(c.saldoInicial)||0) : 0;
  DB.lancamentos.forEach(l=>{
    (l.baixas||[]).forEach(b=>{
      if(b.data > ate) return;
      const v = Number(b.valor)||0;
      if(l.tipo === 'transferencia'){
        /* transferência mexe nas DUAS pontas; a mesma conta dos dois lados
           (o usuário errou o cadastro) se anula sozinha, que é o certo */
        if(l.contaId === contaId)        s -= v;
        if(l.contaDestinoId === contaId) s += v;
      }else if(contaDaBaixa(l, b) === contaId){
        s += (l.tipo === 'receita' ? v : -v);
      }
    });
  });
  return Math.round(s * 100) / 100;
}

function saldoEmpresa(empresaId, ateISO){
  return contasAtivas(empresaId).reduce((s,c)=>s + saldoConta(c.id, ateISO), 0);
}
function saldoGeral(ateISO){
  return contasAtivas().reduce((s,c)=>s + saldoConta(c.id, ateISO), 0);
}

/* Movimentos realizados de uma conta, do mais novo para o mais antigo.
   É o extrato: o que já aconteceu, não o que está previsto. */
function movimentosDaConta(contaId, limite){
  const movs = [];
  DB.lancamentos.forEach(l=>{
    (l.baixas||[]).forEach(b=>{
      const v = Number(b.valor)||0;
      if(l.tipo === 'transferencia'){
        if(l.contaId === contaId)        movs.push({data:b.data, valor:-v, l, rotulo:'Transferência para ' + contaNome(l.contaDestinoId)});
        if(l.contaDestinoId === contaId) movs.push({data:b.data, valor: v, l, rotulo:'Transferência de ' + contaNome(l.contaId)});
      }else if(contaDaBaixa(l, b) === contaId){
        movs.push({data:b.data, valor: l.tipo==='receita' ? v : -v, l, rotulo:l.descricao});
      }
    });
  });
  movs.sort((a,b)=> b.data.localeCompare(a.data));
  return limite ? movs.slice(0, limite) : movs;
}

function saveEmpresaFin(id){
  const nome = val('ef_nome').trim();
  if(!nome){ toast('A razão social é obrigatória.'); return; }
  const dados = {
    nome, apelido: val('ef_apelido').trim(), cnpj: val('ef_cnpj').trim(),
    papel: val('ef_papel'), ativo: checked('ef_ativo')
  };
  if(id){ Object.assign(empresaFin(id), dados); }
  else  { DB.empresas.push(Object.assign({id: uid()}, dados)); }
  saveDB(); closeModal(); render(); toast('Empresa salva.');
}

function deleteEmpresaFin(id){
  const usoContas = DB.contas.filter(c=>c.empresaId===id).length;
  const usoLanc   = DB.lancamentos.filter(l=>l.empresaId===id || l.empresaDestinoId===id).length;
  if(usoContas || usoLanc){
    alert('Não dá para excluir: esta empresa tem ' + usoContas + ' conta(s) e ' + usoLanc +
          ' lançamento(s).\n\nSe ela não é mais usada, edite e desmarque "Empresa ativa" — '
          + 'assim o histórico continua de pé.');
    return;
  }
  if(!confirm('Excluir esta empresa?')) return;
  DB.empresas = DB.empresas.filter(e=>e.id!==id);
  saveDB(); render(); toast('Empresa excluída.');
}

function saveConta(id){
  const nome = val('ct_nome').trim();
  const empresaId = val('ct_empresa');
  if(!nome){ toast('O nome da conta é obrigatório.'); return; }
  if(!empresaId){ toast('Escolha de qual empresa é a conta.'); return; }
  const dados = {
    nome, empresaId, tipo: val('ct_tipo'),
    saldoInicial: numVal('ct_saldo'), dataSaldoInicial: val('ct_data'),
    ativo: checked('ct_ativo')
  };
  if(id){ Object.assign(conta(id), dados); }
  else  { DB.contas.push(Object.assign({id: uid()}, dados)); }
  saveDB(); closeModal(); render(); toast('Conta salva.');
}

function deleteConta(id){
  const uso = DB.lancamentos.filter(l=>
    l.contaId===id || l.contaDestinoId===id || (l.baixas||[]).some(b=>b.contaId===id)).length;
  if(uso){
    alert('Não dá para excluir: esta conta tem ' + uso + ' lançamento(s) ligados a ela.\n\n'
        + 'Se ela foi encerrada, edite e desmarque "Conta ativa" — o saldo e o histórico ficam de pé.');
    return;
  }
  if(!confirm('Excluir esta conta?')) return;
  DB.contas = DB.contas.filter(c=>c.id!==id);
  saveDB(); render(); toast('Conta excluída.');
}

function openCategoriaModal(id){
  const ct = id ? categoria(id) : null;
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>${ct ? 'Editar categoria' : 'Nova categoria'}</h2>
    <div class="grid grid-2">
      <div class="field"><label>Nome *</label><input id="cg_nome" value="${ct?esc(ct.nome):''}"></div>
      <div class="field"><label>Espécie</label>
        <select id="cg_especie">
          <option value="despesa" ${!ct||ct.especie==='despesa'?'selected':''}>Despesa</option>
          <option value="receita" ${ct&&ct.especie==='receita'?'selected':''}>Receita</option>
        </select>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="cg_ativo" ${!ct||ct.ativo!==false?'checked':''}> Categoria ativa</label>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveCategoria('${id||''}')">Salvar</button>
    </div>
  `);

function saveCategoria(id){
  const nome = val('cg_nome').trim();
  if(!nome){ toast('O nome é obrigatório.'); return; }
  const dados = {nome, especie: val('cg_especie'), ativo: checked('cg_ativo')};
  if(id){ Object.assign(categoria(id), dados); }
  else  { DB.categorias.push(Object.assign({id: uid()}, dados)); }
  saveDB(); closeModal(); render(); toast('Categoria salva.');
}

function deleteCategoria(id){
  const uso = DB.lancamentos.filter(l=>l.categoriaId===id).length
            + DB.recorrentes.filter(r=>r.categoriaId===id).length;
  if(uso){
    alert('Não dá para excluir: ' + uso + ' lançamento(s) usam esta categoria.\n\n'
        + 'Edite e desmarque "Categoria ativa" — ela some das listas novas e o histórico continua certo.');
    return;
  }
  if(!confirm('Excluir esta categoria?')) return;
  DB.categorias = DB.categorias.filter(c=>c.id!==id);
  saveDB(); render(); toast('Categoria excluída.');
}

/* Atalho de primeiro uso. São nomes GENÉRICOS de construção civil — nenhum
   identifica a empresa, o cliente ou a obra, então podem morar no código.
   Não sobrescreve nada: só acrescenta o que ainda não existe pelo nome. */
const CATEGORIAS_SUGERIDAS = [
  ['Folha de pagamento',        'despesa'],
  ['Diárias',                   'despesa'],
  ['Vale transporte',           'despesa'],
  ['Vale refeição / alimentação','despesa'],
  ['Guias e impostos',          'despesa'],
  ['Pró-labore',                'despesa'],
  ['Combustível',               'despesa'],
  ['Material de construção',    'despesa'],
  ['Ferramenta e manutenção',   'despesa'],
  ['EPI e uniforme',            'despesa'],
  ['Aluguel de equipamento',    'despesa'],
  ['Contabilidade',             'despesa'],
  ['Tarifa bancária',           'despesa'],
  ['Transporte e frete',        'despesa'],
  ['Medição',                   'receita'],
  ['Serviço avulso / extra',    'receita'],
  ['Outras receitas',           'receita']
];

function sugerirCategorias(){
  const existentes = DB.categorias.map(c=>(c.nome||'').toLowerCase());
  const novas = CATEGORIAS_SUGERIDAS.filter(([n])=>existentes.indexOf(n.toLowerCase()) < 0);
  if(!novas.length){ toast('Todas as sugestões já estão cadastradas.'); return; }
  if(!confirm('Acrescentar ' + novas.length + ' categoria(s) sugerida(s)?\n\n'
    + 'Nada do que já existe é alterado. Você pode renomear ou apagar depois.')) return;
  novas.forEach(([nome, especie])=> DB.categorias.push({id: uid(), nome, especie, ativo:true}));
  saveDB(); render(); toast(novas.length + ' categorias acrescentadas.');
}
/* =========================================================
   FINANCEIRO — A Pagar / A Receber

   A tela de trabalho do dia a dia: o que está em aberto, o que venceu, e a
   baixa. Três coisas do desenho que não são óbvias:

   - A tela abre em "Em aberto", não no mês corrente. Conta vencida de mês
     passado é justamente a que não pode sumir da vista.
   - A baixa aceita valor MENOR que o previsto. Pagamento a menor é o que
     gerou R$ 117 mil de dívida invisível em 2025.
   - Transferência entre contas (e entre empresas) é um tipo próprio, que
     mexe no caixa das duas pontas e não entra em resultado nenhum.
   ========================================================= */

let lancAba      = 'pagar';     /* pagar | receber | transferencias | recorrentes */
let lancPeriodo  = 'aberto';    /* aberto | mes | todos */
let lancMes      = '';          /* 'YYYY-MM' quando lancPeriodo === 'mes' */
let lancEmpresa  = '';
let lancObra     = '';
let lancBusca    = '';

function initLanc(){
  if(!lancMes) lancMes = currentYM();
}

/* ---------------- FILTRO ---------------- */

function lancamentosFiltrados(){
  initLanc();
  const tipoDaAba = {pagar:'despesa', receber:'receita', transferencias:'transferencia'}[lancAba];
  const busca = lancBusca.trim().toLowerCase();

  return DB.lancamentos.filter(l=>{
    if(tipoDaAba && l.tipo !== tipoDaAba) return false;
    if(lancEmpresa && l.empresaId !== lancEmpresa && l.empresaDestinoId !== lancEmpresa) return false;
    if(lancObra && l.obraId !== lancObra) return false;

    if(lancPeriodo === 'aberto' && statusLanc(l) === 'quitado') return false;
    if(lancPeriodo === 'mes'){
      /* pelo vencimento; quitado no mês também aparece, senão o mês fechado
         fica com buraco e não bate com o extrato */
      const noVenc  = (l.vencimento||'').slice(0,7) === lancMes;
      const naBaixa = (l.baixas||[]).some(b=>b.data.slice(0,7) === lancMes);
      if(!noVenc && !naBaixa) return false;
    }
    if(busca){
      const alvo = [l.descricao, categoriaNome(l.categoriaId), obraNome(l.obraId),
                    l.socio, l.pagoNaContaDe, l.obs].join(' ').toLowerCase();
      if(alvo.indexOf(busca) < 0) return false;
    }
    return true;
  }).sort((a,b)=>{
    /* vencido primeiro, depois por vencimento */
    const va = a.vencimento || '9999-99-99', vb = b.vencimento || '9999-99-99';
    return va.localeCompare(vb);
  });
}

/* ---------------- A TELA ---------------- */

  const totalVencido  = vencidos.reduce((s,l)=>s+saldoAberto(l),0);

      <button class="tab ${lancAba==='receber'?'active':''}"        onclick="lancAba='receber'; render();">A Receber</button>

    ${vencidos.length ? `

      <b>${vencidos.length} ${ehTransf?'transferência(s)':'conta(s)'} vencida(s)</b> —
      ${fmtMoney(totalVencido)} em atraso. A mais antiga venceu em ${fmtDate(vencidos[0].vencimento)}.
    </div>` : ''}

    <div class="card">
      <div class="section-title">
        <h2 style="margin:0;">${ehTransf?'Transferências':(lancAba==='pagar'?'Contas a pagar':'Contas a receber')}</h2>
        <span>
          ${ehTransf
            ? `<button class="btn btn-primary" onclick="openTransferenciaModal()">↔ Nova transferência</button>`
            : `<button class="btn btn-primary" onclick="openLancModal('', '${lancAba==='pagar'?'despesa':'receita'}')">+ Novo lançamento</button>`}
        </span>
      </div>

      <div class="grid grid-4" style="margin-bottom:4px;">
        <div class="field"><label>Mostrar</label>
          <select onchange="lancPeriodo=this.value; render();">
            <option value="aberto" ${lancPeriodo==='aberto'?'selected':''}>Em aberto (todos os meses)</option>
            <option value="mes"    ${lancPeriodo==='mes'?'selected':''}>Um mês</option>
            <option value="todos"  ${lancPeriodo==='todos'?'selected':''}>Tudo</option>
          </select>
        </div>
        <div class="field"><label>Mês</label>
          <input type="month" value="${lancMes}" ${lancPeriodo==='mes'?'':'disabled'}
                 onchange="lancMes=this.value; lancPeriodo='mes'; render();">
        </div>
        <div class="field"><label>Empresa</label>
          <select onchange="lancEmpresa=this.value; render();">
            <option value="">Todas as empresas</option>
            ${DB.empresas.map(e=>`<option value="${e.id}" ${lancEmpresa===e.id?'selected':''}>${esc(e.apelido||e.nome)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Obra</label>
          <select onchange="lancObra=this.value; render();">${opcoesObra(lancObra)}</select>
        </div>
      </div>
      <div class="field" style="max-width:420px;">
        <label>Procurar</label>

/* Redesenha SÓ a lista, para a busca não destruir o campo em que se digita.

   que chama o render completo apaga o próprio input e leva o foco junto. */
function renderLancamentosLista(){
  const alvo = document.getElementById('lancLista');
  if(alvo) alvo.innerHTML = tabelaLancamentos(lancamentosFiltrados());
}

function tabelaLancamentos(lista){
  if(!lista.length){
    return `<div class="empty">Nada aqui${lancBusca?' com esse texto':''}.
      ${lancPeriodo==='aberto'?'<br><span style="font-size:12px;">Você está vendo só o que está em aberto — troque para "Tudo" para ver o que já foi quitado.</span>':''}</div>`;
  }
  const ehTransf = lancAba === 'transferencias';
  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>Vencimento</th><th>Descrição</th>
      <th>${ehTransf?'De → Para':'Categoria'}</th>
      <th>Empresa</th><th>Obra</th>
      <th class="num">Valor</th><th class="num">Em aberto</th><th>Situação</th><th></th>
    </tr></thead>
    <tbody>${lista.map(l=>{
      const st = statusLanc(l);
      const venc = estaVencido(l);
      return `<tr class="rowlink" onclick="openLancDetalhe('${l.id}')" title="Clique para ver o lançamento">
        <td style="white-space:nowrap;${venc?'color:var(--vermelho);font-weight:700;':''}">
          ${l.vencimento?fmtDate(l.vencimento):'—'}</td>
        <td><b>${esc(l.descricao||'—')}</b>
          ${l.natureza==='particular'?' <span class="badge badge-purple">particular</span>':''}
          ${l.origem==='rh'?' <span class="badge badge-blue">do RH</span>':''}
          ${l.recorrenteId?' <span class="badge badge-gray">todo mês</span>':''}
          ${l.pagoNaContaDe?`<br><span style="font-size:10.5px;color:#9aa0ab;">pago na conta de ${esc(l.pagoNaContaDe)}</span>`:''}</td>
        <td>${ehTransf
              ? esc(contaNome(l.contaId)) + ' → ' + esc(contaNome(l.contaDestinoId))
              : esc(l.categoriaId?categoriaNome(l.categoriaId):'—')}</td>
        <td>${esc(empresaFinNome(l.empresaId))}</td>
        <td>${l.obraId?esc(obraNome(l.obraId)):'—'}</td>
        <td class="num">${fmtMoney(l.valor)}</td>
        <td class="num" style="font-weight:700;">${st==='quitado'?'—':fmtMoney(saldoAberto(l))}</td>
        <td>${badgeStatus(l)}</td>
        <td style="white-space:nowrap;" onclick="event.stopPropagation()">

          <button class="btn btn-secondary btn-sm" onclick="${l.tipo==='transferencia'?`openTransferenciaModal('${l.id}')`:`openLancModal('${l.id}')`}">Editar</button>
          <button class="btn btn-danger btn-sm" onclick="deleteLancamento('${l.id}')">Excluir</button>
        </td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
}

/* ---------------- LANÇAMENTO: RECEITA E DESPESA ---------------- */

function openLancModal(id, tipoPadrao){

  const tipo = l ? l.tipo : (tipoPadrao || 'despesa');
  const cats = categoriasDe(tipo === 'receita' ? 'receita' : 'despesa');
  const temBaixa = l && (l.baixas||[]).length > 0;

  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>${l ? 'Editar lançamento' : (tipo==='receita' ? 'Nova conta a receber' : 'Nova conta a pagar')}</h2>

    <div class="grid grid-4">
      <div class="field"><label>Tipo</label>
        <select id="l_tipo" onchange="trocaTipoLanc(this.value)">
          <option value="despesa" ${tipo==='despesa'?'selected':''}>Despesa (a pagar)</option>
          <option value="receita" ${tipo==='receita'?'selected':''}>Receita (a receber)</option>
        </select>
      </div>
      <div class="field"><label>Empresa *</label>
        <select id="l_empresa">
          <option value="">— escolha —</option>
          ${DB.empresas.map(e=>`<option value="${e.id}" ${l&&l.empresaId===e.id?'selected':''}>${esc(e.apelido||e.nome)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Vencimento *</label>
        <input type="date" id="l_venc" value="${l?(l.vencimento||''):todayISO()}"></div>
      <div class="field"><label>Valor (R$) *</label>
        <input type="number" step="0.01" id="l_valor" value="${l?l.valor:''}"></div>
    </div>

    <div class="field"><label>Descrição *</label>
      <input id="l_desc" value="${l?esc(l.descricao||''):''}" placeholder="o que é este pagamento"></div>

    <div class="grid grid-4">
      <div class="field"><label>Categoria</label>
        <select id="l_categoria">
          <option value="">— sem categoria —</option>
          ${cats.map(ct=>`<option value="${ct.id}" ${l&&l.categoriaId===ct.id?'selected':''}>${esc(ct.nome)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Obra (opcional)</label>
        <select id="l_obra">${opcoesObra(l?l.obraId:'')}</select></div>
      <div class="field"><label>Conta prevista</label>
        <select id="l_conta">
          <option value="">— escolha na baixa —</option>
          ${DB.contas.map(ct=>`<option value="${ct.id}" ${l&&l.contaId===ct.id?'selected':''}>${esc(ct.nome)} · ${esc(empresaFinNome(ct.empresaId))}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Natureza</label>
        <select id="l_natureza" onchange="trocaNaturezaLanc(this.value)">
          <option value="operacao"   ${!l||l.natureza!=='particular'?'selected':''}>Operação (entra no resultado)</option>
          <option value="particular" ${l&&l.natureza==='particular'?'selected':''}>Particular (fora do resultado)</option>

    </div>

    <div id="l_blocoParticular" style="display:${l&&l.natureza==='particular'?'block':'none'};">

/* troca a lista de categorias ao trocar receita/despesa, sem redesenhar o modal
   (redesenhar perderia o que já foi digitado) */
function trocaTipoLanc(tipo){
  const sel = document.getElementById('l_categoria');
  if(!sel) return;
  const cats = categoriasDe(tipo === 'receita' ? 'receita' : 'despesa');
  sel.innerHTML = '<option value="">— sem categoria —</option>'
    + cats.map(ct=>`<option value="${ct.id}">${esc(ct.nome)}</option>`).join('');
}
function trocaNaturezaLanc(nat){
  const bloco = document.getElementById('l_blocoParticular');
  if(bloco) bloco.style.display = (nat === 'particular') ? 'block' : 'none';
}
function sociosJaUsados(){
  const set = {};
  DB.lancamentos.forEach(l=>{ if(l.socio) set[l.socio] = true; });
  return Object.keys(set).sort((a,b)=>a.localeCompare(b,'pt-BR'));
}

function saveLanc(id, irParaBaixa){
  const desc  = val('l_desc').trim();
  const valor = numVal('l_valor');
  const emp   = val('l_empresa');
  const venc  = val('l_venc');
  if(!desc){  toast('Escreva a descrição.'); return; }
  if(!emp){   toast('Escolha a empresa.'); return; }
  if(!venc){  toast('Informe o vencimento.'); return; }
  if(valor <= 0){ toast('O valor precisa ser maior que zero.'); return; }

  const natureza = val('l_natureza');
  const dados = {
    tipo: val('l_tipo'), empresaId: emp, vencimento: venc, valor,
    descricao: desc, categoriaId: val('l_categoria'), obraId: val('l_obra'),
    contaId: val('l_conta'), natureza,
    socio: natureza === 'particular' ? val('l_socio').trim() : '',
    pagoNaContaDe: val('l_pagoNaContaDe').trim(), obs: val('l_obs').trim()
  };

  let alvo;
  if(id){
    alvo = DB.lancamentos.find(x=>x.id===id);
    Object.assign(alvo, dados);
  }else{
    alvo = Object.assign({id: uid(), baixas: [], origem: 'manual'}, dados);
    DB.lancamentos.push(alvo);
  }
  saveDB(); closeModal(); render();
  if(irParaBaixa){ openBaixaModal(alvo.id); }
  else { toast('Lançamento salvo.'); }
}

function deleteLancamento(id){
  const l = DB.lancamentos.find(x=>x.id===id);
  if(!l) return;
  const aviso = (l.baixas||[]).length

/* ---------------- BAIXA ---------------- */

function openBaixaModal(id){
  const l = DB.lancamentos.find(x=>x.id===id);
  if(!l) return;
  const resta = saldoAberto(l);
  const ehTransf = l.tipo === 'transferencia';

  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>${ehTransf ? 'Confirmar transferência' : (l.tipo==='receita' ? 'Registrar recebimento' : 'Registrar pagamento')}</h2>
    <p class="help" style="margin-top:0;">
      <b>${esc(l.descricao||'')}</b> · previsto ${fmtMoney(l.valor)}${
      valorBaixado(l) ? ` · já ${l.tipo==='receita'?'recebido':'pago'} ${fmtMoney(valorBaixado(l))}` : ''}
    </p>
    <div class="grid grid-3">
      <div class="field"><label>Data em que o dinheiro andou *</label>
        <input type="date" id="b_data" value="${todayISO()}"></div>
      <div class="field"><label>Valor (R$) *</label>
        <input type="number" step="0.01" id="b_valor" value="${resta}"></div>
      ${ehTransf
        ? `<div class="field"><label>Contas</label>
             <input value="${esc(contaNome(l.contaId))} → ${esc(contaNome(l.contaDestinoId))}" disabled></div>`
        : `<div class="field"><label>Entrou / saiu de qual conta *</label>
             <select id="b_conta">
               <option value="">— escolha —</option>
               ${DB.contas.map(ct=>`<option value="${ct.id}" ${l.contaId===ct.id?'selected':''}>${esc(ct.nome)} · ${esc(empresaFinNome(ct.empresaId))}</option>`).join('')}
             </select>
           </div>`}
    </div>
    <p class="help">
      <b>Pagou menos do que o previsto?</b> Ponha o valor que realmente andou. O resto
      continua em aberto e some da lista só quando for quitado — foi assim que uma dívida de
      R$ 117 mil passou despercebida numa planilha que só sabia dizer "pago" ou "não pago".
    </p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarBaixa('${id}')">Confirmar</button>
    </div>
  `);
}

function confirmarBaixa(id){
  const l = DB.lancamentos.find(x=>x.id===id);
  if(!l) return;
  const data  = val('b_data');
  const valor = numVal('b_valor');
  const ehTransf = l.tipo === 'transferencia';
  const contaId  = ehTransf ? l.contaId : val('b_conta');

  if(!data){ toast('Informe a data.'); return; }
  if(valor <= 0){ toast('O valor precisa ser maior que zero.'); return; }
  if(!contaId){ toast('Escolha a conta.'); return; }
  if(valor > saldoAberto(l) + 0.005){
    if(!confirm('O valor é MAIOR que o que falta (' + fmtMoney(saldoAberto(l)) + ').\n\n'
      + 'Isso vai deixar o lançamento pago a mais. Confirma mesmo assim?')) return;
  }

  l.baixas = l.baixas || [];
  l.baixas.push({id: uid(), data, valor, contaId});
  saveDB(); closeModal(); render();
  toast(statusLanc(l)==='quitado' ? 'Quitado.' : 'Baixa parcial registrada — resta ' + fmtMoney(saldoAberto(l)) + '.');
}

function estornarBaixa(lancId, baixaId){
  const l = DB.lancamentos.find(x=>x.id===lancId);
  if(!l) return;
  if(!confirm('Estornar esta baixa? O valor volta para o saldo em aberto e sai do saldo da conta.')) return;
  l.baixas = (l.baixas||[]).filter(b=>b.id!==baixaId);
  saveDB(); closeModal(); render(); toast('Baixa estornada.');
}

/* ---------------- TRANSFERÊNCIA ----------------
   Some do caixa de uma conta e aparece no de outra. NÃO é receita nem despesa:
   se a transferência da empresa que recebe do cliente para a que paga a folha
   entrasse como receita, o faturamento consolidado contaria o mesmo dinheiro
   duas vezes — uma na nota ao cliente e outra aqui. */

function openTransferenciaModal(id){
  const l = id ? DB.lancamentos.find(x=>x.id===id) : null;
  const opcoesConta = (sel) => DB.contas.map(ct=>
    `<option value="${ct.id}" ${sel===ct.id?'selected':''}>${esc(ct.nome)} · ${esc(empresaFinNome(ct.empresaId))}</option>`).join('');

  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>${l ? 'Editar transferência' : 'Transferência entre contas'}</h2>
    <div class="grid grid-2">
      <div class="field"><label>Sai da conta *</label>
        <select id="t_origem"><option value="">— escolha —</option>${opcoesConta(l?l.contaId:'')}</select></div>
      <div class="field"><label>Entra na conta *</label>
        <select id="t_destino"><option value="">— escolha —</option>${opcoesConta(l?l.contaDestinoId:'')}</select></div>
    </div>
    <div class="grid grid-3">
      <div class="field"><label>Data *</label>
        <input type="date" id="t_data" value="${l?(l.vencimento||todayISO()):todayISO()}"></div>
      <div class="field"><label>Valor (R$) *</label>
        <input type="number" step="0.01" id="t_valor" value="${l?l.valor:''}"></div>
      <div class="field"><label>Descrição</label>
        <input id="t_desc" value="${l?esc(l.descricao||''):'Transferência'}"></div>
    </div>
    ${!l ? `<label class="check"><input type="checkbox" id="t_jaFoi" checked> O dinheiro já andou (dar baixa agora)</label>` : ''}
    <p class="help">
      Transferência <b>não é receita nem despesa</b> — some de um caixa e aparece no outro,
      e não entra em resultado nenhum. É assim que o repasse de uma empresa do grupo para a
      outra tem que ser lançado: se entrasse como receita, o faturamento consolidado
      contaria o mesmo dinheiro duas vezes.
    </p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveTransferencia('${id||''}')">Salvar</button>
    </div>
  `);
}

function saveTransferencia(id){
  const origem  = val('t_origem'), destino = val('t_destino');
  const valor   = numVal('t_valor'), data = val('t_data');
  if(!origem || !destino){ toast('Escolha as duas contas.'); return; }
  if(origem === destino){ toast('As contas de origem e destino são a mesma.'); return; }
  if(valor <= 0){ toast('O valor precisa ser maior que zero.'); return; }
  if(!data){ toast('Informe a data.'); return; }

  const cO = conta(origem), cD = conta(destino);
  const dados = {
    tipo: 'transferencia', natureza: 'operacao',
    empresaId: cO.empresaId, empresaDestinoId: cD.empresaId,
    contaId: origem, contaDestinoId: destino,
    vencimento: data, valor, descricao: val('t_desc').trim() || 'Transferência',
    categoriaId: '', obraId: ''
  };

  if(id){
    Object.assign(DB.lancamentos.find(x=>x.id===id), dados);
  }else{
    const novo = Object.assign({id: uid(), baixas: [], origem: 'manual'}, dados);
    if(checked('t_jaFoi')) novo.baixas.push({id: uid(), data, valor, contaId: origem});
    DB.lancamentos.push(novo);
  }
  saveDB(); closeModal(); render(); toast('Transferência salva.');
}

function recorrenteVigenteEm(r, ym){
  if(r.ativo === false) return false;
  if(r.inicio && ym < r.inicio.slice(0,7)) return false;
  if(r.fim    && ym > r.fim.slice(0,7))    return false;
  return true;
}
function recorrentesPendentes(ym){
  return DB.recorrentes.filter(r=>{
    if(!recorrenteVigenteEm(r, ym)) return false;
    return !DB.lancamentos.some(l=>l.recorrenteId===r.id && l.competencia===ym);
  });
}

function gerarRecorrentes(ym){
  const pend = recorrentesPendentes(ym);
  if(!pend.length){ toast('Nada a gerar.'); return; }
  const [ano, mes] = ym.split('-').map(Number);
  const ultimo = daysInMonth(ano, mes);
  pend.forEach(r=>{
    /* dia 31 em mês de 30 cai no último dia, não vaza para o mês seguinte */
    const dia = Math.min(Math.max(1, r.diaVencimento||1), ultimo);
    DB.lancamentos.push({
      id: uid(), recorrenteId: r.id, competencia: ym, origem: 'manual', baixas: [],
      tipo: r.tipo, empresaId: r.empresaId, natureza: r.natureza || 'operacao',
      descricao: r.descricao, categoriaId: r.categoriaId, obraId: r.obraId || '',
      contaId: r.contaId || '', valor: r.valor,
      vencimento: `${ym}-${String(dia).padStart(2,'0')}`,
      socio: r.socio || '', pagoNaContaDe: '', obs: ''
    });
  });
  saveDB(); render(); toast(pend.length + ' lançamento(s) gerados para ' + monthLabel(ym) + '.');
}

function trocaTipoRecorrente(tipo){
  const sel = document.getElementById('r_categoria');
  if(!sel) return;
  sel.innerHTML = '<option value="">— sem categoria —</option>'
    + categoriasDe(tipo==='receita'?'receita':'despesa').map(ct=>`<option value="${ct.id}">${esc(ct.nome)}</option>`).join('');
}

function saveRecorrente(id){
  const desc = val('r_desc').trim();
  const emp  = val('r_empresa');
  const valor= numVal('r_valor');
  const dia  = parseInt(val('r_dia'), 10);
  if(!desc){ toast('Escreva a descrição.'); return; }
  if(!emp){  toast('Escolha a empresa.'); return; }
  if(valor <= 0){ toast('O valor precisa ser maior que zero.'); return; }
  if(!(dia >= 1 && dia <= 31)){ toast('O dia do vencimento vai de 1 a 31.'); return; }

  const dados = {
    tipo: val('r_tipo'), empresaId: emp, descricao: desc, valor, diaVencimento: dia,
    categoriaId: val('r_categoria'), contaId: val('r_conta'), obraId: '',
    inicio: val('r_inicio'), fim: val('r_fim'),
    natureza: val('r_natureza'), ativo: checked('r_ativo')
  };
  if(id){ Object.assign(DB.recorrentes.find(x=>x.id===id), dados); }
  else  { DB.recorrentes.push(Object.assign({id: uid()}, dados)); }
  saveDB(); closeModal(); render(); toast('Conta mensal salva.');
}

function deleteRecorrente(id){
  const gerados = DB.lancamentos.filter(l=>l.recorrenteId===id).length;
  const aviso = gerados
    ? '\n\nOs ' + gerados + ' lançamento(s) já gerados por ela CONTINUAM existindo — só para de gerar novos.'
    : '';
  if(!confirm('Excluir esta conta mensal?' + aviso)) return;
  DB.recorrentes = DB.recorrentes.filter(r=>r.id!==id);
  saveDB(); render(); toast('Conta mensal excluída.');
}
/* =========================================================
   FINANCEIRO — Fluxo de Caixa, Resultado e Conta-corrente de sócio

   Três perguntas, três blocos:

   1. "Dá para pagar a folha da sexta?" — a projeção, que soma o que está
      previsto ao saldo de hoje e AVISA o dia em que o saldo fica negativo.
      Em 2026 a conta passou 37 dias no vermelho tendo lucro: o problema não
      era margem, era descasamento de prazo. É exatamente isso que a projeção
      pega antes de acontecer.

   2. "A operação deu lucro?" — o resultado, que soma SÓ o que é da operação.
      Transferência entre empresas do grupo e dinheiro particular ficam fora,
      senão o número dobra ou vira ficção.

   3. "Quanto a empresa deve ao sócio, ou ele a ela?" — a conta-corrente.
      Esse registro não existia em lugar nenhum, e por isso a apuração de 2026
      errou o SINAL: dizia que a empresa devia R$ 34.675 ao sócio quando era
      ele quem devia. Aqui o saldo é dito por extenso, não só com sinal.
   ========================================================= */

let fluxoEmpresa = '';
let fluxoDias    = 60;
let fluxoMes     = '';
let fluxoRegime  = 'caixa';   /* caixa (pela baixa) | competencia (pelo vencimento) */

function initFluxo(){ if(!fluxoMes) fluxoMes = currentYM(); }

function renderFluxo(){
  initFluxo();
  const c = document.getElementById('content');
  if(!financeiroPronto()){ c.innerHTML = avisoPrimeiroUso(); return; }
  c.innerHTML = blocoProjecao() + blocoResultado() + blocoPorObra() + blocoContaCorrente();
}

/* =========================================================
   1. PROJEÇÃO
   ========================================================= */

/* Quanto este lançamento mexe no caixa do recorte escolhido.
   Transferência entre contas da MESMA empresa não muda o saldo dela; entre
   empresas diferentes, muda o das duas — e no consolidado se anula. */
function efeitoNoCaixa(l, empresaId, valor){
  if(l.tipo === 'transferencia'){
    if(!empresaId) return 0;                       /* consolidado: entra e sai */
    let v = 0;
    if(l.empresaId === empresaId)        v -= valor;
    if(l.empresaDestinoId === empresaId) v += valor;
    return v;
  }
  if(empresaId && l.empresaId !== empresaId) return 0;
  return l.tipo === 'receita' ? valor : -valor;
}

function projecao(empresaId, dias){
  const hoje = todayISO();
  const fim  = addDays(hoje, dias);
  const abertos = DB.lancamentos.filter(l=>statusLanc(l) !== 'quitado');

  /* O que já venceu é tratado de dois jeitos DIFERENTES, e a assimetria é de
     propósito:

     - CONTA VENCIDA A PAGAR entra na partida. O dinheiro está para sair a
       qualquer momento; deixar de fora esconde um aperto que já existe.
     - RECEBIMENTO VENCIDO NÃO entra. Cliente atrasado não é dinheiro em
       caixa. Somar o que ele deve como se já tivesse chegado é o mesmo erro
       que deixou passar R$ 117 mil de medição paga a menor em 2025, e
       transformaria este aviso num otimista que nunca acusa nada.

     Um alarme de saldo tem que errar para o lado pessimista: se tocar à toa
     não custa nada, se deixar de tocar custa a folha da sexta. */
  let atrasadoSaida = 0, atrasadoEntrada = 0;
  const porDia = {};
  abertos.forEach(l=>{
    const v = efeitoNoCaixa(l, empresaId, saldoAberto(l));
    if(!v) return;
    const venc = l.vencimento || hoje;
    if(venc < hoje){
      if(v < 0) atrasadoSaida += v; else atrasadoEntrada += v;
      return;
    }
    if(venc > fim) return;
    porDia[venc] = (porDia[venc] || 0) + v;
  });

  const saldoHoje    = empresaId ? saldoEmpresa(empresaId, hoje) : saldoGeral(hoje);
  const saldoPartida = Math.round((saldoHoje + atrasadoSaida) * 100) / 100;

  let saldo = saldoPartida;
  const linhas = [];
  let menor = {saldo, data: hoje};

  Object.keys(porDia).sort().forEach(d=>{
    saldo = Math.round((saldo + porDia[d]) * 100) / 100;
    linhas.push({data: d, mov: porDia[d], saldo});
    if(saldo < menor.saldo) menor = {saldo, data: d};
  });

  return {
    atrasadoSaida, atrasadoEntrada,
    saldoHoje, saldoPartida,
    linhas, saldoFinal: saldo, menor,
    primeiroNegativo: linhas.find(x=>x.saldo < 0) || null
  };
}

function blocoProjecao(){
  const p = projecao(fluxoEmpresa, fluxoDias);

    ${p.primeiroNegativo ? `

    <div class="grid grid-4" style="margin-bottom:14px;">

    <div class="table-wrap">

          ${p.linhas.map(x=>`<tr>

            <td class="num" style="font-weight:700;color:${x.saldo<0?'var(--vermelho)':'inherit'};">${fmtMoney(x.saldo)}</td>

    </div>
    <p class="help">
