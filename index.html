      o dinheiro só troca de bolso.
    </p>
  </div>`;
}

/* =========================================================
   2. RESULTADO DA OPERAÇÃO
   ========================================================= */

/* Qual data vale para o mês: a da baixa (regime de caixa, "quando o dinheiro
   andou") ou a do vencimento (competência, "de que mês é a conta"). */
function valorNoMes(l, ym, regime){
  if(regime === 'competencia'){
    return (l.vencimento||'').slice(0,7) === ym ? (Number(l.valor)||0) : 0;
  }
  return (l.baixas||[]).reduce((s,b)=> s + (b.data.slice(0,7) === ym ? (Number(b.valor)||0) : 0), 0);
}

function resultadoDoMes(ym, regime, empresaId){
  const r = {receitas: 0, despesas: 0, porCategoria: {}, particularEntrada: 0, particularSaida: 0, transferencias: 0};
  DB.lancamentos.forEach(l=>{
    if(empresaId && l.empresaId !== empresaId) return;
    const v = valorNoMes(l, ym, regime);
    if(!v) return;

    if(l.tipo === 'transferencia'){ r.transferencias += v; return; }   /* nunca entra no resultado */
    if(l.natureza === 'particular'){
      if(l.tipo === 'receita') r.particularEntrada += v; else r.particularSaida += v;
      return;                                                          /* nem isto */
    }
    const chave = l.categoriaId || '__sem__';
    r.porCategoria[chave] = r.porCategoria[chave] || {receita:0, despesa:0};
    if(l.tipo === 'receita'){ r.receitas += v; r.porCategoria[chave].receita += v; }
    else                    { r.despesas += v; r.porCategoria[chave].despesa += v; }
  });
  r.resultado = Math.round((r.receitas - r.despesas) * 100) / 100;
  r.margem = r.receitas > 0 ? (r.resultado / r.receitas * 100) : 0;
  return r;
}

function blocoResultado(){
  const r = resultadoDoMes(fluxoMes, fluxoRegime, fluxoEmpresa);
  const cats = Object.keys(r.porCategoria)
    .map(k=>({k, nome: k==='__sem__' ? 'Sem categoria' : categoriaNome(k), ...r.porCategoria[k]}))
    .sort((a,b)=>(b.despesa+b.receita)-(a.despesa+a.receita));
  const temParticular = r.particularEntrada || r.particularSaida;

  return `
  <div class="card">
    <div class="section-title">
      <h2 style="margin:0;">Resultado da operação — ${monthLabel(fluxoMes)}</h2>
      <span>
        <input type="month" value="${fluxoMes}" onchange="fluxoMes=this.value; render();" style="max-width:170px;display:inline-block;">
        <select onchange="fluxoRegime=this.value; render();" style="max-width:250px;display:inline-block;">
          <option value="caixa"       ${fluxoRegime==='caixa'?'selected':''}>Pelo dinheiro que andou (baixa)</option>
          <option value="competencia" ${fluxoRegime==='competencia'?'selected':''}>Pelo mês da conta (vencimento)</option>
        </select>
      </span>
    </div>

    <div class="grid grid-4" style="margin-bottom:14px;">
      <div class="kpi"><div class="v" style="color:var(--verde);">${fmtMoney(r.receitas)}</div><div class="l">Receita da operação</div></div>
      <div class="kpi"><div class="v" style="color:var(--vermelho);">${fmtMoney(r.despesas)}</div><div class="l">Custo da operação</div></div>
      <div class="kpi"><div class="v" style="color:${r.resultado<0?'var(--vermelho)':'var(--azul-esc)'};">${fmtMoney(r.resultado)}</div><div class="l">Resultado</div></div>
      <div class="kpi"><div class="v" style="color:${r.resultado<0?'var(--vermelho)':'var(--azul-esc)'};">${fmtNum(r.margem,1)}%</div><div class="l">Margem sobre a receita</div></div>
    </div>

    <div class="table-wrap">
      ${cats.length ? `<table>
        <thead><tr><th>Categoria</th><th class="num">Receita</th><th class="num">Custo</th><th class="num">% do custo</th></tr></thead>
        <tbody>${cats.map(ct=>`<tr>
          <td>${esc(ct.nome)}</td>
          <td class="num">${ct.receita?fmtMoney(ct.receita):'—'}</td>
          <td class="num">${ct.despesa?fmtMoney(ct.despesa):'—'}</td>
          <td class="num">${ct.despesa&&r.despesas?fmtNum(ct.despesa/r.despesas*100,1)+'%':'—'}</td>
        </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Nada lançado neste mês com esta forma de contar.</div>'}
    </div>

    ${temParticular ? `
    <p class="help" style="margin-top:12px;padding:10px 12px;background:#f0e9fb;border-radius:8px;color:#4a2a75;">
      <b>Fora deste resultado, de propósito:</b> ${fmtMoney(r.particularSaida)} de saída e
      ${fmtMoney(r.particularEntrada)} de entrada marcados como <b>particular</b>.
      Esse dinheiro saiu ou entrou na conta de verdade — e por isso está no caixa — mas não é
      custo nem receita da obra. Aparece na conta-corrente de sócio, mais abaixo.
    </p>` : ''}
    ${r.transferencias ? `<p class="help">${fmtMoney(r.transferencias)} em transferências no mês —
      não entram no resultado, porque o dinheiro só trocou de conta.</p>` : ''}
    <p class="help" style="margin-bottom:0;">
      <b>Pelo dinheiro que andou</b> responde "quanto sobrou no bolso este mês".
      <b>Pelo mês da conta</b> responde "quanto este mês custou", mesmo que o pagamento caia
      depois. Os dois estão certos — respondem perguntas diferentes.
    </p>
  </div>`;
}

/* =========================================================
   3. RESULTADO POR OBRA
   ========================================================= */

function blocoPorObra(){
  const linhas = DB.obras.map(o=>{
    let rec = 0, des = 0;
    DB.lancamentos.forEach(l=>{
      if(l.obraId !== o.id) return;
      if(l.tipo === 'transferencia' || l.natureza === 'particular') return;
      const v = valorNoMes(l, fluxoMes, fluxoRegime);
      if(!v) return;
      if(l.tipo === 'receita') rec += v; else des += v;
    });
    return {o, rec, des, res: Math.round((rec-des)*100)/100};
  }).filter(x=>x.rec || x.des);

  const semObra = (()=>{
    let rec = 0, des = 0;
    DB.lancamentos.forEach(l=>{
      if(l.obraId) return;
      if(l.tipo === 'transferencia' || l.natureza === 'particular') return;
      const v = valorNoMes(l, fluxoMes, fluxoRegime);
      if(!v) return;
      if(l.tipo === 'receita') rec += v; else des += v;
    });
    return {rec, des};
  })();

  return `
  <div class="card">
    <h2 style="margin-top:0;">Resultado por obra — ${monthLabel(fluxoMes)}</h2>
    <div class="table-wrap">
      ${linhas.length ? `<table>
        <thead><tr><th>Obra</th><th class="num">Recebido</th><th class="num">Custo</th><th class="num">Resultado</th><th class="num">Margem</th></tr></thead>
        <tbody>${linhas.map(x=>`<tr>
          <td><b>${esc(x.o.nome)}</b></td>
          <td class="num">${fmtMoney(x.rec)}</td>
          <td class="num">${fmtMoney(x.des)}</td>
          <td class="num" style="font-weight:700;color:${x.res<0?'var(--vermelho)':'var(--verde)'};">${fmtMoney(x.res)}</td>
          <td class="num">${x.rec?fmtNum(x.res/x.rec*100,1)+'%':'—'}</td>
        </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Nenhum lançamento com obra neste mês. Escolha a obra no lançamento para a margem por obra aparecer aqui.</div>'}
    </div>
    ${(semObra.rec||semObra.des) ? `<p class="help">
      Fora da tabela: ${fmtMoney(semObra.rec)} de receita e ${fmtMoney(semObra.des)} de custo
      <b>sem obra escolhida</b>. Enquanto houver custo sem obra, a margem de cada uma sai
      melhor do que é de verdade.</p>` : ''}
    <p class="help" style="margin-bottom:0;">
      Aqui só entra o que foi lançado no financeiro. O <b>custo da mão de obra</b> — salário,
      diária, encargos, vales, EPI — está em <b>Custo Consolidado</b>, no RH, e ainda não é
      somado automaticamente aqui. Enquanto isso não for ligado, a margem desta tabela é
      <b>maior do que a real</b>.
    </p>
  </div>`;
}

/* =========================================================
   4. CONTA-CORRENTE DE SÓCIO
   ========================================================= */

function contaCorrenteSocios(){
  const mapa = {};
  DB.lancamentos.forEach(l=>{
    if(l.natureza !== 'particular') return;
    const nome = (l.socio || '').trim() || 'Sem nome';
    const m = mapa[nome] = mapa[nome] || {nome, aportou: 0, retirou: 0, previstoAportar: 0, previstoRetirar: 0, itens: 0};
    m.itens++;
    const baixado = valorBaixado(l);
    const aberto  = Math.max(0, saldoAberto(l));
    if(l.tipo === 'receita'){ m.aportou += baixado; m.previstoAportar += aberto; }
    else                    { m.retirou += baixado; m.previstoRetirar += aberto; }
  });
  return Object.keys(mapa).map(k=>{
    const m = mapa[k];
    m.saldo = Math.round((m.aportou - m.retirou) * 100) / 100;
    return m;
  }).sort((a,b)=>Math.abs(b.saldo)-Math.abs(a.saldo));
}

function blocoContaCorrente(){
  const socios = contaCorrenteSocios();
  return `
  <div class="card">
    <h2 style="margin-top:0;">Conta-corrente de sócio</h2>
    <div class="table-wrap">
      ${socios.length ? `<table>
        <thead><tr><th>Pessoa</th><th class="num">Pôs na empresa</th><th class="num">Tirou da empresa</th><th class="num">Saldo</th><th>O que isso quer dizer</th></tr></thead>
        <tbody>${socios.map(s=>`<tr>
          <td><b>${esc(s.nome)}</b><br><span style="font-size:10.5px;color:#9aa0ab;">${s.itens} lançamento(s)</span></td>
          <td class="num">${fmtMoney(s.aportou)}</td>
          <td class="num">${fmtMoney(s.retirou)}</td>
          <td class="num" style="font-weight:700;">${fmtMoney(Math.abs(s.saldo))}</td>
          <td>${s.saldo > 0
              ? `<span class="badge badge-blue">a empresa deve a ${esc(s.nome.split(' ')[0])}</span>`
              : (s.saldo < 0
                ? `<span class="badge badge-yellow">${esc(s.nome.split(' ')[0])} deve à empresa</span>`
                : '<span class="badge badge-green">quitado</span>')}</td>
        </tr>`).join('')}</tbody></table>`
      : `<div class="empty">Nada aqui ainda.<br><span style="font-size:12px;">
          Entra sozinho quando um lançamento é marcado como <b>Particular</b> e recebe um nome.</span></div>`}
    </div>
    <p class="help">
      <b>O saldo é dito por extenso de propósito.</b> A apuração de 2026 errou justamente o
      sinal — dizia que a empresa devia R$ 34.675 ao sócio quando, refeita a conta pelo
      extrato, era ele quem devia R$ 10.251,40. O que virou o número foram quatro coisas que
      só ele sabia: um repasse que era de outra empresa, um dinheiro aplicado que continuava
      sendo dele, uma mensalidade que entrou e saiu, e uma moto paga com dinheiro da empresa.
    </p>
    <p class="help" style="margin-bottom:0;">
      <b>Pró-labore não é retirada de sócio.</b> É pagamento pelo trabalho: entra como
      <b>despesa da operação</b>, não aqui — mesmo quando quem paga é a conta de outra
      empresa do grupo. Lançar como retirada erra o resultado e esta tabela ao mesmo tempo.
    </p>
  </div>`;
}
/* =========================================================
   AJUSTES DE TELA PEQUENA
   Entra nos DOIS builds: o computador não é afetado, porque tudo aqui só
   liga abaixo de 760px de largura.

   Resolve três incômodos relatados em 28/08/2026:
     1. as abas rolavam de lado e escondiam páginas  -> gaveta
     2. a página rolava de lado atrás de botão       -> tabela vira ficha
     3. logo e nome por baixo do relógio do iPhone   -> resolvido no CSS
   ========================================================= */

const TELA_ESTREITA = 760;
function telaEstreita(){ return window.innerWidth <= TELA_ESTREITA; }

/* ---------------------------------------------------------
   GAVETA
   --------------------------------------------------------- */
function abrirGaveta(){
  document.getElementById('app').classList.add('gaveta-aberta');
  /* trava a rolagem do fundo, senão o dedo arrasta a página atrás da gaveta */
  document.body.style.overflow = 'hidden';
}
function fecharGaveta(){
  document.getElementById('app').classList.remove('gaveta-aberta');
  document.body.style.overflow = '';
}
function gavetaAberta(){
  return document.getElementById('app').classList.contains('gaveta-aberta');
}

/* Escolher uma página fecha a gaveta. Envolvemos o goTo em vez de editá-lo
   para não mexer no 02_core.js mais do que o necessário. */
const goToOriginal = window.goTo;
window.goTo = function(id){
  const r = goToOriginal.apply(this, arguments);
  if(gavetaAberta()) fecharGaveta();
  return r;
};

/* Voltar no navegador fecha a gaveta em vez de sair do app — é o que o
   usuário espera de aplicativo, e evita perder a tela por engano. */
window.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && gavetaAberta()) fecharGaveta();
});

/* Arrastar a gaveta para a esquerda fecha, como no Facebook.
   Só conta arrasto claramente horizontal, senão atrapalha a rolagem da lista. */
(function arrastarParaFechar(){
  let x0 = null, y0 = null, horizontal = null;
  const alvo = function(){ return document.getElementById('sidebar'); };

  document.addEventListener('touchstart', function(e){
    if(!gavetaAberta() || !e.touches.length) return;
    const s = alvo();
    if(!s || !s.contains(e.target)) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; horizontal = null;
  }, {passive:true});

  document.addEventListener('touchmove', function(e){
    if(x0 === null || !e.touches.length) return;
    const dx = e.touches[0].clientX - x0;
    const dy = e.touches[0].clientY - y0;
    if(horizontal === null){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;   // ainda não deu para saber
      horizontal = Math.abs(dx) > Math.abs(dy) * 1.4;
    }
    if(!horizontal || dx > 0) return;
    const s = alvo();
    if(s){ s.style.transition = 'none'; s.style.transform = 'translateX(' + dx + 'px)'; }
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if(x0 === null) return;
    const s = alvo();
    const dx = (e.changedTouches && e.changedTouches.length)
             ? e.changedTouches[0].clientX - x0 : 0;
    if(s){ s.style.transition = ''; s.style.transform = ''; }
    if(horizontal && dx < -60) fecharGaveta();
    x0 = y0 = horizontal = null;
  }, {passive:true});
})();

/* ---------------------------------------------------------
   TABELA VIRA FICHA
   Percorre as tabelas recém-desenhadas e copia o texto do <th> para o
   data-rotulo de cada <td> da mesma coluna. O CSS usa esse rótulo para
   empilhar a linha em forma de ficha. Feito aqui, uma vez só, em vez de
   espalhado por 03_func.js, 04_*, 05_*, 06_* — que são de outra janela.
   --------------------------------------------------------- */
function prepararTabelas(){
  const raiz = document.getElementById('content');
  if(!raiz) return;

  /* Caixas de contagem ("Trabalharam", "Faltaram", "Sem lançamento",
     "A confirmar") em duas colunas e menores. Uma embaixo da outra ocupava meia
     tela para mostrar quatro números. Marcamos aqui, por JS, em vez de usar
     :has() no CSS — :has() é recente e não quero depender dele no iPhone. */
  raiz.querySelectorAll('.grid').forEach(function(g){
    if(g.dataset.kpiMarcado === '1') return;
    g.dataset.kpiMarcado = '1';
    if(g.querySelector(':scope > .kpi')) g.classList.add('grid-kpi');
  });

  raiz.querySelectorAll('table').forEach(function(t){
    if(t.dataset.prontaMobile === '1') return;
    t.dataset.prontaMobile = '1';

    /* A tela pediu explicitamente para continuar tabela — é o caso da lista de
       lançar o dia, que foi enxugada para caber (nome numa linha, cargo
       abreviado, botões só com a inicial). Empilhar ali só alongaria. */
    if(t.classList.contains('nao-empilha')){ marcarRolavel(t); return; }

    const ths = t.querySelectorAll('thead th');

    /* Sem cabeçalho não há rótulo para mostrar; empilhar viraria uma pilha de
       valores soltos, pior que rolar. Deixa como está. */
    if(!ths.length){ marcarRolavel(t); return; }

    /* Célula mesclada quebra a conta de coluna por posição. Não arriscamos. */
    let mesclada = false;
    t.querySelectorAll('td, th').forEach(function(c){
      if(c.colSpan > 1 || c.rowSpan > 1) mesclada = true;
    });
    if(mesclada){ marcarRolavel(t); return; }

    const rotulos = Array.prototype.map.call(ths, function(th){
      return (th.textContent || '').trim();
    });

    /* Poucas colunas já cabem na tela; empilhar só deixaria mais comprido. */
    if(rotulos.length <= 2){ marcarRolavel(t); return; }

    t.querySelectorAll('tbody tr').forEach(function(tr){
      const tds = tr.children;
      if(tds.length !== rotulos.length) return;
      for(let i = 0; i < tds.length; i++){
        if(!tds[i].hasAttribute('data-rotulo')){
          tds[i].setAttribute('data-rotulo', rotulos[i]);
        }
      }
    });
    t.classList.add('empilha');
  });
}

/* A tabela que não empilhou continua rolando dentro da caixa. Marcamos a caixa
   para o CSS mostrar "arraste de lado" — só quando ela realmente transborda,
   senão o aviso mente. */
function marcarRolavel(t){
  const caixa = t.closest('.table-wrap');
  if(!caixa) return;
  caixa.classList.toggle('rolavel', caixa.scrollWidth > caixa.clientWidth + 4);
}

/* Roda depois de cada desenho de tela. */
const renderOriginal = window.render;
window.render = function(){
  const r = renderOriginal.apply(this, arguments);
  try{ if(telaEstreita()) prepararTabelas(); }catch(e){ console.warn('prepararTabelas:', e); }
  return r;
};

/* Envolver o render() não basta: muitas telas se redesenham por conta própria
   (renderPontoDia(), renderFuncionarios(), renderVales()...) chamadas direto de
   um onclick, sem passar pelo render(). Quando isso acontece, a tabela nova
   nasce sem o tratamento e volta a rolar de lado.

   Tentei um MutationObserver primeiro e ele não pegou os redesenhos de forma
   confiável. Isto aqui é determinístico: envolve TODA função global cujo nome
   começa com "render". Nada de timing, nada de observador — se a tela se
   redesenhou, foi por uma dessas funções.

   Vale para as telas que ainda nem existem: qualquer render* nova entra junto,
   desde que declarada antes deste arquivo (ele é o último do build.sh). */
(function envolverRenders(){
  Object.getOwnPropertyNames(window)
    .filter(function(nome){
      return /^render[A-Z]/.test(nome) && typeof window[nome] === 'function';
    })
    .forEach(function(nome){
      const original = window[nome];
      if(original.__ajustadoMobile) return;      // não envolver duas vezes
      const envolvida = function(){
        const r = original.apply(this, arguments);
        try{ if(telaEstreita()) prepararTabelas(); }
        catch(e){ console.warn('prepararTabelas em ' + nome + ':', e); }
        return r;
      };
      envolvida.__ajustadoMobile = true;
      window[nome] = envolvida;
    });
})();

/* Girar o aparelho ou redimensionar a janela muda o jogo: o que era estreito
   vira largo. Redesenha para as tabelas voltarem à forma certa. */
let larguraAnterior = window.innerWidth;
window.addEventListener('resize', function(){
  const eraEstreita = larguraAnterior <= TELA_ESTREITA;
  const agoraEstreita = telaEstreita();
  larguraAnterior = window.innerWidth;
  if(eraEstreita === agoraEstreita) return;
  if(!agoraEstreita && gavetaAberta()) fecharGaveta();
  try{ render(); }catch(e){}
});

/* =========================================================
   SINCRONIZAÇÃO AUTOMÁTICA COM O GOOGLE DRIVE
   Só entra no build do GitHub Pages (build-github.sh). O app dos PCs não usa:
   lá o transporte é o arquivo direto na pasta do Drive, que é melhor.

   POR QUE ISTO EXISTE
   Em 27/08/2026 o ponto lançado pelo iPhone não chegou ao Drive. A causa não
   foi descuido: o iOS NUNCA sobrescreve arquivo, ele cria cópia. O
   bela-angra-dados.json virou "bela-angra-dados (1).json" e o PC continuou
   lendo o antigo. Nenhuma disciplina de uso resolve isso.

   COMO ESTE ARQUIVO SE ENCAIXA
   Ele NÃO altera o 09_sync.js. Toda a lógica de junção — mesclar(),
   pacoteSync(), aplicarPacote() — é reaproveitada como está; é ela que a
   bateria de testes cobre. Aqui só existe um TRANSPORTE novo: outro jeito de
   buscar e gravar o mesmo pacote. A tela ganha um cartão por cima, envolvendo
   a renderSync original, em vez de editá-la.
   ========================================================= */
(function(){

  /* O ID do cliente é público de propósito: aplicativo que roda no navegador
     não tem onde guardar segredo. Quem protege o acesso é a lista de origens
     autorizadas no console do Google — só https://construcoesbelaangra.github.io
     consegue pedir token com este ID. Não existe "chave secreta" aqui, e não
     deve existir. */
  const CLIENT_ID = '260810918804-i0eis05uak5jq3v3bo0j0kcdcemu8ie4.apps.googleusercontent.com';

  /* drive.file é o menor escopo que resolve: o app só enxerga o arquivo que ele
     mesmo criou. Não dá para listar, ler nem apagar mais nada do Drive. */
  const ESCOPO = 'https://www.googleapis.com/auth/drive.file';

  const NOME_ARQUIVO = 'bela-angra-dados.json';
  const API    = 'https://www.googleapis.com/drive/v3';
  const UPLOAD = 'https://www.googleapis.com/upload/drive/v3';

  let tokenClient = null;
  let token       = null;      // vive só nesta sessão, nunca no localStorage
  let tokenAte    = 0;
  let gisPronto   = false;
  let sincronizando = false;

  /* ---------------------------------------------------------
     Carregar a biblioteca do Google
     --------------------------------------------------------- */
  (function carregarGIS(){
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function(){
      gisPronto = true;
      if(currentPage === 'sync') renderSync();
    };
    s.onerror = function(){
      gisPronto = false;
      if(currentPage === 'sync') renderSync();
    };
    document.head.appendChild(s);
  })();

  function driveDisponivel(){
    return gisPronto && window.google
        && google.accounts && google.accounts.oauth2;
  }
  function tokenValido(){
    return !!token && Date.now() < tokenAte;
  }
  /* "conectado" = já usou o Drive neste aparelho alguma vez */
  function driveJaUsado(){
    return !!meta().driveFileId;
  }

  /* ---------------------------------------------------------
     Token de acesso
     O Safari do iPhone corta a renovação silenciosa, então o pedido de token
     PRECISA sair de um toque do usuário — senão o iOS bloqueia como popup.
     Por isso nunca chamamos isto sozinho, só a partir de um botão.
     --------------------------------------------------------- */
  function pedirToken(forcarConsentimento){
    return new Promise(function(ok, falha){
      if(!driveDisponivel()){
        falha(new Error('A biblioteca do Google ainda não carregou. '
                      + 'Confira a internet e tente de novo.'));
        return;
      }
      if(!tokenClient){
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: ESCOPO,
          callback: function(){}      // trocado a cada pedido, logo abaixo
        });
      }
      tokenClient.callback = function(resp){
        if(resp && resp.error){
          falha(new Error(resp.error_description || resp.error));
          return;
        }
        token = resp.access_token;
        /* desconta 60s de folga para não estourar no meio de uma gravação */
        tokenAte = Date.now() + ((Number(resp.expires_in) || 3600) - 60) * 1000;
        ok(token);
      };
      try{
        tokenClient.requestAccessToken({prompt: forcarConsentimento ? 'consent' : ''});
      }catch(e){ falha(e); }
    });
  }

  async function garantirToken(){
    if(tokenValido()) return token;
    return await pedirToken(false);
  }

  /* ---------------------------------------------------------
     Conversa com o Drive
     --------------------------------------------------------- */
  async function chamar(url, opcoes){
    opcoes = opcoes || {};
    opcoes.headers = Object.assign({}, opcoes.headers || {},
                                   {Authorization: 'Bearer ' + token});
    const r = await fetch(url, opcoes);
    if(r.status === 401){
      token = null; tokenAte = 0;
      throw new Error('O acesso ao Google expirou. Toque em "Conectar ao Drive" '
                    + 'de novo — leva um segundo.');
    }
    if(!r.ok){
      let detalhe = '';
      try{
        const j = await r.json();
        detalhe = (j && j.error && j.error.message) ? j.error.message : '';
      }catch(e){}
      throw new Error('Drive respondeu ' + r.status + (detalhe ? ': ' + detalhe : ''));
    }
    return r;
  }

  /* Acha o arquivo que este app já criou, ou cria pela primeira vez.
     Com o escopo drive.file esta busca só enxerga arquivos do próprio app —
     ela não varre o Drive do usuário. */
  async function acharOuCriarArquivo(){
    const m = meta();

    if(m.driveFileId){
      try{
        await chamar(API + '/files/' + m.driveFileId + '?fields=id,trashed');
        return m.driveFileId;
      }catch(e){
        /* 401 tem que subir: é expiração de acesso, não arquivo sumido */
        if(/expirou/.test(e.message)) throw e;
        /* apagado ou na lixeira — esquece e procura de novo */
        m.driveFileId = '';
      }
    }

    const q = "name='" + NOME_ARQUIVO + "' and trashed=false";
    const r = await chamar(API + '/files?q=' + encodeURIComponent(q)
                         + '&fields=files(id,modifiedTime)&orderBy=modifiedTime desc');
    const j = await r.json();
    if(j.files && j.files.length){
      m.driveFileId = j.files[0].id;
      saveDB();
      return m.driveFileId;
    }

    /* ---- TRAVA CONTRA CRIAR ARQUIVO VAZIO ----
       Aconteceu de verdade em 27/08/2026 e vale a pena entender:

       O escopo drive.file só enxerga arquivos que ESTE app criou. O
       bela-angra-dados.json que já existia na pasta foi criado pelo app do PC,
       então a busca acima não acha nada — e não tem como achar. Sem esta trava,
       um iPhone recém-instalado (vazio) criava um segundo arquivo, também
       vazio, e o dono ficava com dois arquivos de mesmo nome no Drive achando
       que tinha perdido tudo.

       Regra: só criamos o arquivo se este aparelho tiver alguma coisa para
       colocar dentro dele. Aparelho vazio recebe dados, nunca semeia. */
    if(!(DB.funcionarios && DB.funcionarios.length)){
      throw new Error(
        'Este aparelho ainda está vazio — não tem nenhum funcionário cadastrado.\n\n'
      + 'Por segurança eu não vou criar o arquivo do Drive agora: ele nasceria '
      + 'vazio e você ficaria com dois arquivos de mesmo nome, sem saber qual é '
      + 'o bom.\n\n'
      + 'Traga os dados para este aparelho primeiro, de um destes jeitos:\n\n'
      + '• No computador, toque em "Copiar meus dados" e aqui em "Colar dados '
      + 'de outro aparelho"; ou\n'
      + '• Use "⬆ Carregar do Drive (juntar)" e escolha o bela-angra-dados.json.\n\n'
      + 'Depois disso, volte aqui e conecte — aí o arquivo nasce completo.');
    }

    /* primeira vez: cria o arquivo com o que existe neste aparelho */
    const limite = '-------belaangra' + Date.now();
    const corpo =
        '--' + limite + '\r\n'
      + 'Content-Type: application/json; charset=UTF-8\r\n\r\n'
      + JSON.stringify({name: NOME_ARQUIVO, mimeType: 'application/json'}) + '\r\n'
      + '--' + limite + '\r\n'
      + 'Content-Type: application/json\r\n\r\n'
      + JSON.stringify(pacoteSync(), null, 2) + '\r\n'
      + '--' + limite + '--';

    const c = await chamar(UPLOAD + '/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: {'Content-Type': 'multipart/related; boundary=' + limite},
      body: corpo
    });
    const cj = await c.json();
    m.driveFileId = cj.id;
    saveDB();

    /* Dizer ONDE o arquivo caiu. A API cria na raiz do Drive, e sem este aviso
       o usuário procura na pasta do projeto, não acha, e acha que falhou. */
    alert('Pronto — criei o arquivo de dados no seu Google Drive.\n\n'
        + 'Ele nasceu na RAIZ do Drive, com o nome ' + NOME_ARQUIVO + '. '
        + 'Quando puder, no computador, MOVA ele para dentro da pasta '
        + '"03 - Sistema RH Bela Angra", junto com o resto.\n\n'
        + 'Mova, não copie: copiar cria outro arquivo e este aparelho perde o '
        + 'acesso a ele. Movido, continua funcionando normalmente.');

    return m.driveFileId;
  }

  async function lerArquivo(id){
    const r = await chamar(API + '/files/' + id + '?alt=media');
    return await r.text();
  }

  async function gravarArquivo(id, texto){
    await chamar(UPLOAD + '/files/' + id + '?uploadType=media', {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: texto
    });
  }

  /* ---------------------------------------------------------
     O ciclo — igual ao do arquivo direto: lê, junta, grava de volta
     --------------------------------------------------------- */
  async function sincronizarDrive(){
    if(sincronizando) return;
    if(!navigator.onLine){
      alert('Sem internet agora.\n\n'
          + 'Pode trabalhar normalmente — o que você lançar fica guardado no '
          + 'aparelho. Sincronize quando pegar sinal.');
      return;
    }
    sincronizando = true;
    pintarBotoes(true);
    try{
      await garantirToken();
      const id = await acharOuCriarArquivo();

      let res = {novos:0, atualizados:0, removidos:0, enviados:0};
      const texto = await lerArquivo(id);
      if(texto && texto.trim()) res = aplicarPacote(texto);

      await gravarArquivo(id, JSON.stringify(pacoteSync(), null, 2));

      meta().ultimaSync = Date.now();
      meta().arquivoNome = NOME_ARQUIVO;
      saveDB();
      atualizarIndicadorSync();
      if(currentPage === 'sync') renderSync();
      toast('Sincronizado com o Drive. ' + resumoMesclagem(res));
    }catch(e){
      alert('Não deu para sincronizar com o Drive.\n\n'
          + (e && e.message ? e.message : e)
          + '\n\nO que você lançou continua guardado neste aparelho — nada se '
          + 'perdeu. Dá para tentar de novo, ou usar "Copiar meus dados" para '
          + 'passar por outro caminho.');
    }finally{
      sincronizando = false;
      pintarBotoes(false);
      if(currentPage === 'sync') renderSync();
    }
  }

  async function desconectarDrive(){
    if(!confirm('Desconectar este aparelho do Google Drive?\n\n'
              + 'Seus dados continuam aqui. Só a sincronização automática para '
              + 'de funcionar até você conectar de novo.')) return;
    try{
      if(token && driveDisponivel()) google.accounts.oauth2.revoke(token, function(){});
    }catch(e){}
    token = null; tokenAte = 0;
    meta().driveFileId = '';
    saveDB();
    if(currentPage === 'sync') renderSync();
    toast('Desconectado do Drive.');
  }

  function pintarBotoes(ocupado){
    const b = document.getElementById('btnDrive');
    if(!b) return;
    b.disabled = ocupado;
    b.textContent = ocupado ? 'Sincronizando...'
                            : (driveJaUsado() ? '⟳ Sincronizar com o Drive'
                                              : 'Conectar ao Drive e sincronizar');
  }

  /* ---------------------------------------------------------
     Tela — um cartão inserido no topo da Sincronizar, sem tocar na renderSync
     --------------------------------------------------------- */
  function cartaoDrive(){
    const m = meta();
    const usado = driveJaUsado();
    const ultima = m.ultimaSync
      ? new Date(m.ultimaSync).toLocaleString('pt-BR') : 'nunca';

    if(!driveDisponivel()){
      return '<div class="card" style="border-left:4px solid var(--amarelo);">'
           + '<h2>Sincronização automática com o Drive</h2>'
           + '<p class="help">Não consegui carregar a biblioteca do Google — '
           + 'normalmente é falta de internet. Ela volta sozinha quando você '
           + 'abrir o app com sinal.<br><br>'
           + 'Enquanto isso, os modos manuais abaixo continuam funcionando '
           + 'igual.</p></div>';
    }

    return '<div class="card" style="border-left:4px solid '
         + (pendenteSync() ? 'var(--amarelo)' : 'var(--verde)') + ';">'
      + '<h2>Sincronização automática com o Drive</h2>'
      + '<p class="help" style="margin-bottom:14px;font-size:13px;color:var(--chumbo-claro);">'
      + (usado
          ? 'Este aparelho grava direto no <b>' + esc(NOME_ARQUIVO) + '</b> do Drive. '
            + 'Última sincronização: <b>' + esc(ultima) + '</b>.'
          : 'Toque no botão para ligar este aparelho ao Drive. O Google vai pedir '
            + 'sua permissão uma vez.<br>O app enxerga <b>só o arquivo de dados '
            + 'do sistema</b> — nada mais do seu Drive.<br><br>'
            + '<b>Se este aparelho ainda estiver vazio</b>, traga os dados antes '
            + '(pelo "Colar dados de outro aparelho" ou pelo "Carregar do Drive" '
            + 'aqui embaixo). Aparelho vazio não pode ser o primeiro a gravar, '
            + 'senão o arquivo nasce vazio.')
      + '</p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
      + '<button class="btn btn-primary" id="btnDrive" style="font-size:14px;padding:11px 20px;" '
      + 'onclick="sincronizarDrive()">'
      + (usado ? '⟳ Sincronizar com o Drive' : 'Conectar ao Drive e sincronizar')
      + '</button>'
      + (usado ? '<button class="btn btn-secondary" onclick="desconectarDrive()">Desconectar</button>' : '')
      + '</div>'
      + '<p class="help" style="margin-top:12px;">'
      + 'Faz tudo de uma vez: lê o que está no Drive, junta com o que está aqui '
      + 'e grava de volta — <b>no mesmo arquivo</b>, sem criar cópia.'
      + (usado ? '<br>De vez em quando o Google pede para reconectar. É o Safari '
               + 'expirando o acesso, não erro — é só tocar no botão de novo.' : '')
      + '</p></div>';
  }

  /* envolve a renderSync original em vez de alterá-la */
  const renderSyncOriginal = window.renderSync;
  window.renderSync = function(){
    renderSyncOriginal.apply(this, arguments);
    if(currentPage !== 'sync') return;
    const c = document.getElementById('content');
    if(!c || document.getElementById('btnDrive')) return;
    c.insertAdjacentHTML('afterbegin', cartaoDrive());
  };

  /* o botão da faixa de aviso, no topo de todas as telas, passa a usar o Drive
     quando ele estiver em uso neste aparelho */
  const sincronizarAgoraOriginal = window.sincronizarAgora;
  window.sincronizarAgora = async function(){
    if(driveJaUsado() || !suportaArquivoDireto()){
      await sincronizarDrive();
      return;
    }
    return await sincronizarAgoraOriginal.apply(this, arguments);
  };

  window.sincronizarDrive  = sincronizarDrive;
  window.desconectarDrive  = desconectarDrive;

})();
/* =========================================================
   ADAPTAÇÕES DA VERSÃO PUBLICADA NO GITHUB PAGES (celular e tablet)
   Só entra no build-github.sh — o app local (bela-angra-rh.html) não usa
   este arquivo, porque no PC ele é aberto direto do disco.

   Endereço: https://construcoesbelaangra.github.io/BELA-ANGRA-APP/

   Faz três coisas:
   1. Registra o service worker, que é o que permite o app ABRIR SEM INTERNET.
      Sem ele, na obra sem sinal a tela fica em branco.
   2. Avisa quando existe versão nova publicada, com botão para atualizar.
      Versões diferentes calculam diferente — não dá para ficar atrasado calado.
   3. No iPhone/iPad, insiste para instalar na Tela de Início. É isso que
      livra o app da regra dos 7 dias do Safari, que APAGA os dados.
   ========================================================= */
(function(){

  /* ---------------------------------------------------------
     1. SERVICE WORKER — o app passa a abrir offline
     --------------------------------------------------------- */
  let swRegistro = null;
  let recarregando = false;

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').then(function(reg){
        swRegistro = reg;

        /* já existe uma versão nova parada esperando (aconteceu numa aba anterior) */
        if(reg.waiting && navigator.serviceWorker.controller) mostrarBarraAtualizar(reg.waiting);

        /* uma versão nova começou a ser baixada agora */
        reg.addEventListener('updatefound', function(){
          const novo = reg.installing;
          if(!novo) return;
          novo.addEventListener('statechange', function(){
            /* "installed" com controller significa ATUALIZAÇÃO, não primeira instalação */
            if(novo.state === 'installed' && navigator.serviceWorker.controller){
              mostrarBarraAtualizar(novo);
            }
          });
        });

        /* procura versão nova ao voltar para o app (não só ao abrir do zero) */
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState === 'visible') reg.update().catch(function(){});
        });
      }).catch(function(e){
        console.warn('service worker não registrou:', e);
      });

      /* quando o worker novo assume, recarrega uma única vez */
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(recarregando) return;
        recarregando = true;
        window.location.reload();
      });
    });
  }

  function mostrarBarraAtualizar(worker){
    if(document.getElementById('barraAtualizar')) return;
    const el = document.createElement('div');
    el.id = 'barraAtualizar';
    el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:300;'
                     + 'background:#1c4fd8;color:#fff;padding:13px 16px;'
                     + 'padding-bottom:calc(13px + env(safe-area-inset-bottom));'
                     + 'font-size:13px;font-weight:600;display:flex;align-items:center;'
                     + 'gap:12px;box-shadow:0 -4px 16px rgba(0,0,0,.22);';
    el.innerHTML = '<span style="flex:1;line-height:1.45;">Existe uma versão nova do sistema.'
                 + '<br><span style="font-weight:400;opacity:.85;">'
                 + 'Atualize antes de lançar — versões diferentes calculam diferente.</span></span>';

    const btn = document.createElement('button');
    btn.textContent = 'Atualizar';
    btn.style.cssText = 'background:#fff;color:#1c4fd8;border:none;border-radius:8px;'
                      + 'padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;'
                      + 'flex-shrink:0;';
    btn.onclick = function(){
      btn.disabled = true;
      btn.textContent = 'Atualizando...';
      worker.postMessage({tipo: 'ASSUMIR_AGORA'});
    };
    el.appendChild(btn);

    const dep = document.createElement('button');
    dep.textContent = 'Depois';
    dep.style.cssText = 'background:none;color:#c7d4f7;border:none;font-size:12.5px;'
                      + 'cursor:pointer;flex-shrink:0;';
    dep.onclick = function(){ el.remove(); };
    el.appendChild(dep);

    document.body.appendChild(el);
  }

  /* ---------------------------------------------------------
     2. INSTALAR NA TELA DE INÍCIO — proteção contra a regra dos 7 dias
     --------------------------------------------------------- */
  const ehIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
             || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const instalado = window.navigator.standalone === true
             || window.matchMedia('(display-mode: standalone)').matches;

  /* O aviso só faz sentido em CELULAR e TABLET, e é lá que ele resolve dois
     problemas de verdade: a regra dos 7 dias do iPhone, que apaga os dados de
     um site fora da Tela de Início, e o funcionamento sem sinal na obra.
     No computador ninguém "adiciona à tela inicial" — ali o app é aberto pelo
     arquivo ou pelo link, e a faixa amarela só atrapalhava. (Pedido em 30/08/2026.)
     A detecção é por APARELHO, não por largura de janela: encolher a janela do
     computador não devia fazer um aviso aparecer. */
  const ehMobile = ehIOS || /Android/i.test(navigator.userAgent);

  if(!instalado && ehMobile){
    const mostrar = function(){
      const main = document.getElementById('main');
      if(!main || document.getElementById('avisoInstalar')) return;

      /* Vai DEPOIS do cabeçalho, nunca antes. No celular o #topbar é a barra do
         app, com o recuo da área segura do iPhone; um aviso acima dele roubava
         esse recuo e empurrava tudo por baixo do relógio. */
      const ancora = document.getElementById('syncIndicador') || main.firstChild;

      const el = document.createElement('div');
      el.id = 'avisoInstalar';
      el.style.cssText = 'background:#fdf3e2;color:#8a5a00;border-bottom:2px solid #e39b00;'
                       + 'padding:11px 16px;font-size:12.5px;line-height:1.6;font-weight:600;';

      if(ehIOS){
        el.innerHTML = 'Instale o app na Tela de Início: toque em <b>Compartilhar</b> '
                     + '(o quadrado com a seta para cima) e depois em '
                     + '<b>Adicionar à Tela de Início</b>.<br>'
                     + '<span style="font-weight:400;">Enquanto ficar só no Safari, o iPhone '
                     + '<b>apaga os dados deste app</b> depois de 7 dias sem uso — e ele '
                     + 'só funciona offline depois de instalado.</span>';
      } else {
        el.innerHTML = 'Instale o app no aparelho pelo menu do navegador '
                     + '(<b>Adicionar à tela inicial</b>).<br>'
                     + '<span style="font-weight:400;">Instalado, ele abre sem internet '
                     + '— é o que faz funcionar na obra sem sinal.</span>';
      }
      main.insertBefore(el, ancora);
    };
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', mostrar);
    } else {
      mostrar();
    }
  }

  /* ---------------------------------------------------------
     3. MANIFEST — para o Android/Chrome oferecer a instalação.
     Vai embutido como data URI: assim o GitHub Pages continua
     servindo apenas index.html e sw.js, sem terceiro arquivo.
     No iPhone o manifest é ignorado — lá quem manda são as metas
     apple-* que já estão no <head>.
     --------------------------------------------------------- */
  (function(){
    if(document.querySelector('link[rel="manifest"]')) return;
    const mf = {
      name: 'RH Bela Angra',
      short_name: 'RH Bela Angra',
      start_url: './',
      scope: './',
      display: 'standalone',
      background_color: '#f3f4f7',
      theme_color: '#2b2e33',
      lang: 'pt-BR',
      /* sempre a logo do APP: o manifesto e' servido publicamente */
      icons: [{src: LOGO_APP, sizes: '512x512', type: 'image/svg+xml', purpose: 'any'}]
    };
    const blob = new Blob([JSON.stringify(mf)], {type: 'application/manifest+json'});
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = URL.createObjectURL(blob);
    document.head.appendChild(l);
  })();

})();
</script>
</body>
</html>
